<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TSL Match Operator Console</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { 'brand-green': '#009A44', 'brand-dark': '#09090b', 'brand-panel': '#18181b' } } }
        }
    </script>
    <style>
        body { background-color: #09090b; color: white; -webkit-tap-highlight-color: transparent; }
        .loader { border: 3px solid rgba(255,255,255,0.1); border-top: 3px solid #009A44; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="p-4 md:p-6 font-sans antialiased pb-20">
    
    <div class="max-w-md mx-auto">
        <div class="flex items-center justify-between mb-6 border-b border-white/10 pb-4">
            <div>
                <h1 class="text-lg font-black uppercase tracking-widest text-brand-green flex items-center gap-2">
                    <i data-lucide="radio" class="w-5 h-5 text-red-500 animate-pulse"></i> Match Operator
                </h1>
                <p class="text-[9px] text-gray-500 font-bold uppercase tracking-widest mt-1">Pro Event System</p>
            </div>
            <button onclick="fetchData()" class="bg-white/5 p-2 rounded-lg border border-white/10 text-gray-400 hover:text-white transition-colors">
                <i data-lucide="refresh-cw" id="icon-refresh" class="w-4 h-4"></i>
            </button>
        </div>

        <div id="loading-screen" class="flex flex-col items-center justify-center py-20">
            <div class="loader mb-4"></div>
            <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest animate-pulse">Menghubungkan ke Server...</p>
        </div>

        <div id="main-console" class="hidden space-y-5">
            
            <div class="bg-brand-panel border border-white/10 p-4 rounded-2xl shadow-xl">
                <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-2"><i data-lucide="calendar" class="w-3 h-3 inline mr-1 -mt-0.5"></i> 1. Pilih Laga Aktif</label>
                <select id="select-match" onchange="handleMatchChange()" class="w-full bg-black border border-white/10 rounded-xl px-4 py-3 text-xs font-bold text-white uppercase focus:border-brand-green outline-none appearance-none">
                    <option value="">-- Pilih Pertandingan --</option>
                </select>
            </div>

            <div id="event-area" class="opacity-50 pointer-events-none transition-all duration-300 space-y-5">
                
                <div>
                    <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-2"><i data-lucide="shield" class="w-3 h-3 inline mr-1 -mt-0.5"></i> 2. Pilih Tim</label>
                    <div class="flex gap-2">
                        <button id="btn-tim-kiri" onclick="handleTeamChange('kiri')" class="flex-1 bg-black border border-white/10 text-gray-400 font-bold text-[11px] py-3 rounded-xl uppercase transition-colors truncate px-2"></button>
                        <button id="btn-tim-kanan" onclick="handleTeamChange('kanan')" class="flex-1 bg-black border border-white/10 text-gray-400 font-bold text-[11px] py-3 rounded-xl uppercase transition-colors truncate px-2"></button>
                    </div>
                </div>

                <div>
                    <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-2"><i data-lucide="zap" class="w-3 h-3 inline mr-1 -mt-0.5"></i> 3. Tindakan / Kejadian</label>
                    <div class="grid grid-cols-4 gap-2">
                        <button onclick="setEventMode('Gol', this)" class="evt-btn bg-white/20 border border-white shadow-inner text-white font-bold text-[10px] py-3 rounded-xl uppercase transition-colors flex flex-col items-center gap-1">⚽ <span>Gol</span></button>
                        <button onclick="setEventMode('Kuning', this)" class="evt-btn bg-black border border-white/10 text-yellow-400 font-bold text-[10px] py-3 rounded-xl uppercase transition-colors flex flex-col items-center gap-1">🟨 <span>Kuning</span></button>
                        <button onclick="setEventMode('Merah', this)" class="evt-btn bg-black border border-white/10 text-red-500 font-bold text-[10px] py-3 rounded-xl uppercase transition-colors flex flex-col items-center gap-1">🟥 <span>Merah</span></button>
                        <button onclick="setEventMode('Substitusi', this)" class="evt-btn bg-black border border-white/10 text-brand-green font-black text-[9px] py-3 rounded-xl uppercase transition-colors flex flex-col items-center gap-1">🔄 <span>Ganti</span></button>
                    </div>
                </div>

                <div class="bg-brand-panel border border-brand-green/30 p-4 rounded-2xl shadow-[0_0_20px_rgba(0,154,68,0.05)]">
                    
                    <div class="flex gap-3 mb-3">
                        <div id="ui-normal" class="flex-1">
                            <label class="block text-[10px] font-bold text-brand-green uppercase tracking-widest mb-2">Pemain Utama</label>
                            <select id="select-pemain" class="w-full bg-black border border-white/10 rounded-xl px-4 py-3 text-xs font-bold text-white uppercase focus:border-brand-green outline-none appearance-none">
                                <option value="">-- Pilih Tim Dulu --</option>
                            </select>
                        </div>

                        <div id="ui-sub" class="flex-1 hidden space-y-3">
                            <div>
                                <label class="block text-[10px] font-bold text-red-500 uppercase tracking-widest mb-1.5 flex items-center gap-1"><i data-lucide="arrow-down-circle" class="w-3 h-3"></i> Pemain Keluar</label>
                                <select id="select-pemain-out" class="w-full bg-black border border-red-500/30 rounded-xl px-4 py-2.5 text-xs font-bold text-white uppercase focus:border-red-500 outline-none appearance-none">
                                    <option value="">-- Pilih Tim Dulu --</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-[10px] font-bold text-brand-green uppercase tracking-widest mb-1.5 flex items-center gap-1"><i data-lucide="arrow-up-circle" class="w-3 h-3"></i> Pemain Masuk (Pengganti)</label>
                                <select id="select-pemain-in" class="w-full bg-black border border-brand-green/30 rounded-xl px-4 py-2.5 text-xs font-bold text-white uppercase focus:border-brand-green outline-none appearance-none">
                                    <option value="">-- Pilih Tim Dulu --</option>
                                </select>
                            </div>
                        </div>

                        <div class="w-16 shrink-0">
                            <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-2 text-center">Menit</label>
                            <input type="number" id="input-menit" placeholder="00" class="w-full bg-black border border-white/10 rounded-xl px-2 py-3 text-sm font-black text-white text-center focus:border-brand-green outline-none appearance-none">
                        </div>
                    </div>

                    <button onclick="submitEvent()" id="btn-submit" class="w-full bg-brand-green hover:bg-emerald-600 text-white font-black text-sm uppercase tracking-widest py-3.5 rounded-xl shadow-[0_0_20px_rgba(0,154,68,0.3)] transition-all transform active:scale-95 flex justify-center items-center gap-2">
                        <i data-lucide="send" class="w-4 h-4"></i> Eksekusi
                    </button>
                </div>
            </div>

            <div id="log-status" class="text-center text-[10px] font-bold uppercase tracking-widest px-4 py-3 rounded-lg bg-black/50 border border-white/5 hidden"></div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        // API URL (Pastikan ini URL Deploy terbaru Anda)
        const API_URL = "https://script.google.com/macros/s/AKfycbzAeXyhA-VIDTJQfmOnPfv0o9NZQXJg9PIk1r1FpSWeqH3TvInjK6QnhONhLieHiqY/exec";
        
        let matchesData = [];
        let playersData = [];
        let selectedMatchData = null;
        let selectedTeamName = "";
        let currentMode = 'Gol'; // Default

        async function fetchData() {
            document.getElementById('loading-screen').classList.remove('hidden');
            document.getElementById('main-console').classList.add('hidden');
            document.getElementById('icon-refresh').classList.add('animate-spin');

            try {
                let resJadwal = await fetch(API_URL + "?sheet=Jadwal");
                matchesData = await resJadwal.json();
                
                let resPemain = await fetch(API_URL + "?sheet=Pemain");
                playersData = await resPemain.json();

                populateMatchSelect();
            } catch (error) {
                alert("Gagal menarik data. Pastikan Tab 'Jadwal' dan 'Pemain' ada di Spreadsheet.");
            } finally {
                document.getElementById('loading-screen').classList.add('hidden');
                document.getElementById('main-console').classList.remove('hidden');
                document.getElementById('icon-refresh').classList.remove('animate-spin');
            }
        }

        function populateMatchSelect() {
            let select = document.getElementById('select-match');
            select.innerHTML = '<option value="">-- Pilih Pertandingan Aktif --</option>';
            matchesData.forEach(match => {
                // Toleransi nama kolom id_match, ID_Match, id
                let idm = match.id_match || match.ID_Match || match.id;
                let tkiri = match.tim_kiri || match.Tim_Kiri || match.Klub_Kiri;
                let tkanan = match.tim_kanan || match.Tim_Kanan || match.Klub_Kanan;
                if(idm) select.innerHTML += `<option value="${idm}">${tkiri} VS ${tkanan} (${idm})</option>`;
            });
        }

        function handleMatchChange() {
            let matchId = document.getElementById('select-match').value;
            let eventArea = document.getElementById('event-area');
            
            if(!matchId) { eventArea.classList.add('opacity-50', 'pointer-events-none'); return; }

            selectedMatchData = matchesData.find(m => String(m.id_match || m.ID_Match || m.id) === String(matchId));
            
            let btnKiri = document.getElementById('btn-tim-kiri');
            let btnKanan = document.getElementById('btn-tim-kanan');
            btnKiri.innerText = selectedMatchData.tim_kiri || selectedMatchData.Tim_Kiri;
            btnKanan.innerText = selectedMatchData.tim_kanan || selectedMatchData.Tim_Kanan;
            
            btnKiri.className = "flex-1 bg-black border border-white/10 text-gray-400 font-bold text-[11px] py-3 rounded-xl uppercase transition-colors truncate px-2";
            btnKanan.className = "flex-1 bg-black border border-white/10 text-gray-400 font-bold text-[11px] py-3 rounded-xl uppercase transition-colors truncate px-2";
            
            document.getElementById('select-pemain').innerHTML = '<option value="">-- Pilih Tim Dulu --</option>';
            document.getElementById('select-pemain-out').innerHTML = '<option value="">-- Pilih Tim Dulu --</option>';
            document.getElementById('select-pemain-in').innerHTML = '<option value="">-- Pilih Tim Dulu --</option>';
            selectedTeamName = "";
            
            eventArea.classList.remove('opacity-50', 'pointer-events-none');
        }

        function handleTeamChange(posisi) {
            selectedTeamName = posisi === 'kiri' ? (selectedMatchData.tim_kiri || selectedMatchData.Tim_Kiri) : (selectedMatchData.tim_kanan || selectedMatchData.Tim_Kanan);
            
            let btnKiri = document.getElementById('btn-tim-kiri');
            let btnKanan = document.getElementById('btn-tim-kanan');
            btnKiri.classList.remove('bg-brand-green/20', 'border-brand-green', 'text-brand-green');
            btnKanan.classList.remove('bg-brand-green/20', 'border-brand-green', 'text-brand-green');
            
            if(posisi === 'kiri') btnKiri.classList.add('bg-brand-green/20', 'border-brand-green', 'text-brand-green');
            else btnKanan.classList.add('bg-brand-green/20', 'border-brand-green', 'text-brand-green');

            // FILTER "SUPER PEMAAF": Otomatis mencari kolom klub/tim dan nama
            let filteredPlayers = playersData.filter(p => {
                let dbKlub = String(p.klub || p.Klub || p.tim || p.Tim || "").toLowerCase().trim();
                return dbKlub === String(selectedTeamName).toLowerCase().trim();
            });
            
            let optionsHTML = '<option value="">-- Pilih Pemain --</option>';
            if(filteredPlayers.length === 0) {
                optionsHTML = '<option value="">(Data Pemain Tidak Ditemukan)</option>';
            } else {
                filteredPlayers.forEach(p => {
                    let dbNama = p.nama_pemain || p.nama || p.Pemain || p['Nama Pemain'] || "";
                    let dbNo = p.no_punggung || p.No || "";
                    optionsHTML += `<option value="${dbNama}">${dbNama} ${dbNo ? '('+dbNo+')' : ''}</option>`;
                });
            }

            // Sebarkan data ke semua kotak dropdown
            document.getElementById('select-pemain').innerHTML = optionsHTML;
            document.getElementById('select-pemain-out').innerHTML = optionsHTML;
            document.getElementById('select-pemain-in').innerHTML = optionsHTML;
        }

        // TOGGLE ANTARMUKA: NORMAL VS SUBSTITUSI
        function setEventMode(jenis, btn) {
            currentMode = jenis;
            document.querySelectorAll('.evt-btn').forEach(b => {
                b.classList.remove('bg-white/20', 'border-white', 'shadow-inner');
                b.classList.add('bg-black');
            });
            btn.classList.remove('bg-black');
            btn.classList.add('bg-white/20', 'border-white', 'shadow-inner');

            if(jenis === 'Substitusi') {
                document.getElementById('ui-normal').classList.add('hidden');
                document.getElementById('ui-sub').classList.remove('hidden');
            } else {
                document.getElementById('ui-normal').classList.remove('hidden');
                document.getElementById('ui-sub').classList.add('hidden');
            }
        }

        async function submitEvent() {
            const id_match = document.getElementById('select-match').value;
            const tim = selectedTeamName;
            const menit = document.getElementById('input-menit').value;
            const btn = document.getElementById('btn-submit');
            const statusLog = document.getElementById('log-status');

            if(!id_match || !tim || !menit) { alert("Pilih Tim dan isi Menit terlebih dahulu!"); return; }

            // FUNGSI BANTUAN UNTUK MENGIRIM 1 POST
            const sendPost = async (p_nama, p_jenis) => {
                await fetch(API_URL, {
                    method: 'POST',
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify({
                        action: 'submit_event',
                        payload: { id_match: id_match, waktu: new Date().toISOString(), menit: menit, tim: tim, pemain: p_nama, jenis: p_jenis }
                    })
                });
            };

            btn.innerHTML = `<i data-lucide="loader" class="w-4 h-4 animate-spin"></i> Memproses...`; 
            btn.disabled = true;
            statusLog.classList.remove('hidden');
            statusLog.innerHTML = `<span class="text-yellow-500">Merekam data ke server...</span>`;
            lucide.createIcons();

            try {
                if(currentMode === 'Substitusi') {
                    // MODE DUAL-SELECT (Kirim 2 baris ke Sheets sekaligus)
                    const pOut = document.getElementById('select-pemain-out').value;
                    const pIn = document.getElementById('select-pemain-in').value;
                    
                    if(!pOut || !pIn) throw new Error("Pilih Pemain Keluar dan Masuk!");
                    
                    await sendPost(pOut, 'Sub Out');
                    await sendPost(pIn, 'Sub In');
                    
                    statusLog.innerHTML = `<span class="text-brand-green">Sukses! Pergantian [${pOut} ➔ ${pIn}] tercatat.</span>`;
                    document.getElementById('select-pemain-out').value = '';
                    document.getElementById('select-pemain-in').value = '';
                } else {
                    // MODE NORMAL
                    const pNormal = document.getElementById('select-pemain').value;
                    if(!pNormal) throw new Error("Pilih Pemain terlebih dahulu!");
                    
                    await sendPost(pNormal, currentMode);
                    
                    statusLog.innerHTML = `<span class="text-brand-green">Sukses! ${currentMode} untuk ${pNormal} tercatat.</span>`;
                    document.getElementById('select-pemain').value = '';
                }
            } catch(e) {
                statusLog.innerHTML = `<span class="text-red-500">Gagal: ${e.message}</span>`;
            } finally {
                btn.innerHTML = `<i data-lucide="send" class="w-4 h-4"></i> Eksekusi`; 
                btn.disabled = false;
                lucide.createIcons();
            }
        }

        window.onload = fetchData;
    </script>
</body>
</html>
