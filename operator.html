<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TSL Pro Operator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { 'brand-green': '#009A44', 'brand-dark': '#09090b', 'brand-panel': '#18181b', 'brand-gold': '#d7b67d' } } }
        }
    </script>
    <style>
        body { background-color: #09090b; color: white; -webkit-tap-highlight-color: transparent; font-family: 'Inter', sans-serif; }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .loader { border: 3px solid rgba(255,255,255,0.1); border-top: 3px solid #009A44; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        
        /* MINI PITCH TACTICAL BUILDER */
        .tactical-pitch { position: relative; width: 100%; max-width: 380px; margin: 0 auto; border-radius: 12px; overflow: hidden; border: 1px solid rgba(255,255,255,0.15); background-color: #062110; background-image: repeating-linear-gradient(0deg, transparent, transparent 10%, rgba(255,255,255,0.03) 10%, rgba(255,255,255,0.03) 20%); box-shadow: inset 0 0 30px rgba(0,0,0,0.8); }
        .tactical-pitch::before { content: ""; display: block; padding-top: 135%; }
        .pitch-lines { position: absolute; inset: 0; pointer-events: none; }
        .p-line { position: absolute; border: 1.5px solid rgba(255,255,255,0.2); }
        
        .builder-slot { position: absolute; width: 40px; height: 40px; border-radius: 50%; transform: translate(-50%, 50%); z-index: 10; display: flex; flex-direction: column; items-center; justify-content: center; cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.5); }
        .builder-slot.empty { background: rgba(0,0,0,0.6); border: 2px dashed rgba(255,255,255,0.5); backdrop-filter: blur(4px); }
        .builder-slot.empty:hover { border-color: #009A44; background: rgba(0,154,68,0.2); transform: translate(-50%, 50%) scale(1.1); }
        .builder-slot.filled { background-color: #fff; border: 2px solid #009A44; background-size: cover; background-position: center; }
        .slot-label { position: absolute; bottom: -18px; left: 50%; transform: translateX(-50%); white-space: nowrap; font-size: 8px; font-weight: 900; background: rgba(0,0,0,0.8); padding: 2px 6px; border-radius: 4px; color: white; border: 1px solid rgba(255,255,255,0.2); text-transform: uppercase; }
        
        .modal-up { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    </style>
</head>
<body class="pb-24">
    <div class="max-w-md mx-auto p-4 md:p-6">
        
        <!-- HEADER -->
        <div class="mb-5 border-b border-white/10 pb-4 flex items-center justify-between">
            <div>
                <h1 class="text-lg font-black uppercase tracking-widest text-brand-green flex items-center gap-2">
                    <i data-lucide="radio" class="w-5 h-5 text-red-500 animate-pulse"></i> Pro Operator
                </h1>
                <p class="text-[9px] text-gray-500 font-bold uppercase tracking-widest mt-0.5">Visual Lineup & Live Data</p>
            </div>
            <button onclick="fetchData()" class="bg-white/5 p-2 rounded-lg border border-white/10"><i data-lucide="refresh-cw" id="icon-refresh" class="w-4 h-4 text-gray-400"></i></button>
        </div>

        <!-- TABS -->
        <div class="flex gap-2 bg-black p-1 rounded-xl border border-white/10 mb-5">
            <button id="tab-live" onclick="switchMode('live')" class="flex-1 py-2.5 text-[10px] font-bold uppercase tracking-widest bg-brand-green/20 text-brand-green border border-brand-green/50 rounded-lg transition-colors">⚡ Live Event</button>
            <button id="tab-lineup" onclick="switchMode('lineup')" class="flex-1 py-2.5 text-[10px] font-bold uppercase tracking-widest text-gray-500 hover:text-white rounded-lg transition-colors">📋 Rakit Lineup</button>
        </div>

        <div id="loading-screen" class="flex flex-col items-center py-10"><div class="loader mb-4"></div><p class="text-[10px] text-gray-400 font-bold uppercase tracking-widest">Sinkronisasi Server...</p></div>

        <!-- GLOBAL SELECTOR (PILIH LAGA & TIM) -->
        <div id="global-selectors" class="hidden space-y-4 mb-5">
            <select id="select-match" onchange="handleMatchChange()" class="w-full bg-brand-panel border border-white/10 rounded-xl px-4 py-3 text-[11px] font-bold uppercase outline-none shadow-sm"><option value="">-- 1. Pilih Pertandingan Aktif --</option></select>
            <div id="team-selectors" class="hidden flex gap-2">
                <button id="btn-tim-kiri" onclick="handleTeamChange('kiri')" class="flex-1 bg-black border border-white/10 text-gray-400 font-bold text-[11px] py-3 rounded-xl uppercase truncate px-2"></button>
                <button id="btn-tim-kanan" onclick="handleTeamChange('kanan')" class="flex-1 bg-black border border-white/10 text-gray-400 font-bold text-[11px] py-3 rounded-xl uppercase truncate px-2"></button>
            </div>
        </div>

        <!-- ========================================== -->
        <!-- MODE 1: LIVE EVENTS -->
        <!-- ========================================== -->
        <div id="mode-live" class="hidden space-y-5 opacity-50 pointer-events-none transition-opacity">
            <div class="bg-brand-panel border border-brand-green/30 p-5 rounded-2xl shadow-[0_0_20px_rgba(0,154,68,0.05)]">
                <div class="grid grid-cols-4 gap-2 mb-4">
                    <button onclick="setEventMode('Gol', this)" class="evt-btn bg-white/20 border border-white text-white font-bold text-[9px] py-3 rounded-xl uppercase flex flex-col items-center">⚽ <span>Gol</span></button>
                    <button onclick="setEventMode('Kuning', this)" class="evt-btn bg-black border border-white/10 text-yellow-400 font-bold text-[9px] py-3 rounded-xl uppercase flex flex-col items-center">🟨 <span>Kuning</span></button>
                    <button onclick="setEventMode('Merah', this)" class="evt-btn bg-black border border-white/10 text-red-500 font-bold text-[9px] py-3 rounded-xl uppercase flex flex-col items-center">🟥 <span>Merah</span></button>
                    <button onclick="setEventMode('Substitusi', this)" class="evt-btn bg-black border border-white/10 text-brand-green font-black text-[9px] py-3 rounded-xl uppercase flex flex-col items-center">🔄 <span>Ganti</span></button>
                </div>
                <div class="flex gap-3 mb-4">
                    <div id="ui-normal" class="flex-1"><select id="select-pemain" class="w-full bg-black border border-white/10 rounded-xl px-4 py-3 text-xs font-bold uppercase outline-none"><option value="">-- Pilih Pemain --</option></select></div>
                    <div id="ui-sub" class="flex-1 hidden space-y-2">
                        <select id="select-pemain-out" class="w-full bg-black border border-red-500/30 text-red-500 rounded-xl px-3 py-2 text-[10px] font-bold uppercase"><option value="">-- Pemain Keluar ⬇️ --</option></select>
                        <select id="select-pemain-in" class="w-full bg-black border border-brand-green/30 text-brand-green rounded-xl px-3 py-2 text-[10px] font-bold uppercase"><option value="">-- Pengganti Masuk ⬆️ --</option></select>
                    </div>
                    <div class="w-16 shrink-0"><input type="number" id="input-menit" placeholder="MNT" class="w-full bg-black border border-white/10 rounded-xl px-2 py-3 text-sm font-black text-center outline-none"></div>
                </div>
                <input type="hidden" id="input-jenis" value="Gol">
                <button onclick="submitEvent()" id="btn-submit-live" class="w-full bg-brand-green text-white font-black text-xs uppercase tracking-widest py-3.5 rounded-xl flex justify-center items-center gap-2 shadow-[0_0_15px_rgba(0,154,68,0.3)]"><i data-lucide="send" class="w-4 h-4"></i> Eksekusi Data</button>
            </div>
        </div>

        <!-- ========================================== -->
        <!-- MODE 2: VISUAL LINEUP BUILDER -->
        <!-- ========================================== -->
        <div id="mode-lineup" class="hidden space-y-5 opacity-50 pointer-events-none transition-opacity">
            <div class="bg-brand-panel border border-brand-gold/30 p-5 rounded-2xl shadow-xl">
                
                <div class="flex justify-between items-center mb-4">
                    <label class="text-[10px] font-bold text-brand-gold uppercase tracking-widest">Papan Taktik (Starter XI)</label>
                    <select id="select-formasi" onchange="renderPitch()" class="bg-black border border-brand-gold/30 text-brand-gold rounded-lg px-3 py-1.5 text-[10px] font-black uppercase outline-none">
                        <option value="4-3-3">4-3-3</option><option value="4-2-3-1">4-2-3-1</option><option value="4-4-2">4-4-2</option><option value="3-5-2">3-5-2</option>
                    </select>
                </div>
                
                <!-- VISUAL PITCH -->
                <div class="tactical-pitch mb-6">
                    <div class="pitch-lines">
                        <div class="p-line" style="top:50%; left:0; right:0; height:0; border-top-width:2px; transform:translateY(-50%); border-color:rgba(255,255,255,0.1)"></div>
                        <div class="p-line" style="top:50%; left:50%; width:80px; height:80px; border-radius:50%; transform:translate(-50%,-50%); border-color:rgba(255,255,255,0.1)"></div>
                        <div class="p-line" style="bottom:-2px; left:20%; width:60%; height:18%; border-bottom:0; border-color:rgba(255,255,255,0.2)"></div>
                    </div>
                    <div id="pitch-slots" class="absolute inset-0 z-10 w-full h-full"></div>
                </div>

                <!-- EXTRA ROSTER (BENCH, INJURY, SUSPENSION) -->
                <div class="space-y-4 border-t border-white/10 pt-5">
                    
                    <!-- CADANGAN -->
                    <div>
                        <div class="flex justify-between items-center mb-2">
                            <label class="text-[10px] font-bold text-gray-400 uppercase tracking-widest flex items-center gap-1.5"><i data-lucide="users" class="w-3 h-3 text-blue-400"></i> Bangku Cadangan</label>
                            <button onclick="openPicker('bench')" class="bg-white/10 px-2 py-1 rounded text-[8px] font-bold uppercase hover:bg-white/20">+ Tambah</button>
                        </div>
                        <div id="list-bench" class="flex flex-wrap gap-2 bg-black/50 p-3 rounded-xl border border-white/5 min-h-[50px]"></div>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <!-- CEDERA -->
                        <div>
                            <div class="flex justify-between items-center mb-2">
                                <label class="text-[9px] font-bold text-gray-400 uppercase tracking-widest">🚑 Cedera</label>
                                <button onclick="openPicker('cedera')" class="bg-white/10 px-2 py-1 rounded text-[8px] font-bold uppercase">+</button>
                            </div>
                            <div id="list-cedera" class="flex flex-col gap-1.5 bg-black/50 p-2 rounded-xl border border-white/5 min-h-[40px]"></div>
                        </div>
                        <!-- SKORSING -->
                        <div>
                            <div class="flex justify-between items-center mb-2">
                                <label class="text-[9px] font-bold text-gray-400 uppercase tracking-widest">🟥 Skorsing</label>
                                <button onclick="openPicker('skorsing')" class="bg-white/10 px-2 py-1 rounded text-[8px] font-bold uppercase">+</button>
                            </div>
                            <div id="list-skorsing" class="flex flex-col gap-1.5 bg-black/50 p-2 rounded-xl border border-white/5 min-h-[40px]"></div>
                        </div>
                    </div>

                </div>

                <div class="flex gap-2 mt-6">
                    <button onclick="resetLineup()" class="bg-red-500/10 text-red-500 border border-red-500/30 font-bold text-[10px] uppercase px-4 rounded-xl">Reset</button>
                    <button onclick="submitLineup()" id="btn-submit-lineup" class="flex-1 bg-brand-gold text-black font-black text-xs uppercase py-3.5 rounded-xl flex justify-center items-center gap-2 shadow-[0_0_15px_rgba(215,182,125,0.3)]"><i data-lucide="upload-cloud" class="w-4 h-4"></i> Simpan Lineup Resmi</button>
                </div>
            </div>
        </div>

        <div id="log-status" class="mt-4 text-center text-[10px] font-bold uppercase tracking-widest px-4 py-3 rounded-lg bg-black/50 border border-white/5 hidden"></div>
    </div>

    <!-- ========================================== -->
    <!-- MODAL PEMILIH PEMAIN (BOTTOM SHEET) -->
    <!-- ========================================== -->
    <div id="modal-picker" class="fixed inset-0 z-[100] hidden flex-col justify-end">
        <div class="absolute inset-0 bg-black/80 backdrop-blur-sm" onclick="closePicker()"></div>
        <div class="relative bg-brand-panel border-t border-white/10 rounded-t-[2rem] shadow-2xl modal-up flex flex-col h-[75vh] max-w-md mx-auto w-full pb-safe">
            <div class="p-5 border-b border-white/10 flex justify-between items-center shrink-0">
                <div><h3 id="picker-title" class="font-black text-lg uppercase text-white tracking-widest">Pilih Pemain</h3><p id="picker-subtitle" class="text-[9px] font-bold text-brand-green uppercase tracking-widest mt-0.5">Posisi: ST</p></div>
                <button onclick="closePicker()" class="w-8 h-8 bg-white/10 rounded-full flex justify-center items-center font-bold text-gray-400 hover:text-white">&times;</button>
            </div>
            <div class="p-3 bg-black/50 border-b border-white/5 shrink-0">
                <input type="text" id="picker-search" oninput="renderPickerList()" placeholder="Cari nama atau posisi..." class="w-full bg-black border border-white/10 rounded-xl px-4 py-2.5 text-xs text-white uppercase outline-none focus:border-brand-green">
            </div>
            <div id="picker-list" class="flex-1 overflow-y-auto hide-scroll p-3 flex flex-col gap-2"></div>
            
            <div id="picker-remove-btn" class="hidden p-4 border-t border-white/5 shrink-0">
                <button onclick="removeSelectedPlayer()" class="w-full bg-red-500/10 border border-red-500/30 text-red-500 font-bold uppercase text-[10px] py-3 rounded-xl tracking-widest"><i data-lucide="trash-2" class="w-3 h-3 inline pb-0.5"></i> Kosongkan Slot Ini</button>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();
        const API_URL = "https://script.google.com/macros/s/AKfycbzAeXyhA-VIDTJQfmOnPfv0o9NZQXJg9PIk1r1FpSWeqH3TvInjK6QnhONhLieHiqY/exec";
        
        let matchesData = []; let playersData = []; 
        let selectedMatchId = ''; let selectedTeamName = ''; let currentMode = 'live'; let currentEvtMode = 'Gol';

        // TACTICAL ENGINE DATA
        const FORMATIONS = {
            '4-3-3': [{b:'10%', l:'50%', role:'GK'}, {b:'25%', l:'15%', role:'LB'}, {b:'25%', l:'35%', role:'CB'}, {b:'25%', l:'65%', role:'CB'}, {b:'25%', l:'85%', role:'RB'}, {b:'45%', l:'50%', role:'CDM'}, {b:'55%', l:'30%', role:'CM'}, {b:'55%', l:'70%', role:'CM'}, {b:'80%', l:'20%', role:'LW'}, {b:'80%', l:'80%', role:'RW'}, {b:'85%', l:'50%', role:'ST'}],
            '4-4-2': [{b:'10%', l:'50%', role:'GK'}, {b:'25%', l:'15%', role:'LB'}, {b:'25%', l:'35%', role:'CB'}, {b:'25%', l:'65%', role:'CB'}, {b:'25%', l:'85%', role:'RB'}, {b:'50%', l:'15%', role:'LM'}, {b:'45%', l:'35%', role:'CM'}, {b:'45%', l:'65%', role:'CM'}, {b:'50%', l:'85%', role:'RM'}, {b:'80%', l:'35%', role:'CF'}, {b:'80%', l:'65%', role:'CF'}],
            '4-2-3-1': [{b:'10%', l:'50%', role:'GK'}, {b:'25%', l:'15%', role:'LB'}, {b:'25%', l:'35%', role:'CB'}, {b:'25%', l:'65%', role:'CB'}, {b:'25%', l:'85%', role:'RB'}, {b:'45%', l:'35%', role:'CDM'}, {b:'45%', l:'65%', role:'CDM'}, {b:'65%', l:'20%', role:'LAM'}, {b:'65%', l:'50%', role:'CAM'}, {b:'65%', l:'80%', role:'RAM'}, {b:'85%', l:'50%', role:'ST'}],
            '3-5-2': [{b:'10%', l:'50%', role:'GK'}, {b:'25%', l:'25%', role:'CB'}, {b:'25%', l:'50%', role:'CB'}, {b:'25%', l:'75%', role:'CB'}, {b:'45%', l:'35%', role:'CM'}, {b:'45%', l:'65%', role:'CM'}, {b:'60%', l:'15%', role:'LWB'}, {b:'60%', l:'85%', role:'RWB'}, {b:'65%', l:'50%', role:'CAM'}, {b:'85%', l:'35%', role:'ST'}, {b:'85%', l:'65%', role:'ST'}]
        };

        let activeContext = { type: null, index: null }; // type: 'starter', 'bench', 'cedera', 'skorsing'
        let lineupState = { starters: new Array(11).fill(null), bench: [], cedera: [], skorsing: [] };

        async function fetchData() {
            document.getElementById('loading-screen').classList.remove('hidden'); document.getElementById('global-selectors').classList.add('hidden'); document.getElementById('icon-refresh').classList.add('animate-spin');
            try {
                matchesData = await (await fetch(API_URL + "?sheet=Jadwal")).json();
                playersData = await (await fetch(API_URL + "?sheet=Pemain")).json();
                
                let select = document.getElementById('select-match'); select.innerHTML = '<option value="">-- 1. Pilih Pertandingan --</option>';
                matchesData.forEach(m => { let idm = m.id_match || m.ID_Match; if(idm) select.innerHTML += `<option value="${idm}">${m.tim_kiri || m.Tim_Kiri} VS ${m.tim_kanan || m.Tim_Kanan} (${idm})</option>`; });
            } catch(e) { alert("Gagal koneksi server."); } 
            finally { document.getElementById('loading-screen').classList.add('hidden'); document.getElementById('global-selectors').classList.remove('hidden'); document.getElementById('icon-refresh').classList.remove('animate-spin'); switchMode('live'); }
        }

        function switchMode(mode) {
            currentMode = mode;
            document.getElementById('tab-live').className = mode==='live' ? "flex-1 py-2.5 text-[10px] font-bold uppercase tracking-widest bg-brand-green/20 text-brand-green border border-brand-green/50 rounded-lg transition-colors" : "flex-1 py-2.5 text-[10px] font-bold uppercase tracking-widest text-gray-500 hover:text-white rounded-lg transition-colors";
            document.getElementById('tab-lineup').className = mode==='lineup' ? "flex-1 py-2.5 text-[10px] font-bold uppercase tracking-widest bg-brand-gold/20 text-brand-gold border border-brand-gold/50 rounded-lg transition-colors" : "flex-1 py-2.5 text-[10px] font-bold uppercase tracking-widest text-gray-500 hover:text-white rounded-lg transition-colors";
            
            if(mode==='live') { document.getElementById('mode-live').classList.remove('hidden'); document.getElementById('mode-lineup').classList.add('hidden'); } 
            else { document.getElementById('mode-lineup').classList.remove('hidden'); document.getElementById('mode-live').classList.add('hidden'); renderPitch(); renderExtraRoster(); }
        }

        function handleMatchChange() {
            selectedMatchId = document.getElementById('select-match').value;
            let match = matchesData.find(m => String(m.id_match||m.ID_Match) === String(selectedMatchId));
            if(!match) { 
                document.getElementById('team-selectors').classList.add('hidden'); 
                document.getElementById('mode-live').classList.add('opacity-50', 'pointer-events-none');
                document.getElementById('mode-lineup').classList.add('opacity-50', 'pointer-events-none');
                return; 
            }
            document.getElementById('btn-tim-kiri').innerText = match.tim_kiri || match.Tim_Kiri;
            document.getElementById('btn-tim-kanan').innerText = match.tim_kanan || match.Tim_Kanan;
            document.getElementById('btn-tim-kiri').className = "flex-1 bg-black border border-white/10 text-gray-400 font-bold text-[11px] py-3 rounded-xl uppercase truncate px-2";
            document.getElementById('btn-tim-kanan').className = "flex-1 bg-black border border-white/10 text-gray-400 font-bold text-[11px] py-3 rounded-xl uppercase truncate px-2";
            document.getElementById('team-selectors').classList.remove('hidden'); selectedTeamName = "";
        }

        function handleTeamChange(posisi) {
            let match = matchesData.find(m => String(m.id_match||m.ID_Match) === String(selectedMatchId));
            selectedTeamName = posisi === 'kiri' ? (match.tim_kiri || match.Tim_Kiri) : (match.tim_kanan || match.Tim_Kanan);
            
            document.getElementById('btn-tim-kiri').className = posisi==='kiri' ? "flex-1 bg-brand-green/20 border border-brand-green text-brand-green font-bold text-[11px] py-3 rounded-xl uppercase truncate px-2" : "flex-1 bg-black border border-white/10 text-gray-400 font-bold text-[11px] py-3 rounded-xl uppercase truncate px-2";
            document.getElementById('btn-tim-kanan').className = posisi==='kanan' ? "flex-1 bg-brand-green/20 border border-brand-green text-brand-green font-bold text-[11px] py-3 rounded-xl uppercase truncate px-2" : "flex-1 bg-black border border-white/10 text-gray-400 font-bold text-[11px] py-3 rounded-xl uppercase truncate px-2";

            let filtered = playersData.filter(p => String(p.klub||p.Klub||p.tim||p.Tim||"").toLowerCase().trim() === String(selectedTeamName).toLowerCase().trim());
            
            // 1. Update Dropdown Mode Live
            let opt = '<option value="">-- Pilih Pemain --</option>';
            filtered.forEach(p => { let nm = p.nama_pemain||p.nama||p.Pemain; opt += `<option value="${nm}">${nm} ${p.no_punggung ? '('+p.no_punggung+')':''}</option>`; });
            document.getElementById('select-pemain').innerHTML = opt; document.getElementById('select-pemain-out').innerHTML = opt; document.getElementById('select-pemain-in').innerHTML = opt;
            document.getElementById('mode-live').classList.remove('opacity-50', 'pointer-events-none');
            
            // 2. Buka Mode Lineup & Reset State
            document.getElementById('mode-lineup').classList.remove('opacity-50', 'pointer-events-none');
            resetLineup();
        }

        // ==========================================
        // TACTICAL PITCH & ROSTER ENGINE
        // ==========================================
        function resetLineup() { lineupState = { starters: new Array(11).fill(null), bench: [], cedera: [], skorsing: [] }; renderPitch(); renderExtraRoster(); }

        function renderPitch() {
            const formKey = document.getElementById('select-formasi').value;
            const slots = FORMATIONS[formKey];
            let container = document.getElementById('pitch-slots');
            let html = '';
            
            slots.forEach((s, i) => {
                let p = lineupState.starters[i];
                if(p) {
                    let nm = p.nama_pemain||p.nama||p.Pemain; let f = p.foto ? p.foto : `https://ui-avatars.com/api/?name=${nm}&background=fff&color=000&bold=true`;
                    html += `
                    <div class="builder-slot filled" style="bottom:${s.b}; left:${s.l}; background-image:url('${f}')" onclick="openPicker('starter', ${i})">
                        <span class="slot-label bg-brand-green border-brand-green text-white">${nm.split(' ')[0]}</span>
                    </div>`;
                } else {
                    html += `
                    <div class="builder-slot empty" style="bottom:${s.b}; left:${s.l};" onclick="openPicker('starter', ${i})">
                        <i data-lucide="plus" class="w-4 h-4 text-white/50 mx-auto mt-2"></i>
                        <span class="slot-label">${s.role}</span>
                    </div>`;
                }
            });
            container.innerHTML = html; lucide.createIcons();
        }

        function renderExtraRoster() {
            const buildBadge = (arr, type) => {
                if(arr.length === 0) return '<div class="text-[8px] text-gray-500 italic w-full">Kosong</div>';
                return arr.map((p, i) => {
                    let nm = p.nama_pemain||p.nama||p.Pemain;
                    return `<div class="bg-gray-800 border border-gray-600 px-2 py-1 rounded text-[9px] font-bold text-white uppercase flex items-center gap-2">${nm} <button onclick="removeExtra('${type}', ${i})" class="text-red-400 hover:text-red-300">&times;</button></div>`;
                }).join('');
            };
            document.getElementById('list-bench').innerHTML = buildBadge(lineupState.bench, 'bench');
            document.getElementById('list-cedera').innerHTML = buildBadge(lineupState.cedera, 'cedera');
            document.getElementById('list-skorsing').innerHTML = buildBadge(lineupState.skorsing, 'skorsing');
        }

        function removeExtra(type, index) { lineupState[type].splice(index, 1); renderExtraRoster(); }

        // ==========================================
        // BOTTOM SHEET PICKER
        // ==========================================
        function openPicker(type, index = null) {
            if(!selectedTeamName) return alert("Pilih tim terlebih dahulu!");
            activeContext = { type, index };
            
            let title = '', sub = '';
            if(type === 'starter') { title = 'Pilih Starter XI'; sub = `Posisi Slot: ${FORMATIONS[document.getElementById('select-formasi').value][index].role}`; document.getElementById('picker-remove-btn').classList.remove('hidden'); }
            else if(type === 'bench') { title = 'Pilih Cadangan'; sub = 'Tambahkan ke bangku cadangan'; document.getElementById('picker-remove-btn').classList.add('hidden'); }
            else if(type === 'cedera') { title = 'Pilih Pemain Cedera'; sub = 'Tandai 🚑'; document.getElementById('picker-remove-btn').classList.add('hidden'); }
            else if(type === 'skorsing') { title = 'Pilih Skorsing'; sub = 'Tandai 🟥'; document.getElementById('picker-remove-btn').classList.add('hidden'); }

            document.getElementById('picker-title').innerText = title; document.getElementById('picker-subtitle').innerText = sub;
            document.getElementById('picker-search').value = '';
            renderPickerList();
            
            document.getElementById('modal-picker').classList.remove('hidden'); document.getElementById('modal-picker').classList.add('flex'); document.body.style.overflow = 'hidden';
        }

        function closePicker() { document.getElementById('modal-picker').classList.add('hidden'); document.getElementById('modal-picker').classList.remove('flex'); document.body.style.overflow = ''; }

        function renderPickerList() {
            let q = document.getElementById('picker-search').value.toLowerCase().trim();
            let allPlayers = playersData.filter(p => String(p.klub||p.Klub||p.tim||p.Tim||"").toLowerCase().trim() === String(selectedTeamName).toLowerCase().trim() && !['PELATIH','COACH','MANAGER'].includes(String(p.posisi||'').toUpperCase().replace(/\s+/g,'')));
            
            // SMART EXCLUDE: JANGAN TAMPILKAN PEMAIN YANG SUDAH DIPILIH DI MANAPUN
            let selectedNames = [];
            lineupState.starters.forEach(p => { if(p) selectedNames.push(String(p.nama_pemain||p.nama||p.Pemain).toLowerCase()); });
            lineupState.bench.forEach(p => selectedNames.push(String(p.nama_pemain||p.nama||p.Pemain).toLowerCase()));
            lineupState.cedera.forEach(p => selectedNames.push(String(p.nama_pemain||p.nama||p.Pemain).toLowerCase()));
            lineupState.skorsing.forEach(p => selectedNames.push(String(p.nama_pemain||p.nama||p.Pemain).toLowerCase()));

            let available = allPlayers.filter(p => !selectedNames.includes(String(p.nama_pemain||p.nama||p.Pemain).toLowerCase()));
            if(q) available = available.filter(p => String(p.nama_pemain||p.nama||p.Pemain).toLowerCase().includes(q) || String(p.posisi||'').toLowerCase().includes(q));

            let html = '';
            if(available.length === 0) { html = '<div class="text-[10px] text-gray-500 text-center py-6">Pemain habis/tidak ditemukan</div>'; }
            else {
                available.forEach((p, idx) => {
                    let nm = p.nama_pemain||p.nama||p.Pemain; let f = p.foto ? p.foto : `https://ui-avatars.com/api/?name=${nm}&background=000&color=fff`;
                    html += `
                    <div onclick="selectPlayerForContext(${playersData.indexOf(p)})" class="flex items-center gap-3 p-3 bg-white/5 border border-white/10 rounded-xl cursor-pointer hover:border-brand-green transition-colors">
                        <img src="${f}" class="w-10 h-10 rounded-full border border-gray-600 bg-white object-cover">
                        <div class="flex-1"><h4 class="font-bold text-xs uppercase text-white">${nm}</h4><span class="text-[8px] font-bold text-gray-400 uppercase tracking-widest">${p.posisi||'POS'}</span></div>
                        <i data-lucide="plus-circle" class="w-5 h-5 text-gray-500"></i>
                    </div>`;
                });
            }
            document.getElementById('picker-list').innerHTML = html; lucide.createIcons();
        }

        function selectPlayerForContext(globalIndex) {
            let p = playersData[globalIndex];
            if(activeContext.type === 'starter') { lineupState.starters[activeContext.index] = p; renderPitch(); }
            else { lineupState[activeContext.type].push(p); renderExtraRoster(); }
            closePicker();
        }

        function removeSelectedPlayer() {
            if(activeContext.type === 'starter' && activeContext.index !== null) { lineupState.starters[activeContext.index] = null; renderPitch(); }
            closePicker();
        }

        // ==========================================
        // MESIN PENGIRIMAN POST KE SERVER
        // ==========================================
        const showLog = (msg, isErr=false) => { let l = document.getElementById('log-status'); l.classList.remove('hidden'); l.innerHTML = `<span class="${isErr ? 'text-red-500' : 'text-brand-green'}">${msg}</span>`; };

        function setEventMode(jenis, btn) {
            currentEvtMode = jenis; document.getElementById('input-jenis').value = jenis;
            document.querySelectorAll('.evt-btn').forEach(b => { b.classList.remove('bg-white/20', 'border-white'); b.classList.add('bg-black'); });
            btn.classList.replace('bg-black', 'bg-white/20'); btn.classList.add('border-white');
            if(jenis === 'Substitusi') { document.getElementById('ui-normal').classList.add('hidden'); document.getElementById('ui-sub').classList.remove('hidden'); } 
            else { document.getElementById('ui-normal').classList.remove('hidden'); document.getElementById('ui-sub').classList.add('hidden'); }
        }

        async function submitEvent() {
            let menit = document.getElementById('input-menit').value;
            if(!selectedMatchId || !selectedTeamName || !menit) return alert("Pilih Tim dan isi Menit!");
            
            let btn = document.getElementById('btn-submit-live'); btn.disabled = true; btn.innerHTML = "Memproses...";
            showLog('<span class="text-yellow-500">Mengirim ke server...</span>');

            const sendPost = async (pNm, jns) => { await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'submit_event', payload: { id_match: selectedMatchId, waktu: new Date().toISOString(), menit: menit, tim: selectedTeamName, pemain: pNm, jenis: jns } }) }); };

            try {
                if(currentEvtMode === 'Substitusi') {
                    let out = document.getElementById('select-pemain-out').value; let inP = document.getElementById('select-pemain-in').value;
                    if(!out || !inP) throw new Error("Pilih pemain masuk & keluar!");
                    await sendPost(out, 'Sub Out'); await sendPost(inP, 'Sub In');
                    showLog(`Sukses! Pergantian [${out} ➔ ${inP}] tercatat.`);
                } else {
                    let n = document.getElementById('select-pemain').value; if(!n) throw new Error("Pilih pemain!");
                    await sendPost(n, currentEvtMode); showLog(`Sukses! ${currentEvtMode} untuk ${n} tercatat.`);
                }
            } catch(e) { showLog(e.message, true); } finally { btn.disabled = false; btn.innerHTML = "Eksekusi Data"; }
        }

        async function submitLineup() {
            if(!selectedMatchId || !selectedTeamName) return alert("Pilih Laga & Tim dulu!");
            
            // Validasi Starter 11
            let sCount = lineupState.starters.filter(x => x !== null).length;
            if(sCount < 11) { if(!confirm(`Papan taktik baru terisi ${sCount}/11 pemain. Yakin simpan?`)) return; }

            let btn = document.getElementById('btn-submit-lineup'); btn.disabled = true; btn.innerHTML = "Merekam...";
            showLog('<span class="text-yellow-500">Merekam struktur Lineup...</span>');

            const getNames = (arr) => arr.filter(x=>x).map(p => p.nama_pemain||p.nama||p.Pemain).join(', ');

            try {
                let payload = {
                    id_match: selectedMatchId, tim: selectedTeamName, formasi: document.getElementById('select-formasi').value,
                    starting_xi: getNames(lineupState.starters), bench: getNames(lineupState.bench),
                    cedera: getNames(lineupState.cedera), skorsing: getNames(lineupState.skorsing)
                };
                
                await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'submit_lineup', payload: payload }) });
                showLog(`Sukses! Susunan pemain ${selectedTeamName} resmi dikunci.`);
            } catch(e) { showLog("Gagal menyimpan lineup.", true); }
            finally { btn.disabled = false; btn.innerHTML = "Simpan Lineup Resmi"; }
        }

        window.onload = fetchData;
    </script>
</body>
</html>
