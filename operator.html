<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TSL Match Operator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
    <script>tailwind.config = { theme: { extend: { colors: { 'brand-green': '#009A44', 'brand-dark': '#09090b', 'brand-panel': '#18181b' } } } }</script>
    <style>body { background-color: #09090b; color: white; -webkit-tap-highlight-color: transparent; } .loader { border: 3px solid rgba(255,255,255,0.1); border-top: 3px solid #009A44; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; } @keyframes spin { 100% { transform: rotate(360deg); } }</style>
</head>
<body class="p-4 md:p-6 font-sans antialiased pb-24">
    <div class="max-w-md mx-auto">
        
        <div class="mb-6 border-b border-white/10 pb-4">
            <div class="flex items-center justify-between mb-4">
                <h1 class="text-lg font-black uppercase tracking-widest text-brand-green flex items-center gap-2">
                    <i data-lucide="radio" class="w-5 h-5 text-red-500 animate-pulse"></i> Operator TSL
                </h1>
                <button onclick="fetchData()" class="bg-white/5 p-2 rounded-lg border border-white/10"><i data-lucide="refresh-cw" id="icon-refresh" class="w-4 h-4 text-gray-400"></i></button>
            </div>
            
            <div class="flex gap-2 bg-black p-1 rounded-xl border border-white/10">
                <button id="tab-live" onclick="switchMode('live')" class="flex-1 py-2 text-[10px] font-bold uppercase tracking-widest bg-brand-green/20 text-brand-green border border-brand-green/50 rounded-lg transition-colors">Kejadian Live</button>
                <button id="tab-lineup" onclick="switchMode('lineup')" class="flex-1 py-2 text-[10px] font-bold uppercase tracking-widest text-gray-500 hover:text-white rounded-lg transition-colors">Rakit Lineup</button>
            </div>
        </div>

        <div id="loading-screen" class="flex flex-col items-center py-10"><div class="loader mb-4"></div><p class="text-[10px] text-gray-400">Memuat Server...</p></div>

        <div id="global-selectors" class="hidden space-y-4 mb-5">
            <select id="select-match" onchange="handleMatchChange()" class="w-full bg-brand-panel border border-white/10 rounded-xl px-4 py-3 text-xs font-bold uppercase focus:border-brand-green outline-none appearance-none"><option value="">-- 1. Pilih Pertandingan --</option></select>
            <div id="team-selectors" class="hidden flex gap-2">
                <button id="btn-tim-kiri" onclick="handleTeamChange('kiri')" class="flex-1 bg-black border border-white/10 text-gray-400 font-bold text-[11px] py-3 rounded-xl uppercase truncate px-2"></button>
                <button id="btn-tim-kanan" onclick="handleTeamChange('kanan')" class="flex-1 bg-black border border-white/10 text-gray-400 font-bold text-[11px] py-3 rounded-xl uppercase truncate px-2"></button>
            </div>
        </div>

        <div id="mode-live" class="hidden space-y-5 opacity-50 pointer-events-none transition-opacity">
            <div class="bg-brand-panel border border-brand-green/30 p-4 rounded-2xl shadow-[0_0_20px_rgba(0,154,68,0.05)]">
                <div class="grid grid-cols-4 gap-2 mb-4">
                    <button onclick="setEventMode('Gol', this)" class="evt-btn bg-white/20 border border-white text-white font-bold text-[9px] py-3 rounded-xl uppercase flex flex-col items-center">⚽ <span>Gol</span></button>
                    <button onclick="setEventMode('Kuning', this)" class="evt-btn bg-black border border-white/10 text-yellow-400 font-bold text-[9px] py-3 rounded-xl uppercase flex flex-col items-center">🟨 <span>Kuning</span></button>
                    <button onclick="setEventMode('Merah', this)" class="evt-btn bg-black border border-white/10 text-red-500 font-bold text-[9px] py-3 rounded-xl uppercase flex flex-col items-center">🟥 <span>Merah</span></button>
                    <button onclick="setEventMode('Substitusi', this)" class="evt-btn bg-black border border-white/10 text-brand-green font-black text-[9px] py-3 rounded-xl uppercase flex flex-col items-center">🔄 <span>Ganti</span></button>
                </div>
                <div class="flex gap-3 mb-3">
                    <div id="ui-normal" class="flex-1"><select id="select-pemain" class="w-full bg-black border border-white/10 rounded-xl px-4 py-3 text-xs font-bold uppercase outline-none"><option value="">-- Pilih Pemain --</option></select></div>
                    <div id="ui-sub" class="flex-1 hidden space-y-2">
                        <select id="select-pemain-out" class="w-full bg-black border border-red-500/30 text-red-500 rounded-xl px-3 py-2 text-[10px] font-bold uppercase"><option value="">-- Pemain Keluar ⬇️ --</option></select>
                        <select id="select-pemain-in" class="w-full bg-black border border-brand-green/30 text-brand-green rounded-xl px-3 py-2 text-[10px] font-bold uppercase"><option value="">-- Pengganti Masuk ⬆️ --</option></select>
                    </div>
                    <div class="w-16 shrink-0"><input type="number" id="input-menit" placeholder="MNT" class="w-full bg-black border border-white/10 rounded-xl px-2 py-3 text-sm font-black text-center outline-none"></div>
                </div>
                <input type="hidden" id="input-jenis" value="Gol">
                <button onclick="submitEvent()" id="btn-submit-live" class="w-full bg-brand-green text-white font-black text-xs uppercase py-3.5 rounded-xl mt-2 flex justify-center items-center gap-2"><i data-lucide="send" class="w-4 h-4"></i> Eksekusi Data</button>
            </div>
        </div>

        <div id="mode-lineup" class="hidden space-y-5 opacity-50 pointer-events-none transition-opacity">
            <div class="bg-brand-panel border border-brand-gold/30 p-4 rounded-2xl">
                <label class="block text-[10px] font-bold text-brand-gold uppercase tracking-widest mb-2">Formasi Laga</label>
                <select id="select-formasi" class="w-full bg-black border border-white/10 rounded-xl px-4 py-3 text-xs font-bold text-white uppercase outline-none mb-4">
                    <option value="4-3-3">4-3-3</option><option value="4-2-3-1">4-2-3-1</option><option value="4-4-2">4-4-2</option><option value="3-5-2">3-5-2</option><option value="5-3-2">5-3-2</option>
                </select>
                
                <div class="flex justify-between items-end mb-2">
                    <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-widest">Daftar Skuad (Pilih Statusnya)</label>
                    <span id="counter-starter" class="text-[9px] font-bold bg-brand-green/20 text-brand-green px-2 py-0.5 rounded">Starter: 0/11</span>
                </div>
                
                <div id="lineup-player-list" class="space-y-2 max-h-96 overflow-y-auto pr-1 mb-4">
                    <div class="text-[10px] text-gray-500 italic text-center py-4">Pilih tim terlebih dahulu</div>
                </div>

                <button onclick="submitLineup()" id="btn-submit-lineup" class="w-full bg-brand-gold text-black font-black text-xs uppercase py-3.5 rounded-xl flex justify-center items-center gap-2 shadow-[0_0_15px_rgba(215,182,125,0.3)]"><i data-lucide="clipboard-check" class="w-4 h-4"></i> Simpan Lineup Resmi</button>
            </div>
        </div>

        <div id="log-status" class="mt-4 text-center text-[10px] font-bold uppercase tracking-widest px-4 py-3 rounded-lg bg-black/50 border border-white/5 hidden"></div>
    </div>

    <script>
        lucide.createIcons();
        const API_URL = "https://script.google.com/macros/s/AKfycbzAeXyhA-VIDTJQfmOnPfv0o9NZQXJg9PIk1r1FpSWeqH3TvInjK6QnhONhLieHiqY/exec"; // Ganti dengan link terbaru Anda
        
        let matchesData = []; let playersData = []; let currentMode = 'live'; let selectedMatchId = ''; let selectedTeamName = ''; let currentEvtMode = 'Gol';

        async function fetchData() {
            document.getElementById('loading-screen').classList.remove('hidden'); document.getElementById('global-selectors').classList.add('hidden'); document.getElementById('icon-refresh').classList.add('animate-spin');
            try {
                matchesData = await (await fetch(API_URL + "?sheet=Jadwal")).json();
                playersData = await (await fetch(API_URL + "?sheet=Pemain")).json();
                
                let select = document.getElementById('select-match'); select.innerHTML = '<option value="">-- Pilih Pertandingan --</option>';
                matchesData.forEach(m => { let idm = m.id_match || m.ID_Match; if(idm) select.innerHTML += `<option value="${idm}">${m.tim_kiri || m.Tim_Kiri} VS ${m.tim_kanan || m.Tim_Kanan} (${idm})</option>`; });
            } catch(e) { alert("Gagal koneksi ke server."); } 
            finally {
                document.getElementById('loading-screen').classList.add('hidden'); document.getElementById('global-selectors').classList.remove('hidden'); document.getElementById('icon-refresh').classList.remove('animate-spin');
                switchMode('live');
            }
        }

        function switchMode(mode) {
            currentMode = mode;
            let btnLive = document.getElementById('tab-live'); let btnLineup = document.getElementById('tab-lineup');
            let divLive = document.getElementById('mode-live'); let divLineup = document.getElementById('mode-lineup');
            
            btnLive.className = mode==='live' ? "flex-1 py-2 text-[10px] font-bold uppercase tracking-widest bg-brand-green/20 text-brand-green border border-brand-green/50 rounded-lg transition-colors" : "flex-1 py-2 text-[10px] font-bold uppercase tracking-widest text-gray-500 hover:text-white rounded-lg transition-colors";
            btnLineup.className = mode==='lineup' ? "flex-1 py-2 text-[10px] font-bold uppercase tracking-widest bg-brand-gold/20 text-brand-gold border border-brand-gold/50 rounded-lg transition-colors" : "flex-1 py-2 text-[10px] font-bold uppercase tracking-widest text-gray-500 hover:text-white rounded-lg transition-colors";
            
            if(mode==='live') { divLive.classList.remove('hidden'); divLineup.classList.add('hidden'); } 
            else { divLineup.classList.remove('hidden'); divLive.classList.add('hidden'); }
        }

        function handleMatchChange() {
            selectedMatchId = document.getElementById('select-match').value;
            let match = matchesData.find(m => String(m.id_match||m.ID_Match) === String(selectedMatchId));
            if(!match) { 
                document.getElementById('team-selectors').classList.add('hidden'); 
                document.getElementById('mode-live').classList.add('opacity-50', 'pointer-events-none');
                document.getElementById('mode-lineup').classList.add('opacity-50', 'pointer-events-none');
                return; 
            }
            
            document.getElementById('btn-tim-kiri').innerText = match.tim_kiri || match.Tim_Kiri;
            document.getElementById('btn-tim-kanan').innerText = match.tim_kanan || match.Tim_Kanan;
            document.getElementById('btn-tim-kiri').className = "flex-1 bg-black border border-white/10 text-gray-400 font-bold text-[11px] py-3 rounded-xl uppercase truncate px-2";
            document.getElementById('btn-tim-kanan').className = "flex-1 bg-black border border-white/10 text-gray-400 font-bold text-[11px] py-3 rounded-xl uppercase truncate px-2";
            
            document.getElementById('team-selectors').classList.remove('hidden'); selectedTeamName = "";
        }

        function handleTeamChange(posisi) {
            let match = matchesData.find(m => String(m.id_match||m.ID_Match) === String(selectedMatchId));
            selectedTeamName = posisi === 'kiri' ? (match.tim_kiri || match.Tim_Kiri) : (match.tim_kanan || match.Tim_Kanan);
            
            document.getElementById('btn-tim-kiri').className = posisi==='kiri' ? "flex-1 bg-brand-green/20 border border-brand-green text-brand-green font-bold text-[11px] py-3 rounded-xl uppercase truncate px-2" : "flex-1 bg-black border border-white/10 text-gray-400 font-bold text-[11px] py-3 rounded-xl uppercase truncate px-2";
            document.getElementById('btn-tim-kanan').className = posisi==='kanan' ? "flex-1 bg-brand-green/20 border border-brand-green text-brand-green font-bold text-[11px] py-3 rounded-xl uppercase truncate px-2" : "flex-1 bg-black border border-white/10 text-gray-400 font-bold text-[11px] py-3 rounded-xl uppercase truncate px-2";

            let filtered = playersData.filter(p => String(p.klub||p.Klub||p.tim||p.Tim||"").toLowerCase().trim() === String(selectedTeamName).toLowerCase().trim());
            
            // 1. Update Dropdown di Mode Live
            let opt = '<option value="">-- Pilih Pemain --</option>';
            filtered.forEach(p => { let nm = p.nama_pemain||p.nama||p.Pemain; opt += `<option value="${nm}">${nm} ${p.no_punggung ? '('+p.no_punggung+')':''}</option>`; });
            document.getElementById('select-pemain').innerHTML = opt; document.getElementById('select-pemain-out').innerHTML = opt; document.getElementById('select-pemain-in').innerHTML = opt;
            document.getElementById('mode-live').classList.remove('opacity-50', 'pointer-events-none');

            // 2. Update Builder List di Mode Lineup
            let lineupHtml = '';
            filtered.forEach((p, idx) => {
                let nm = p.nama_pemain||p.nama||p.Pemain;
                // Posisi Pelatih otomatis "Absen" / Diabaikan di lineup pemain
                let isCoach = ['PELATIH','COACH','MANAGER'].includes(String(p.posisi||p.Posisi||'').toUpperCase().replace(/\s+/g,''));
                if(isCoach) return; 

                lineupHtml += `
                <div class="flex items-center justify-between bg-black border border-white/10 p-2.5 rounded-xl">
                    <div class="flex-1 truncate"><span class="font-bold text-[11px] text-white uppercase block truncate">${nm}</span><span class="text-[8px] text-gray-500 uppercase">${p.posisi||'POS'}</span></div>
                    <select data-player="${nm}" onchange="countStarters()" class="player-role-select bg-gray-900 border border-gray-700 text-[9px] font-bold uppercase rounded p-1.5 outline-none w-[90px] ${idx < 11 ? 'text-brand-green' : 'text-gray-400'}">
                        <option value="starter" ${idx < 11 ? 'selected' : ''}>11 Inti</option>
                        <option value="bench" ${idx >= 11 ? 'selected' : ''}>Cadangan</option>
                        <option value="cedera" class="text-brand-red">Cedera 🚑</option>
                        <option value="skorsing" class="text-brand-red">Skorsing 🟥</option>
                        <option value="absen" class="text-gray-600">Tidak Masuk</option>
                    </select>
                </div>`;
            });
            document.getElementById('lineup-player-list').innerHTML = lineupHtml;
            document.getElementById('mode-lineup').classList.remove('opacity-50', 'pointer-events-none');
            countStarters();
        }

        function countStarters() {
            let selects = document.querySelectorAll('.player-role-select');
            let count = 0;
            selects.forEach(s => { 
                if(s.value === 'starter') { count++; s.classList.replace('text-gray-400', 'text-brand-green'); s.classList.replace('text-brand-red', 'text-brand-green'); }
                else if (s.value === 'cedera' || s.value === 'skorsing') { s.classList.replace('text-brand-green', 'text-brand-red'); s.classList.replace('text-gray-400', 'text-brand-red'); }
                else { s.classList.replace('text-brand-green', 'text-gray-400'); s.classList.replace('text-brand-red', 'text-gray-400'); }
            });
            let cBadge = document.getElementById('counter-starter');
            cBadge.innerText = `Starter: ${count}/11`;
            cBadge.className = count === 11 ? "text-[9px] font-bold bg-brand-green/20 text-brand-green px-2 py-0.5 rounded" : "text-[9px] font-bold bg-red-500/20 text-red-500 px-2 py-0.5 rounded";
        }

        function setEventMode(jenis, btn) {
            currentEvtMode = jenis; document.getElementById('input-jenis').value = jenis;
            document.querySelectorAll('.evt-btn').forEach(b => { b.classList.remove('bg-white/20', 'border-white', 'shadow-inner'); b.classList.add('bg-black'); });
            btn.classList.replace('bg-black', 'bg-white/20'); btn.classList.add('border-white', 'shadow-inner');
            if(jenis === 'Substitusi') { document.getElementById('ui-normal').classList.add('hidden'); document.getElementById('ui-sub').classList.remove('hidden'); } 
            else { document.getElementById('ui-normal').classList.remove('hidden'); document.getElementById('ui-sub').classList.add('hidden'); }
        }

        // FUNGSI LOG UNTUK UI
        const showLog = (msg, isErr=false) => { let l = document.getElementById('log-status'); l.classList.remove('hidden'); l.innerHTML = `<span class="${isErr ? 'text-red-500' : 'text-brand-green'}">${msg}</span>`; };

        async function submitEvent() {
            let menit = document.getElementById('input-menit').value;
            if(!selectedMatchId || !selectedTeamName || !menit) return alert("Lengkapi Tim dan Menit!");
            
            let btn = document.getElementById('btn-submit-live'); btn.disabled = true; btn.innerHTML = "Memproses...";
            showLog('<span class="text-yellow-500">Merekam data ke server...</span>');

            const sendPost = async (pNm, jns) => {
                await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'submit_event', payload: { id_match: selectedMatchId, waktu: new Date().toISOString(), menit: menit, tim: selectedTeamName, pemain: pNm, jenis: jns } }) });
            };

            try {
                if(currentEvtMode === 'Substitusi') {
                    let out = document.getElementById('select-pemain-out').value; let inP = document.getElementById('select-pemain-in').value;
                    if(!out || !inP) throw new Error("Pilih pemain masuk & keluar!");
                    await sendPost(out, 'Sub Out'); await sendPost(inP, 'Sub In');
                    showLog(`Sukses! Pergantian [${out} ➔ ${inP}] tercatat.`);
                } else {
                    let n = document.getElementById('select-pemain').value; if(!n) throw new Error("Pilih pemain!");
                    await sendPost(n, currentEvtMode); showLog(`Sukses! ${currentEvtMode} untuk ${n} tercatat.`);
                }
            } catch(e) { showLog(e.message, true); } 
            finally { btn.disabled = false; btn.innerHTML = "Eksekusi Data"; }
        }

        async function submitLineup() {
            if(!selectedMatchId || !selectedTeamName) return alert("Pilih Laga & Tim dulu!");
            
            let selects = document.querySelectorAll('.player-role-select');
            let starters = [], bench = [], cedera = [], skors = [];
            
            selects.forEach(s => {
                let pName = s.getAttribute('data-player');
                if(s.value === 'starter') starters.push(pName);
                else if(s.value === 'bench') bench.push(pName);
                else if(s.value === 'cedera') cedera.push(pName);
                else if(s.value === 'skorsing') skors.push(pName);
            });

            if(starters.length !== 11) {
                if(!confirm(`Perhatian: Anda mengatur ${starters.length} Starter (harusnya 11). Tetap kirim?`)) return;
            }

            let btn = document.getElementById('btn-submit-lineup'); btn.disabled = true; btn.innerHTML = "Merekam Lineup...";
            showLog('<span class="text-yellow-500">Menulis struktur Lineup di Server...</span>');

            try {
                let f = document.getElementById('select-formasi').value;
                let payload = {
                    id_match: selectedMatchId, tim: selectedTeamName, formasi: f,
                    starting_xi: starters.join(', '), bench: bench.join(', '), cedera: cedera.join(', '), skorsing: skors.join(', ')
                };
                
                await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'submit_lineup', payload: payload }) });
                showLog(`Sukses! Lineup ${selectedTeamName} berhasil dikunci.`);
            } catch(e) { showLog("Gagal menyimpan lineup.", true); }
            finally { btn.disabled = false; btn.innerHTML = "Simpan Lineup Resmi"; }
        }

        window.onload = fetchData;
    </script>
</body>
</html>
