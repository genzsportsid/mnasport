<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TSL Pro Operator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
    <script>tailwind.config={darkMode:'class',theme:{extend:{colors:{'brand-green':'#009A44','brand-dark':'#09090b','brand-panel':'#18181b','brand-gold':'#d7b67d'}}}}</script>
    <style>body{background-color:#09090b;color:white;-webkit-tap-highlight-color:transparent;font-family:'Inter',sans-serif;} .hide-scroll::-webkit-scrollbar{display:none;} .loader{border:3px solid rgba(255,255,255,0.1);border-top:3px solid #009A44;border-radius:50%;width:24px;height:24px;animation:spin 1s linear infinite;} @keyframes spin{100%{transform:rotate(360deg);}} .tactical-pitch{position:relative;width:100%;max-width:380px;margin:0 auto;border-radius:12px;overflow:hidden;border:1px solid rgba(255,255,255,0.15);background-color:#062110;background-image:repeating-linear-gradient(0deg,transparent,transparent 10%,rgba(255,255,255,0.03) 10%,rgba(255,255,255,0.03) 20%);box-shadow:inset 0 0 30px rgba(0,0,0,0.8);} .tactical-pitch::before{content:"";display:block;padding-top:135%;} .pitch-lines{position:absolute;inset:0;pointer-events:none;} .p-line{position:absolute;border:1.5px solid rgba(255,255,255,0.2);} .builder-slot{position:absolute;width:40px;height:40px;border-radius:50%;transform:translate(-50%,50%);z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:all 0.2s;box-shadow:0 4px 6px rgba(0,0,0,0.5);} .builder-slot.empty{background:rgba(0,0,0,0.6);border:2px dashed rgba(255,255,255,0.5);backdrop-filter:blur(4px);} .builder-slot.empty:hover{border-color:#009A44;background:rgba(0,154,68,0.2);transform:translate(-50%,50%) scale(1.1);} .builder-slot.filled{background-color:#fff;border:2px solid #009A44;background-size:cover;background-position:center;} .slot-label{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:8px;font-weight:900;background:rgba(0,0,0,0.8);padding:2px 6px;border-radius:4px;color:white;border:1px solid rgba(255,255,255,0.2);text-transform:uppercase;} .modal-up{animation:slideUp 0.3s cubic-bezier(0.16,1,0.3,1) forwards;} @keyframes slideUp{from{transform:translateY(100%);}to{transform:translateY(0);}}</style>
</head>
<body class="pb-24">
    <div class="max-w-md mx-auto p-4 md:p-6">
        <!-- HEADER -->
        <div class="mb-5 border-b border-white/10 pb-4 flex items-center justify-between">
            <div>
                <h1 class="text-lg font-black uppercase tracking-widest text-brand-green flex items-center gap-2"><i data-lucide="radio" class="w-5 h-5 text-red-500 animate-pulse"></i> Pro Operator</h1>
                <p class="text-[9px] text-gray-500 font-bold uppercase tracking-widest mt-0.5">Visual Lineup & Smart Events</p>
            </div>
            <button onclick="fetchData()" class="bg-white/5 p-2 rounded-lg border border-white/10"><i data-lucide="refresh-cw" id="icon-refresh" class="w-4 h-4 text-gray-400"></i></button>
        </div>

        <div class="flex gap-2 bg-black p-1 rounded-xl border border-white/10 mb-5">
            <button id="tab-live" onclick="switchMode('live')" class="flex-1 py-2.5 text-[10px] font-bold uppercase tracking-widest bg-brand-green/20 text-brand-green border border-brand-green/50 rounded-lg transition-colors">⚡ Live Event</button>
            <button id="tab-lineup" onclick="switchMode('lineup')" class="flex-1 py-2.5 text-[10px] font-bold uppercase tracking-widest text-gray-500 hover:text-white rounded-lg transition-colors">📋 Rakit Lineup</button>
        </div>

        <div id="loading-screen" class="flex flex-col items-center py-10"><div class="loader mb-4"></div><p class="text-[10px] text-gray-400 font-bold uppercase tracking-widest">Sinkronisasi Database...</p></div>

        <div id="global-selectors" class="hidden space-y-4 mb-5">
            <select id="select-match" onchange="handleMatchChange()" class="w-full bg-brand-panel border border-white/10 rounded-xl px-4 py-3 text-[11px] font-bold uppercase outline-none shadow-sm text-brand-gold"><option value="">-- 1. Pilih Pertandingan Aktif --</option></select>
            <div id="team-selectors" class="hidden flex gap-2">
                <button id="btn-tim-kiri" onclick="handleTeamChange('kiri')" class="flex-1 bg-black border border-white/10 text-gray-400 font-bold text-[11px] py-3 rounded-xl uppercase truncate px-2"></button>
                <button id="btn-tim-kanan" onclick="handleTeamChange('kanan')" class="flex-1 bg-black border border-white/10 text-gray-400 font-bold text-[11px] py-3 rounded-xl uppercase truncate px-2"></button>
            </div>
        </div>

        <!-- ========================================== -->
        <!-- MODE 1: LIVE EVENTS (SMART CONTEXT ENGINE) -->
        <!-- ========================================== -->
        <div id="mode-live" class="hidden space-y-4 opacity-50 pointer-events-none transition-opacity">
            
            <!-- PANEL TOMBOL CEPAT -->
            <div class="grid grid-cols-3 gap-2">
                <button onclick="setEventMode('Gol', this)" class="evt-btn active-btn bg-white/20 border border-white text-white font-bold text-[9px] py-2.5 rounded-xl uppercase flex flex-col items-center justify-center gap-1"><span class="text-sm">⚽</span> <span>Gol</span></button>
                <button onclick="setEventMode('Gol Bunuh Diri', this)" class="evt-btn bg-black border border-white/10 text-rose-400 font-bold text-[9px] py-2.5 rounded-xl uppercase flex flex-col items-center justify-center gap-1"><span class="text-sm">🤦‍♂️</span> <span class="text-[8px]">Own Goal</span></button>
                <button onclick="setEventMode('Penyelamatan Penalti', this)" class="evt-btn bg-black border border-white/10 text-cyan-300 font-bold text-[9px] py-2.5 rounded-xl uppercase flex flex-col items-center justify-center gap-1 text-center"><span class="text-sm">🧤</span> <span class="text-[8px]">Save Pen</span></button>

                <button onclick="setEventMode('Kuning', this)" class="evt-btn bg-black border border-white/10 text-yellow-400 font-bold text-[9px] py-2.5 rounded-xl uppercase flex flex-col items-center justify-center gap-1"><span class="text-sm">🟨</span> <span>Kuning</span></button>
                <button onclick="setEventMode('Kuning Kedua', this)" class="evt-btn bg-black border border-white/10 text-orange-400 font-bold text-[9px] py-2.5 rounded-xl uppercase flex flex-col items-center justify-center gap-1 text-center"><span class="text-sm">🟨🟥</span> <span class="text-[8px]">2nd Kuning</span></button>
                <button onclick="setEventMode('Merah', this)" class="evt-btn bg-black border border-white/10 text-red-500 font-bold text-[9px] py-2.5 rounded-xl uppercase flex flex-col items-center justify-center gap-1"><span class="text-sm">🟥</span> <span>Merah</span></button>

                <button onclick="setEventMode('Gagal Penalti', this)" class="evt-btn bg-black border border-white/10 text-red-400 font-bold text-[9px] py-2.5 rounded-xl uppercase flex flex-col items-center justify-center gap-1"><span class="text-sm">❌</span> <span class="text-[8px]">Miss Pen</span></button>
                <button onclick="setEventMode('Cedera', this)" class="evt-btn bg-black border border-white/10 text-gray-300 font-bold text-[9px] py-2.5 rounded-xl uppercase flex flex-col items-center justify-center gap-1"><span class="text-sm">🚑</span> <span>Cedera</span></button>
                <button onclick="setEventMode('Substitusi', this)" class="evt-btn bg-black border border-white/10 text-brand-green font-black text-[9px] py-2.5 rounded-xl uppercase flex flex-col items-center justify-center gap-1"><span class="text-sm">🔄</span> <span>Ganti</span></button>
            </div>

            <!-- FORM DINAMIS (Warna Bingkai Berubah Otomatis) -->
            <div id="dynamic-form-container" class="bg-brand-panel border border-brand-green/50 p-4 rounded-2xl shadow-lg transition-colors duration-300">
                <div class="flex gap-3 mb-4">
                    <!-- Input Menit String (Support 45+2) -->
                    <div class="w-[70px] shrink-0">
                        <label class="block text-[9px] text-gray-400 font-bold uppercase mb-1.5 text-center">Menit</label>
                        <input type="text" id="input-menit" placeholder="45+2" class="w-full bg-black border border-white/20 rounded-xl px-1 py-3 text-sm font-black text-center text-white outline-none focus:border-white focus:bg-white/10 transition-colors">
                    </div>
                    
                    <!-- Input Utama (Pencetak Gol / Kartu / Sub Out) -->
                    <div class="flex-1">
                        <label id="label-primary" class="block text-[9px] text-gray-400 font-bold uppercase mb-1.5">Pemain</label>
                        <input type="text" id="select-primary" list="list-primary" placeholder="PILIH ATAU KETIK NAMA..." class="w-full bg-black border border-white/20 rounded-xl px-3 py-3 text-[11px] font-bold text-white uppercase outline-none focus:border-white transition-colors truncate">
                        <datalist id="list-primary"></datalist>
                    </div>
                </div>

                <!-- Checkbox Khusus Jenis Gol (Hanya Muncul Saat Gol) -->
                <div id="container-penalty-check" class="mb-4 hidden flex items-center gap-2.5 bg-black/50 border border-brand-green/30 p-3 rounded-xl cursor-pointer" onclick="togglePenaltiCheck()">
                    <div class="w-4 h-4 rounded border border-gray-400 flex items-center justify-center bg-black transition-colors" id="box-penalti">
                        <svg class="w-3 h-3 text-white hidden" id="icon-check-penalti" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                    </div>
                    <label class="text-[10px] font-bold text-white uppercase tracking-widest cursor-pointer pointer-events-none">Cetak via Tendangan Penalti</label>
                    <input type="checkbox" id="check-penalti" class="hidden">
                </div>

                <!-- Input Kedua (Hanya muncul untuk Gol/Assist dan Substitusi) -->
                <div id="container-secondary" class="mb-5">
                    <label id="label-secondary" class="block text-[9px] text-gray-400 font-bold uppercase mb-1.5">Assist (Opsional)</label>
                    <input type="text" id="select-secondary" list="list-secondary" placeholder="TANPA ASSIST / KETIK MANUAL..." class="w-full bg-black border border-white/20 rounded-xl px-3 py-3 text-[11px] font-bold text-white uppercase outline-none focus:border-white transition-colors truncate">
                    <datalist id="list-secondary"></datalist>
                </div>

                <input type="hidden" id="input-jenis" value="Gol">
                <button onclick="submitEvent()" id="btn-submit-live" class="w-full bg-white text-black hover:bg-gray-200 font-black text-xs uppercase tracking-widest py-3.5 rounded-xl flex justify-center items-center gap-2 transition-colors">
                    <i data-lucide="send" class="w-4 h-4"></i> Eksekusi Data
                </button>
            </div>
        </div>

        <!-- ========================================== -->
        <!-- MODE 2: RAKIT LINEUP -->
        <!-- ========================================== -->
        <div id="mode-lineup" class="hidden space-y-5 opacity-50 pointer-events-none transition-opacity">
            <div class="bg-brand-panel border border-brand-gold/30 p-5 rounded-2xl shadow-xl">
                
                <div class="mb-5 bg-black p-3 rounded-xl border border-white/5">
                    <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-2"><i data-lucide="user" class="w-3 h-3 inline"></i> Pelatih Kepala (Head Coach)</label>
                    <select id="select-pelatih" class="w-full bg-white/5 border border-white/10 rounded-lg px-3 py-2.5 text-xs font-bold text-brand-gold uppercase outline-none">
                        <option value="">-- Pilih Pelatih --</option>
                    </select>
                </div>

                <div class="flex justify-between items-center mb-4">
                    <label class="text-[10px] font-bold text-brand-gold uppercase tracking-widest">Papan Taktik</label>
                    <select id="select-formasi" onchange="renderPitch()" class="bg-black border border-brand-gold/30 text-brand-gold rounded-lg px-3 py-1.5 text-[10px] font-black uppercase outline-none">
                        <option value="4-3-3">4-3-3</option>
                        <option value="4-2-3-1">4-2-3-1</option>
                        <option value="4-4-2">4-4-2</option>
                        <option value="4-1-4-1">4-1-4-1</option>
                        <option value="4-3-2-1">4-3-2-1</option>
                        <option value="3-5-2">3-5-2</option>
                        <option value="3-4-3">3-4-3</option>
                        <option value="3-4-2-1">3-4-2-1</option>
                        <option value="5-3-2">5-3-2</option>
                        <option value="5-2-3">5-2-3</option>
                    </select>
                    </select>
                </div>
                
                <div class="tactical-pitch mb-6">
                    <div class="pitch-lines">
                        <div class="p-line" style="top:50%; left:0; right:0; height:0; border-top-width:2px; transform:translateY(-50%); border-color:rgba(255,255,255,0.1)"></div>
                        <div class="p-line" style="top:50%; left:50%; width:80px; height:80px; border-radius:50%; transform:translate(-50%,-50%); border-color:rgba(255,255,255,0.1)"></div>
                        <div class="p-line" style="bottom:-2px; left:20%; width:60%; height:18%; border-bottom:0; border-color:rgba(255,255,255,0.2)"></div>
                    </div>
                    <div id="pitch-slots" class="absolute inset-0 z-10 w-full h-full"></div>
                </div>

                <div class="space-y-4 border-t border-white/10 pt-5">
                    <div>
                        <div class="flex justify-between items-center mb-2">
                            <label class="text-[10px] font-bold text-gray-400 uppercase tracking-widest flex items-center gap-1.5"><i data-lucide="users" class="w-3 h-3 text-blue-400"></i> Bangku Cadangan</label>
                            <button onclick="openPicker('bench')" class="bg-white/10 px-2 py-1 rounded text-[8px] font-bold uppercase hover:bg-white/20">+ Tambah</button>
                        </div>
                        <div id="list-bench" class="flex flex-wrap gap-2 bg-black/50 p-3 rounded-xl border border-white/5 min-h-[50px]"></div>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <div class="flex justify-between items-center mb-2"><label class="text-[9px] font-bold text-gray-400 uppercase tracking-widest">🚑 Cedera</label><button onclick="openPicker('cedera')" class="bg-white/10 px-2 py-1 rounded text-[8px] font-bold uppercase">+</button></div>
                            <div id="list-cedera" class="flex flex-col gap-1.5 bg-black/50 p-2 rounded-xl border border-white/5 min-h-[40px]"></div>
                        </div>
                        <div>
                            <div class="flex justify-between items-center mb-2"><label class="text-[9px] font-bold text-gray-400 uppercase tracking-widest">🟥 Skorsing</label><button onclick="openPicker('skorsing')" class="bg-white/10 px-2 py-1 rounded text-[8px] font-bold uppercase">+</button></div>
                            <div id="list-skorsing" class="flex flex-col gap-1.5 bg-black/50 p-2 rounded-xl border border-white/5 min-h-[40px]"></div>
                        </div>
                    </div>
                </div>

                <div class="flex gap-2 mt-6">
                    <button onclick="resetLineup()" class="bg-red-500/10 text-red-500 border border-red-500/30 font-bold text-[10px] uppercase px-4 rounded-xl">Reset</button>
                    <button onclick="submitLineup()" id="btn-submit-lineup" class="flex-1 bg-brand-gold text-black font-black text-xs uppercase py-3.5 rounded-xl flex justify-center items-center gap-2 shadow-[0_0_15px_rgba(215,182,125,0.3)]"><i data-lucide="upload-cloud" class="w-4 h-4"></i> Simpan Lineup Resmi</button>
                </div>
            </div>
        </div>
        <div id="log-status" class="mt-4 text-center text-[10px] font-bold uppercase tracking-widest px-4 py-3 rounded-lg bg-black/50 border border-white/5 hidden"></div>
    </div>

    <!-- LACI PEMILIH PEMAIN -->
    <div id="modal-picker" class="fixed inset-0 z-[100] hidden flex-col justify-end">
        <div class="absolute inset-0 bg-black/90 backdrop-blur-sm" onclick="closePicker()"></div>
        <div class="relative bg-brand-panel border-t border-white/10 rounded-t-[2rem] shadow-2xl modal-up flex flex-col h-[75vh] max-w-md mx-auto w-full pb-safe">
            <div class="p-5 border-b border-white/10 flex justify-between items-center shrink-0">
                <div><h3 id="picker-title" class="font-black text-lg uppercase text-white tracking-widest">Pilih Pemain</h3><p id="picker-subtitle" class="text-[9px] font-bold text-brand-green uppercase tracking-widest mt-0.5">Posisi: ST</p></div>
                <button onclick="closePicker()" class="w-8 h-8 bg-white/10 rounded-full flex justify-center items-center font-bold text-gray-400 hover:text-white">&times;</button>
            </div>
            
            <div class="p-3 bg-black/50 border-b border-white/5 shrink-0"><input type="text" id="picker-search" oninput="renderPickerList()" placeholder="Cari nama atau posisi..." class="w-full bg-black border border-white/10 rounded-xl px-4 py-2.5 text-xs text-white uppercase outline-none focus:border-brand-green"></div>
            
            <!-- FORM INPUT MANUAL PEMAIN -->
            <div class="p-3 bg-brand-panel border-b border-white/10 shrink-0 flex gap-2">
                <input type="text" id="manual-player-input" placeholder="TIDAK ADA DI DAFTAR? KETIK DI SINI..." class="w-full bg-black border border-brand-green/30 rounded-lg px-3 py-2 text-[10px] text-white uppercase outline-none focus:border-brand-green">
                <button onclick="pilihPemainManual()" class="bg-brand-green text-white font-bold text-[10px] uppercase px-4 rounded-lg hover:bg-green-600 transition-colors">Tambah</button>
            </div>

            <div id="picker-list" class="flex-1 overflow-y-auto hide-scroll p-3 flex flex-col gap-2"></div>
            <div id="picker-remove-btn" class="hidden p-4 border-t border-white/5 shrink-0"><button onclick="removeSelectedPlayer()" class="w-full bg-red-500/10 border border-red-500/30 text-red-500 font-bold uppercase text-[10px] py-3 rounded-xl tracking-widest"><i data-lucide="trash-2" class="w-3 h-3 inline pb-0.5"></i> Kosongkan Slot Ini</button></div>
        </div>
    </div>

    <script>
        lucide.createIcons();
        const API_URL = "https://script.google.com/macros/s/AKfycbzAeXyhA-VIDTJQfmOnPfv0o9NZQXJg9PIk1r1FpSWeqH3TvInjK6QnhONhLieHiqY/exec";
        
        let matchesData = []; let playersData = []; let coachesData = []; let lineupData = []; let kejadianData = [];
        let selectedMatchId = ''; let selectedTeamName = ''; let currentMode = 'live'; let currentEvtMode = 'Gol';

        // STATE KONDISI LAPANGAN (Context-Aware Logic)
        let allTeamPlayers = [];
        let onPitchPlayers = [];
        let onBenchPlayers = [];
        window.activeEnemyGK = null; // Menyimpan Kiper Lawan yang sedang main

        const FORMATIONS = {
            '4-3-3': [{b:'10%', l:'50%', role:'GK'}, {b:'25%', l:'15%', role:'LB'}, {b:'25%', l:'35%', role:'CB'}, {b:'25%', l:'65%', role:'CB'}, {b:'25%', l:'85%', role:'RB'}, {b:'45%', l:'50%', role:'CDM'}, {b:'55%', l:'30%', role:'CM'}, {b:'55%', l:'70%', role:'CM'}, {b:'80%', l:'20%', role:'LW'}, {b:'80%', l:'80%', role:'RW'}, {b:'85%', l:'50%', role:'ST'}],
            '4-4-2': [{b:'10%', l:'50%', role:'GK'}, {b:'25%', l:'15%', role:'LB'}, {b:'25%', l:'35%', role:'CB'}, {b:'25%', l:'65%', role:'CB'}, {b:'25%', l:'85%', role:'RB'}, {b:'50%', l:'15%', role:'LM'}, {b:'45%', l:'35%', role:'CM'}, {b:'45%', l:'65%', role:'CM'}, {b:'50%', l:'85%', role:'RM'}, {b:'80%', l:'35%', role:'CF'}, {b:'80%', l:'65%', role:'CF'}],
            '4-2-3-1': [{b:'10%', l:'50%', role:'GK'}, {b:'25%', l:'15%', role:'LB'}, {b:'25%', l:'35%', role:'CB'}, {b:'25%', l:'65%', role:'CB'}, {b:'25%', l:'85%', role:'RB'}, {b:'45%', l:'35%', role:'CDM'}, {b:'45%', l:'65%', role:'CDM'}, {b:'65%', l:'20%', role:'LAM'}, {b:'65%', l:'50%', role:'CAM'}, {b:'65%', l:'80%', role:'RAM'}, {b:'85%', l:'50%', role:'ST'}],
            '4-1-4-1': [{b:'10%', l:'50%', role:'GK'}, {b:'25%', l:'15%', role:'LB'}, {b:'25%', l:'35%', role:'CB'}, {b:'25%', l:'65%', role:'CB'}, {b:'25%', l:'85%', role:'RB'}, {b:'40%', l:'50%', role:'CDM'}, {b:'60%', l:'15%', role:'LM'}, {b:'55%', l:'35%', role:'CM'}, {b:'55%', l:'65%', role:'CM'}, {b:'60%', l:'85%', role:'RM'}, {b:'85%', l:'50%', role:'ST'}],
            '4-3-2-1': [{b:'10%', l:'50%', role:'GK'}, {b:'25%', l:'15%', role:'LB'}, {b:'22%', l:'36%', role:'CB'}, {b:'22%', l:'64%', role:'CB'}, {b:'25%', l:'88%', role:'RB'}, {b:'42%', l:'22%', role:'LCM'}, {b:'44%', l:'50%', role:'CM'}, {b:'42%', l:'78%', role:'RCM'}, {b:'62%', l:'35%', role:'LAM'}, {b:'62%', l:'65%', role:'RAM'}, {b:'84%', l:'50%', role:'ST'}],
            '3-5-2': [{b:'10%', l:'50%', role:'GK'}, {b:'25%', l:'25%', role:'CB'}, {b:'25%', l:'50%', role:'CB'}, {b:'25%', l:'75%', role:'CB'}, {b:'45%', l:'35%', role:'CM'}, {b:'45%', l:'65%', role:'CM'}, {b:'60%', l:'15%', role:'LWB'}, {b:'60%', l:'85%', role:'RWB'}, {b:'65%', l:'50%', role:'CAM'}, {b:'85%', l:'35%', role:'ST'}, {b:'85%', l:'65%', role:'ST'}],
            '3-4-3': [{b:'10%', l:'50%', role:'GK'}, {b:'25%', l:'25%', role:'LCB'}, {b:'25%', l:'50%', role:'CB'}, {b:'25%', l:'75%', role:'RCB'}, {b:'50%', l:'15%', role:'LM'}, {b:'45%', l:'35%', role:'CM'}, {b:'45%', l:'65%', role:'CM'}, {b:'50%', l:'85%', role:'RM'}, {b:'80%', l:'20%', role:'LW'}, {b:'80%', l:'80%', role:'RW'}, {b:'85%', l:'50%', role:'ST'}],
            '3-4-2-1': [{b:'10%', l:'50%', role:'GK'}, {b:'25%', l:'25%', role:'LCB'}, {b:'25%', l:'50%', role:'CB'}, {b:'25%', l:'75%', role:'RCB'}, {b:'50%', l:'15%', role:'LM'}, {b:'45%', l:'35%', role:'CM'}, {b:'45%', l:'65%', role:'CM'}, {b:'50%', l:'85%', role:'RM'}, {b:'65%', l:'30%', role:'LAM'}, {b:'65%', l:'70%', role:'RAM'}, {b:'85%', l:'50%', role:'ST'}],
            '5-3-2': [{b:'10%', l:'50%', role:'GK'}, {b:'30%', l:'10%', role:'LWB'}, {b:'25%', l:'30%', role:'LCB'}, {b:'25%', l:'50%', role:'CB'}, {b:'25%', l:'70%', role:'RCB'}, {b:'30%', l:'90%', role:'RWB'}, {b:'50%', l:'25%', role:'LCM'}, {b:'45%', l:'50%', role:'CM'}, {b:'50%', l:'75%', role:'RCM'}, {b:'80%', l:'35%', role:'LST'}, {b:'80%', l:'65%', role:'RST'}],
            '5-2-3': [{b:'10%', l:'50%', role:'GK'}, {b:'30%', l:'10%', role:'LWB'}, {b:'25%', l:'30%', role:'LCB'}, {b:'25%', l:'50%', role:'CB'}, {b:'25%', l:'70%', role:'RCB'}, {b:'30%', l:'90%', role:'RWB'}, {b:'50%', l:'35%', role:'CM'}, {b:'50%', l:'65%', role:'CM'}, {b:'80%', l:'20%', role:'LW'}, {b:'80%', l:'80%', role:'RW'}, {b:'85%', l:'50%', role:'ST'}]
        };

        let activeContext = { type: null, index: null }; 
        let lineupState = { starters: new Array(11).fill(null), bench: [], cedera: [], skorsing: [] };

        async function fetchData() {
            document.getElementById('loading-screen').classList.remove('hidden'); document.getElementById('global-selectors').classList.add('hidden'); document.getElementById('icon-refresh').classList.add('animate-spin');
            try {
                const fetchSafe = async (s) => { try { return await (await fetch(API_URL+"?sheet="+s)).json(); } catch(e){ return []; } };
                matchesData = await fetchSafe('Jadwal'); playersData = await fetchSafe('Pemain'); coachesData = await fetchSafe('Pelatih');
                lineupData = await fetchSafe('Lineup'); kejadianData = await fetchSafe('Kejadian');
                
                let select = document.getElementById('select-match'); select.innerHTML = '<option value="">-- 1. Pilih Pertandingan --</option>';
                matchesData.forEach(m => { let idm = m.id_match || m.ID_Match; if(idm) select.innerHTML += `<option value="${idm}">${m.tim_kiri || m.Tim_Kiri} VS ${m.tim_kanan || m.Tim_Kanan} (${idm})</option>`; });
            } catch(e) { alert("Gagal koneksi server."); } 
            finally { document.getElementById('loading-screen').classList.add('hidden'); document.getElementById('global-selectors').classList.remove('hidden'); document.getElementById('icon-refresh').classList.remove('animate-spin'); switchMode('live'); }
        }

        function switchMode(mode) {
            currentMode = mode;
            document.getElementById('tab-live').className = mode==='live' ? "flex-1 py-2.5 text-[10px] font-bold uppercase tracking-widest bg-brand-green/20 text-brand-green border border-brand-green/50 rounded-lg transition-colors" : "flex-1 py-2.5 text-[10px] font-bold uppercase tracking-widest text-gray-500 hover:text-white rounded-lg transition-colors";
            document.getElementById('tab-lineup').className = mode==='lineup' ? "flex-1 py-2.5 text-[10px] font-bold uppercase tracking-widest bg-brand-gold/20 text-brand-gold border border-brand-gold/50 rounded-lg transition-colors" : "flex-1 py-2.5 text-[10px] font-bold uppercase tracking-widest text-gray-500 hover:text-white rounded-lg transition-colors";
            if(mode==='live') { document.getElementById('mode-live').classList.remove('hidden'); document.getElementById('mode-lineup').classList.add('hidden'); } 
            else { document.getElementById('mode-lineup').classList.remove('hidden'); document.getElementById('mode-live').classList.add('hidden'); renderPitch(); renderExtraRoster(); }
        }

        function handleMatchChange() {
            selectedMatchId = document.getElementById('select-match').value;
            let match = matchesData.find(m => String(m.id_match||m.ID_Match) === String(selectedMatchId));
            if(!match) { 
                document.getElementById('team-selectors').classList.add('hidden'); 
                document.getElementById('mode-live').classList.add('opacity-50', 'pointer-events-none'); document.getElementById('mode-lineup').classList.add('opacity-50', 'pointer-events-none'); return; 
            }
            document.getElementById('btn-tim-kiri').innerText = match.tim_kiri || match.Tim_Kiri; document.getElementById('btn-tim-kanan').innerText = match.tim_kanan || match.Tim_Kanan;
            document.getElementById('btn-tim-kiri').className = "flex-1 bg-black border border-white/10 text-gray-400 font-bold text-[11px] py-3 rounded-xl uppercase truncate px-2";
            document.getElementById('btn-tim-kanan').className = "flex-1 bg-black border border-white/10 text-gray-400 font-bold text-[11px] py-3 rounded-xl uppercase truncate px-2";

        function handleTeamChange(posisi) {
            let match = matchesData.find(m => String(m.id_match||m.ID_Match) === String(selectedMatchId));
            selectedTeamName = posisi === 'kiri' ? (match.tim_kiri || match.Tim_Kiri) : (match.tim_kanan || match.Tim_Kanan);
            document.getElementById('btn-tim-kiri').className = posisi==='kiri' ? "flex-1 bg-brand-green/20 border border-brand-green text-brand-green font-bold text-[11px] py-3 rounded-xl uppercase truncate px-2" : "flex-1 bg-black border border-white/10 text-gray-400 font-bold text-[11px] py-3 rounded-xl uppercase truncate px-2";

            allTeamPlayers = playersData.filter(p => String(p.klub||p.Klub||p.tim||p.Tim||"").toLowerCase().trim() === String(selectedTeamName).toLowerCase().trim() && !['PELATIH','COACH','MANAGER'].includes(String(p.posisi||'').toUpperCase().replace(/\s+/g,'')));

        // ==========================================
        // SMART CONTEXT LOGIC (MEMBEDAH PEMAIN LAPANGAN & BENCH)
        // ==========================================
        function syncMatchStateLocally() {
            let lu = lineupData.find(l => String(l.id_match) === String(selectedMatchId) && String(l.tim).toLowerCase() === String(selectedTeamName).toLowerCase());
            onPitchPlayers = []; onBenchPlayers = [];
            
            // LOGIKA TIM SENDIRI
            if(lu) {
                if(lu.starting_xi) onPitchPlayers = lu.starting_xi.split(',').map(s=>s.trim()).filter(s=>s);
                if(lu.bench) onBenchPlayers = lu.bench.split(',').map(s=>s.trim()).filter(s=>s);
                
                let kejs = kejadianData.filter(k => String(k.id_match) === String(selectedMatchId) && String(k.tim).toLowerCase() === String(selectedTeamName).toLowerCase());
                kejs.forEach(k => {
                    let jns = String(k.jenis).toUpperCase().replace(/\s+/g,'');
                    let pmn = String(k.pemain).trim();
                    if(jns === 'SUBOUT') { onPitchPlayers = onPitchPlayers.filter(p => p.toLowerCase() !== pmn.toLowerCase()); onBenchPlayers.push(pmn); }
                    if(jns === 'SUBIN') { onBenchPlayers = onBenchPlayers.filter(p => p.toLowerCase() !== pmn.toLowerCase()); if(!onPitchPlayers.includes(pmn)) onPitchPlayers.push(pmn); }
                });
                showLog('<span class="text-brand-green">Sistem: Filter Lapangan vs Cadangan Aktif!</span>');
            } else {
                onPitchPlayers = allTeamPlayers.map(p => p.nama_pemain||p.nama||p.Pemain);
                showLog('<span class="text-yellow-500">Peringatan: Lineup belum disubmit. Semua pemain terbuka.</span>');
            }

            // RADAR PENCARI KIPER LAWAN (Untuk Auto-Save Penalty)
            let match = matchesData.find(m => String(m.id_match||m.ID_Match) === String(selectedMatchId));
            let enemyTeamName = (selectedTeamName === (match.tim_kiri||match.Tim_Kiri)) ? (match.tim_kanan||match.Tim_Kanan) : (match.tim_kiri||match.Tim_Kiri);
            
            let enemyLu = lineupData.find(l => String(l.id_match) === String(selectedMatchId) && String(l.tim).toLowerCase() === String(enemyTeamName).toLowerCase());
            let enemyPitch = [];
            if (enemyLu && enemyLu.starting_xi) {
                enemyPitch = enemyLu.starting_xi.split(',').map(s=>s.trim()).filter(s=>s);
                let enemyKejs = kejadianData.filter(k => String(k.id_match) === String(selectedMatchId) && String(k.tim).toLowerCase() === String(enemyTeamName).toLowerCase());
                enemyKejs.forEach(k => {
                    let jns = String(k.jenis).toUpperCase().replace(/\s+/g,'');
                    let pmn = String(k.pemain).trim();
                    if(jns === 'SUBOUT') { enemyPitch = enemyPitch.filter(p => p.toLowerCase() !== pmn.toLowerCase()); }
                    if(jns === 'SUBIN') { if(!enemyPitch.includes(pmn)) enemyPitch.push(pmn); }
                });
            } else {
                enemyPitch = playersData.filter(p => String(p.klub||p.Klub||p.tim||p.Tim||"").toLowerCase().trim() === String(enemyTeamName).toLowerCase().trim()).map(p => p.nama_pemain||p.nama||p.Pemain);
            }
            
            window.activeEnemyGK = null;
            for (let ep of enemyPitch) {
                let pObj = playersData.find(p => String(p.nama_pemain||p.nama||p.Pemain).toLowerCase() === ep.toLowerCase() && String(p.klub||p.Klub||p.tim||p.Tim||"").toLowerCase() === String(enemyTeamName).toLowerCase());
                let pos = pObj ? String(pObj.posisi||'').toUpperCase().replace(/\s+/g,'') : '';
                if (pos === 'GK' || pos === 'KIPER') {
                    window.activeEnemyGK = ep; break;
                }
            }
            
            // Reset Tampilan ke Form Gol
            setEventMode('Gol', document.querySelector('.evt-btn.active-btn') || document.querySelectorAll('.evt-btn')[0]);
        }

        // ONE-SHOT FORM GENERATOR (GOL + ASSIST SEKALI KLIK)

                lPrimary.innerHTML = '🟥 Pelaku Kejadian <span class="text-gray-500 ml-1">(On Pitch)</span>';

                lPrimary.innerHTML = '🤦‍♂️ Pemain (Own Goal) <span class="text-gray-500 ml-1">(On Pitch)</span>'; 
                listPrimary.innerHTML = fallbackOpt;
            }
            else if (jenis === 'Penyelamatan Penalti') {

        async function submitEvent() {
            let menit = document.getElementById('input-menit').value.trim();
            if(!selectedMatchId || !selectedTeamName || !menit) return alert("Isi Menit & Pilih Tim!");
            
            let p1 = document.getElementById('select-primary').value.trim(); 
            let p2 = document.getElementById('select-secondary').value.trim();
            
            if(p1 === '') return alert("Isi nama pemain utama!");
            if(currentEvtMode === 'Substitusi' && p2 === '') return alert("Isi nama pemain pengganti!");
            
            // Penanda manual (Jika nama yang diketik tidak ada di database)
            let isP1Manual = !allTeamPlayers.some(p => String(p.nama_pemain||p.nama||p.Pemain).toUpperCase() === p1.toUpperCase());
            if (isP1Manual) {
                p1 = p1.toUpperCase() + " (TRIAL)";
            }
            
            let isP2Manual = p2 !== '' && !allTeamPlayers.some(p => String(p.nama_pemain||p.nama||p.Pemain).toUpperCase() === p2.toUpperCase());
            if (isP2Manual) {
                p2 = p2.toUpperCase() + " (TRIAL)";
            }

            let btn = document.getElementById('btn-submit-live'); btn.disabled = true; btn.innerHTML = "Memproses..."; showLog('<span class="text-yellow-500">Mengirim ke server...</span>');

            const sendPost = async (pNm, jns, overrideTim = null) => { 
                await fetch(API_URL, { 
                    method: 'POST', 
                    body: JSON.stringify({ 
                        action: 'submit_event', 
                        payload: { 
                            id_match: selectedMatchId, 
                            waktu: new Date().toISOString(), 
                            menit: menit, 
                            tim: overrideTim || selectedTeamName, 
                            pemain: pNm, 
                            jenis: jns 
                        } 
                    }) 
                }); 
            };

            try {
                if(currentEvtMode === 'Substitusi') {
                    await sendPost(p1, 'Sub Out'); 
                    await sendPost(p2, 'Sub In'); 
                    showLog(`Sukses! Substitusi [${p1} ➔ ${p2}]`);
                    
                    onPitchPlayers = onPitchPlayers.filter(p => p !== p1); onBenchPlayers = onBenchPlayers.filter(p => p !== p2);
                    onPitchPlayers.push(p2); onBenchPlayers.push(p1); 
                } 
                else if(currentEvtMode === 'Gol') {
                    let isPen = document.getElementById('check-penalti').checked;
                    
                    // PENDEKATAN BARU: Nama pemain murni, Jenis Kejadian yang diubah
                    let jenisGol = isPen ? 'Gol Penalti' : 'Gol';
                    
                    // USER REQUEST: ASSIST DULU BARU GOL (Agar Timeline Urut)
                    if(p2) { await sendPost(p2, 'Assist'); }
                    await sendPost(p1, jenisGol); 
                    
                    showLog(`Sukses! ${jenisGol}: ${p1} ${p2 ? '(Assist: '+p2+')' : ''}`);
                }
                else if(currentEvtMode === 'Gagal Penalti') {
                    // USER REQUEST: Miss penalty auto triggers Save Penalty for enemy GK
                    await sendPost(p1, 'Gagal Penalti');
                    
                    let enemyMatch = matchesData.find(m => String(m.id_match||m.ID_Match) === String(selectedMatchId));
                    let enemyTeam = (selectedTeamName === (enemyMatch.tim_kiri||enemyMatch.Tim_Kiri)) ? (enemyMatch.tim_kanan||enemyMatch.Tim_Kanan) : (enemyMatch.tim_kiri||enemyMatch.Tim_Kiri);
                    
                    if (window.activeEnemyGK) {
                        await sendPost(window.activeEnemyGK, 'Penyelamatan Penalti', enemyTeam);
                        showLog(`Sukses! Gagal Penalti: ${p1}. Auto-Save: ${window.activeEnemyGK} (${enemyTeam})`);
                    } else {
                        showLog(`Sukses! Gagal Penalti: ${p1}. (Kiper Lawan tidak ditemukan di radar)`);
                    }
                }
                else { 
                    await sendPost(p1, currentEvtMode); 
                    showLog(`Sukses! ${currentEvtMode} ➔ ${p1}`); 
                }
                
                document.getElementById('input-menit').value = ''; 
                setEventMode(currentEvtMode, document.querySelector('.evt-btn.active-btn')); 
            } catch(e) { showLog("Gagal mengirim data.", true); } 
            finally { btn.disabled = false; btn.innerHTML = `<i data-lucide="send" class="w-4 h-4 inline"></i> Eksekusi Data`; lucide.createIcons(); }
        }

        const showLog = (msg, isErr=false) => { let l = document.getElementById('log-status'); l.classList.remove('hidden'); l.innerHTML = `<span class="${isErr ? 'text-red-500' : 'text-brand-green'}">${msg}</span>`; };

        // ==========================================
        // RAKIT LINEUP LOGIC (TETAP SAMA SEPERTI SEBELUMNYA)
        // ==========================================
        function resetLineup() { lineupState = { starters: new Array(11).fill(null), bench: [], cedera: [], skorsing: [] }; renderPitch(); renderExtraRoster(); document.getElementById('select-pelatih').value = ''; }
        function renderPitch() {
            const formKey = document.getElementById('select-formasi').value; const slots = FORMATIONS[formKey]; let container = document.getElementById('pitch-slots'); let html = '';
            slots.forEach((s, i) => {
                let p = lineupState.starters[i];
                if(p) { 
                    let nmRaw = p.nama_pemain||p.nama||p.Pemain; 
                    // Filter UI Cerdas
                    let isTrial = nmRaw.toUpperCase().includes('(TRIAL)');
                    let nmClean = nmRaw.replace(/\(TRIAL\)/i, '').trim();
                    
                    let f = p.foto ? p.foto : `https://ui-avatars.com/api/?name=${encodeURIComponent(nmClean)}&background=fff&color=000&bold=true`; 
                    let badge = isTrial ? `<span class="text-brand-gold ml-0.5 text-[10px] leading-none drop-shadow-md">*</span>` : '';
                    
                    html += `<div class="builder-slot filled" style="bottom:${s.b}; left:${s.l}; background-image:url('${f}')" onclick="openPicker('starter', ${i})"><span class="slot-label bg-brand-green border-brand-green text-white flex items-center">${nmClean.split(' ')[0]}${badge}</span></div>`; 
                } 
                else { html += `<div class="builder-slot empty" style="bottom:${s.b}; left:${s.l};" onclick="openPicker('starter', ${i})"><i data-lucide="plus" class="w-4 h-4 text-white/50 mx-auto mt-2"></i><span class="slot-label">${s.role}</span></div>`; }
            }); container.innerHTML = html; lucide.createIcons();
        }
        function renderExtraRoster() {
            const buildBadge = (arr, type) => { 
                if(arr.length === 0) return '<div class="text-[8px] text-gray-500 italic w-full">Kosong</div>'; 
                return arr.map((p, i) => { 
                    let nmRaw = p.nama_pemain||p.nama||p.Pemain; 
                    // Filter UI Cerdas
                    let isTrial = nmRaw.toUpperCase().includes('(TRIAL)');
                    let nmClean = nmRaw.replace(/\(TRIAL\)/i, '').trim();
                    let badge = isTrial ? `<span class="bg-brand-gold text-black px-1 rounded-[2px] ml-1.5 text-[6px]">TRIAL</span>` : '';
                    
                    return `<div class="bg-gray-800 border border-gray-600 px-2 py-1 rounded text-[9px] font-bold text-white uppercase flex items-center">${nmClean}${badge} <button type="button" onclick="removeExtra('${type}',${i})" class="text-red-400 hover:text-white hover:bg-red-500 w-4 h-4 flex items-center justify-center rounded-full ml-2 transition-colors cursor-pointer">&times;</button></div>`; 
                }).join(''); 
            };
            document.getElementById('list-bench').innerHTML = buildBadge(lineupState.bench, 'bench'); 
            document.getElementById('list-cedera').innerHTML = buildBadge(lineupState.cedera, 'cedera'); 
            document.getElementById('list-skorsing').innerHTML = buildBadge(lineupState.skorsing, 'skorsing');
        }
        // Fungsi untuk menghapus pemain dari Bench/Cedera/Skorsing
        function removeExtra(type, index) { 
            lineupState[type].splice(index, 1); 
            renderExtraRoster(); 
        }
        function openPicker(type, index = null) {
            if(!selectedTeamName) return alert("Pilih tim terlebih dahulu!"); 
            activeContext = { type, index }; 
            let title = '', sub = '';
            
            if(type === 'starter') { 
                title = 'Pilih Starter XI'; 
                sub = `Posisi Slot: ${FORMATIONS[document.getElementById('select-formasi').value][index].role}`; 
                document.getElementById('picker-remove-btn').classList.remove('hidden'); 
            }
            else if(type === 'bench') { 
                title = 'Pilih Cadangan'; 
                sub = 'Tambahkan ke bangku cadangan'; 
                document.getElementById('picker-remove-btn').classList.add('hidden'); 
            }
            else if(type === 'cedera') { 
                title = 'Pilih Pemain Cedera'; 
                sub = 'Tandai 🚑'; 
                document.getElementById('picker-remove-btn').classList.add('hidden'); 
            }
            else if(type === 'skorsing') { 
                title = 'Pilih Skorsing'; 
                sub = 'Tandai 🟥'; 
                document.getElementById('picker-remove-btn').classList.add('hidden'); 
            }
            
            document.getElementById('picker-title').innerText = title; 
            document.getElementById('picker-subtitle').innerText = sub; 
            document.getElementById('picker-search').value = ''; 
            
            renderPickerList();
            
            document.getElementById('modal-picker').classList.remove('hidden'); 
            document.getElementById('modal-picker').classList.add('flex'); 
            document.body.style.overflow = 'hidden';
        }
        function closePicker() { document.getElementById('modal-picker').classList.add('hidden'); document.getElementById('modal-picker').classList.remove('flex'); document.body.style.overflow = ''; }
        function renderPickerList() {
            let q = document.getElementById('picker-search').value.toLowerCase().trim();
            let selectedNames = []; lineupState.starters.forEach(p => { if(p) selectedNames.push(String(p.nama_pemain||p.nama||p.Pemain).toLowerCase()); }); lineupState.bench.forEach(p => selectedNames.push(String(p.nama_pemain||p.nama||p.Pemain).toLowerCase())); lineupState.cedera.forEach(p => selectedNames.push(String(p.nama_pemain||p.nama||p.Pemain).toLowerCase())); lineupState.skorsing.forEach(p => selectedNames.push(String(p.nama_pemain||p.nama||p.Pemain).toLowerCase()));
            let available = allTeamPlayers.filter(p => !selectedNames.includes(String(p.nama_pemain||p.nama||p.Pemain).toLowerCase()));
            if(q) available = available.filter(p => String(p.nama_pemain||p.nama||p.Pemain).toLowerCase().includes(q) || String(p.posisi||'').toLowerCase().includes(q));
            let html = '';
            if(available.length === 0) { html = '<div class="text-[10px] text-gray-500 text-center py-6">Pemain habis/tidak ditemukan</div>'; }
            else { available.forEach((p, idx) => { let nm = p.nama_pemain||p.nama||p.Pemain; let f = p.foto ? p.foto : `https://ui-avatars.com/api/?name=${nm}&background=000&color=fff`; html += `<div onclick="selectPlayerForContext(${playersData.indexOf(p)})" class="flex items-center gap-3 p-3 bg-white/5 border border-white/10 rounded-xl cursor-pointer hover:border-brand-green transition-colors"><img src="${f}" class="w-10 h-10 rounded-full border border-gray-600 bg-white object-cover"><div class="flex-1"><h4 class="font-bold text-xs uppercase text-white">${nm}</h4><span class="text-[8px] font-bold text-gray-400 uppercase tracking-widest">${p.posisi||'POS'}</span></div><i data-lucide="plus-circle" class="w-5 h-5 text-gray-500"></i></div>`; }); }
            document.getElementById('picker-list').innerHTML = html; lucide.createIcons();
        }
        function selectPlayerForContext(globalIndex) { let p = playersData[globalIndex]; if(activeContext.type === 'starter') { lineupState.starters[activeContext.index] = p; renderPitch(); } else { lineupState[activeContext.type].push(p); renderExtraRoster(); } closePicker(); }
        function removeSelectedPlayer() { if(activeContext.type === 'starter' && activeContext.index !== null) { lineupState.starters[activeContext.index] = null; renderPitch(); } closePicker(); }
        async function submitLineup() {
            if(!selectedMatchId || !selectedTeamName) return alert("Pilih Laga & Tim dulu!");
            const getNamesRaw = (arr) => arr.map(p => p ? (p.nama_pemain||p.nama||p.Pemain) : '').join(',');
            const getNamesClean = (arr) => arr.filter(x=>x).map(p => p.nama_pemain||p.nama||p.Pemain).join(', ');
            let startersStr = getNamesRaw(lineupState.starters); let sCount = lineupState.starters.filter(x => x !== null).length;
            if(sCount < 11) { if(!confirm(`Papan taktik baru terisi ${sCount}/11 pemain. Yakin simpan?`)) return; }
            let btn = document.getElementById('btn-submit-lineup'); btn.disabled = true; btn.innerHTML = "Merekam..."; showLog('<span class="text-yellow-500">Merekam struktur Lineup...</span>');
            try { let payload = { id_match: selectedMatchId, tim: selectedTeamName, formasi: document.getElementById('select-formasi').value, pelatih: document.getElementById('select-pelatih').value, starting_xi: startersStr, bench: getNamesClean(lineupState.bench), cedera: getNamesClean(lineupState.cedera), skorsing: getNamesClean(lineupState.skorsing) }; await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'submit_lineup', payload: payload }) }); showLog(`Sukses! Susunan pemain ${selectedTeamName} resmi dikunci.`); } catch(e) { showLog("Gagal menyimpan lineup.", true); } finally { btn.disabled = false; btn.innerHTML = "Simpan Lineup Resmi"; }
        }

        // ==========================================
        // FUNGSI INJEKSI PEMAIN MANUAL (TRIAL)
        // ==========================================
        function pilihPemainManual() {
            let val = document.getElementById('manual-player-input').value.trim().toUpperCase();
            if(val === '') return alert('Ketik nama pemain terlebih dahulu!');

            // Buat profil palsu (Bypass)
            let dummyPlayer = {
                nama_pemain: val + " (TRIAL)",
                posisi: "POS",
                nomor: "-",
                foto: `https://ui-avatars.com/api/?name=${encodeURIComponent(val)}&background=000&color=fff`
            };

            // Masukkan profil palsu ke barisan Lineup
            if(activeContext.type === 'starter' && activeContext.index !== null) { 
                lineupState.starters[activeContext.index] = dummyPlayer; 
                renderPitch(); 
            } else { 
                lineupState[activeContext.type].push(dummyPlayer); 
                renderExtraRoster(); 
            } 
            
            // Bersihkan teks dan tutup laci
            document.getElementById('manual-player-input').value = '';
            closePicker();
        }

        window.onload = fetchData;
    </script>
</body>
</html>
