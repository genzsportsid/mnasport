<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MNA FC | Command Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'brand-blue': '#1d4ed8', 'brand-neon': '#3b82f6', 'brand-gold': '#d7b67d',
                        'brand-dark': '#050505', 'brand-surface': '#111111',
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap');
        body { background-color: #050505; color: #ffffff; -webkit-tap-highlight-color: transparent; font-family: 'Inter', sans-serif; }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .glass-panel { background: rgba(17, 17, 17, 0.7); backdrop-filter: blur(24px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .player-card { transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .player-card:hover { transform: translateY(-8px) scale(1.02); border-color: rgba(59, 130, 246, 0.4); }
        
        .pitch-wrapper { position: relative; width: 100%; max-width: 320px; margin: 0 auto; border-radius: 16px; overflow: hidden; border: 1.5px solid rgba(255, 255, 255, 0.15); box-shadow: inset 0 0 40px rgba(0,0,0,0.5); }
        .pitch-wrapper::before { content: ""; display: block; padding-top: 145%; }
        .pitch-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transition: all 0.5s ease; }
        .pitch-football { background: #061c06; background-image: repeating-linear-gradient(0deg, transparent, transparent 10%, rgba(255,255,255,0.02) 10%, rgba(255,255,255,0.02) 20%); }
        .pitch-futsal { background: #091324; background-image: repeating-linear-gradient(0deg, transparent, transparent 10%, rgba(255,255,255,0.02) 10%, rgba(255,255,255,0.02) 20%); }

        .pitch-line { position: absolute; border: 1.5px solid rgba(255, 255, 255, 0.2); }
        .pitch-half { top: 0; left: 0; width: 100%; height: 50%; border-bottom: 1.5px solid rgba(255, 255, 255, 0.2); }
        .pitch-circle { top: 50%; left: 50%; width: 60px; height: 60px; border-radius: 50%; transform: translate(-50%, -50%); }
        
        .position-zone { position: absolute; transform: translate(-50%, 50%); border-radius: 12px; pointer-events: none; z-index: 5; opacity: 0.7; }
        .player-marker { position: absolute; width: 38px; height: 38px; border: 2px solid white; border-radius: 50%; transform: translate(-50%, 50%); display: flex; align-items: center; justify-content: center; text-align: center; font-size: 10px; font-weight: 900; color: white; text-shadow: 0px 1px 3px rgba(0,0,0,0.8); z-index: 10; }
        
        .lineup-slot { position: absolute; width: 42px; height: 42px; border-radius: 50%; transform: translate(-50%, 50%); z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0,0,0,0.6); border: 2px dashed rgba(255,255,255,0.5); backdrop-filter: blur(4px); cursor: pointer; transition: all 0.3s; }
        .lineup-slot.active { border-color: #3b82f6; box-shadow: 0 0 20px rgba(59, 130, 246, 0.6); transform: translate(-50%, 50%) scale(1.15); background: rgba(59, 130, 246, 0.2); }
        .lineup-slot.filled { border-style: solid; border-color: white; background-size: cover; background-position: center; }
        .lineup-slot-label { position: absolute; bottom: -16px; white-space: nowrap; font-size: 8px; font-weight: 900; background: rgba(0,0,0,0.8); padding: 2px 6px; border-radius: 4px; color: white; border: 1px solid rgba(255,255,255,0.2); text-transform: uppercase; }

        .pool-card { min-width: 70px; width: 70px; transition: all 0.2s; cursor: pointer;}
        .pool-card:active { transform: scale(0.95); }
        .pool-card.disabled { opacity: 0.3; pointer-events: none; filter: grayscale(100%); }

        .stagger-item { animation: fadeUp 0.5s ease forwards; opacity: 0; transform: translateY(10px); }
        @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }
        .page-slide-in { transform: translateX(0) !important; }
        .shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake { 10%, 90% { transform: translate3d(-1px, 0, 0); } 20%, 80% { transform: translate3d(2px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-4px, 0, 0); } 40%, 60% { transform: translate3d(4px, 0, 0); } }

        /* Tracker Specific */
        .tracker-pitch-wrapper { max-width: 200px; margin: 0 auto; border-radius: 12px; }
        .tracker-slot { position: absolute; width: 28px; height: 28px; border-radius: 50%; transform: translate(-50%, 50%); border: 1.5px solid white; background-size: cover; background-position: center; z-index: 10; box-shadow: 0 2px 5px rgba(0,0,0,0.5);}
        .tracker-slot-label { position: absolute; bottom: -12px; left: 50%; transform: translateX(-50%); font-size: 7px; font-weight: 900; background: rgba(0,0,0,0.8); padding: 1px 4px; border-radius: 3px; white-space: nowrap;}
    </style>
</head>
<body class="bg-brand-dark pb-32">

    <header class="fixed top-0 w-full z-50 glass-panel border-b border-white/5 pt-safe">
        <div class="max-w-4xl mx-auto px-5 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-lg bg-brand-blue flex items-center justify-center"><span class="font-black text-white text-xs">M</span></div>
                <h1 class="font-black text-lg italic tracking-tighter uppercase text-white" id="brand-name">MNA FC</h1>
            </div>
            <div class="flex items-center gap-2">
                <div id="main-nav-tabs" class="flex bg-white/5 p-1 rounded-xl border border-white/10">
                    <button onclick="switchMode('squad')" id="tab-squad" class="px-3 py-1.5 text-[9px] font-black uppercase tracking-widest rounded-lg transition-all bg-brand-blue text-white shadow-lg">Squad</button>
                    <button onclick="switchMode('lineup')" id="tab-lineup" class="px-3 py-1.5 text-[9px] font-bold uppercase tracking-widest rounded-lg transition-all text-gray-500 hover:text-white">Lineup</button>
                    <button onclick="switchMode('gallery')" id="tab-gallery" class="px-3 py-1.5 text-[9px] font-bold uppercase tracking-widest rounded-lg transition-all text-gray-500 hover:text-white">Media</button>
                </div>
                <button id="btn-lock" onclick="openCoachGate()" class="p-2 ml-1 bg-white/5 rounded-xl border border-white/10 text-brand-gold hover:bg-brand-gold hover:text-black transition-colors shadow-lg">
                    <i data-lucide="lock" class="w-4 h-4"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="pt-24 px-5 max-w-4xl mx-auto">
        <div id="sport-dashboard-container" class="block animate-fade-in">
            <div class="flex gap-2 mb-6 bg-white/5 p-1.5 rounded-2xl border border-white/5">
                <button id="btn-fc" onclick="switchSport('mnafc')" class="flex-1 py-3 rounded-xl text-[10px] font-black uppercase tracking-widest flex items-center justify-center gap-2 transition-all bg-brand-blue text-white shadow-lg"><i data-lucide="circle-dot" class="w-3 h-3"></i> Sepak Bola</button>
                <button id="btn-futsal" onclick="switchSport('futsal')" class="flex-1 py-3 rounded-xl text-[10px] font-bold uppercase tracking-widest flex items-center justify-center gap-2 transition-all text-gray-500 hover:text-white"><i data-lucide="zap" class="w-3 h-3"></i> Futsal</button>
            </div>
        </div>

        <div id="view-squad" class="block animate-fade-in">
            <div class="glass-panel rounded-3xl p-6 mb-6 border border-white/5 relative overflow-hidden">
                <div class="absolute -right-20 -top-20 w-64 h-64 bg-brand-blue/10 blur-[80px] rounded-full"></div>
                <div class="grid grid-cols-3 gap-4 relative z-10">
                    <div><p class="text-[9px] font-bold text-gray-500 uppercase tracking-widest mb-1">Win Rate</p><p id="win-rate" class="text-3xl font-black text-brand-neon">0%</p></div>
                    <div class="pl-4 border-l border-white/10"><p class="text-[9px] font-bold text-gray-500 uppercase tracking-widest mb-1">W-S-K</p><p id="match-record" class="text-3xl font-black text-white">0-0-0</p></div>
                    <div class="pl-4 border-l border-white/10"><p class="text-[9px] font-bold text-gray-500 uppercase tracking-widest mb-1">Goal Diff</p><p id="goal-diff" class="text-3xl font-black text-brand-gold">+0</p></div>
                </div>
            </div>

            <div class="sticky top-16 z-40 bg-brand-dark/90 backdrop-blur-xl py-4 -mx-5 px-5 mb-4 border-b border-white/5">
                <div class="relative flex-1 mb-4">
                    <i data-lucide="search" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-500"></i>
                    <input type="text" id="playerSearch" oninput="runFilter()" placeholder="Cari nama, posisi, atau instansi..." class="w-full bg-white/5 border border-white/10 rounded-2xl py-3 pl-12 pr-4 text-sm font-medium outline-none focus:border-brand-neon transition-colors text-white placeholder-gray-500">
                </div>
                <div id="filter-football" class="flex gap-2 overflow-x-auto hide-scroll">
                    <button onclick="setPosFilter('ALL', this, 'mnafc')" class="pos-btn-fc bg-brand-blue text-white px-6 py-2 rounded-xl text-[9px] font-black uppercase border border-brand-blue transition-all">Semua</button>
                    <button onclick="setPosFilter('GK', this, 'mnafc')" class="pos-btn-fc text-gray-500 bg-white/5 px-6 py-2 rounded-xl text-[9px] font-bold uppercase border border-white/10 transition-all">GK</button>
                    <button onclick="setPosFilter('DEF', this, 'mnafc')" class="pos-btn-fc text-gray-500 bg-white/5 px-6 py-2 rounded-xl text-[9px] font-bold uppercase border border-white/10 transition-all">DEF</button>
                    <button onclick="setPosFilter('MID', this, 'mnafc')" class="pos-btn-fc text-gray-500 bg-white/5 px-6 py-2 rounded-xl text-[9px] font-bold uppercase border border-white/10 transition-all">MID</button>
                    <button onclick="setPosFilter('FWD', this, 'mnafc')" class="pos-btn-fc text-gray-500 bg-white/5 px-6 py-2 rounded-xl text-[9px] font-bold uppercase border border-white/10 transition-all">FWD</button>
                </div>
                <div id="filter-futsal" class="hidden gap-2 overflow-x-auto hide-scroll">
                    <button onclick="setPosFilter('ALL', this, 'futsal')" class="pos-btn-fs bg-brand-blue text-white px-6 py-2 rounded-xl text-[9px] font-black uppercase border border-brand-blue transition-all">Semua</button>
                    <button onclick="setPosFilter('GK', this, 'futsal')" class="pos-btn-fs text-gray-500 bg-white/5 px-6 py-2 rounded-xl text-[9px] font-bold uppercase border border-white/10 transition-all">GK</button>
                    <button onclick="setPosFilter('ANC', this, 'futsal')" class="pos-btn-fs text-gray-500 bg-white/5 px-6 py-2 rounded-xl text-[9px] font-bold uppercase border border-white/10 transition-all">Anchor</button>
                    <button onclick="setPosFilter('FLK', this, 'futsal')" class="pos-btn-fs text-gray-500 bg-white/5 px-6 py-2 rounded-xl text-[9px] font-bold uppercase border border-white/10 transition-all">Flank</button>
                    <button onclick="setPosFilter('PVT', this, 'futsal')" class="pos-btn-fs text-gray-500 bg-white/5 px-6 py-2 rounded-xl text-[9px] font-bold uppercase border border-white/10 transition-all">Pivot</button>
                </div>
            </div>
            <div id="playerGrid" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>
        </div>

        <div id="view-lineup" class="hidden animate-fade-in">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-xs font-black uppercase tracking-widest text-brand-neon flex items-center gap-2"><i data-lucide="clipboard-list" class="w-4 h-4"></i> Tactical Board</h2>
                <select id="formation-select" onchange="changeFormation(this.value)" class="bg-white/5 border border-white/10 text-white text-[10px] font-bold uppercase rounded-lg py-1 px-3 outline-none focus:border-brand-neon"></select>
            </div>
            
            <div class="glass-panel p-4 rounded-[2rem] border border-white/5 mb-6">
                <div class="pitch-wrapper">
                    <div id="lineup-pitch" class="pitch-container pitch-football">
                        <div class="pitch-half pitch-line"></div><div class="pitch-circle pitch-line"></div>
                        <div class="pitch-line" style="top:0; left:20%; width:60%; height:18%; border-top:0;"></div>
                        <div class="pitch-line" style="bottom:0; left:20%; width:60%; height:18%; border-bottom:0;"></div>
                        <div id="lineup-slots-container"></div>
                    </div>
                </div>
            </div>

            <div class="mb-4">
                <p class="text-[9px] font-bold text-gray-500 uppercase tracking-widest mb-3" id="lineup-instruction">1. Pilih slot di lapangan</p>
                <div id="lineup-pool" class="flex gap-3 overflow-x-auto hide-scroll pb-2 transition-opacity duration-300 opacity-30 pointer-events-none"></div>
            </div>
            
            <button onclick="resetLineup()" class="w-full py-3 rounded-xl border border-red-500/30 text-red-400 text-[10px] font-bold uppercase tracking-widest hover:bg-red-500/10 transition-colors mb-8">
                <i data-lucide="trash-2" class="w-3 h-3 inline pb-0.5"></i> Kosongkan Lineup
            </button>
        </div>

        <div id="view-gallery" class="hidden animate-fade-in">
            <div class="sticky top-16 z-40 bg-brand-dark/90 backdrop-blur-xl py-4 -mx-5 px-5 mb-4 border-b border-white/5">
                <div class="relative w-full">
                    <i data-lucide="search" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-500"></i>
                    <input type="text" id="mediaSearch" oninput="runMediaFilter()" placeholder="Cari kegiatan atau tanggal..." class="w-full bg-white/5 border border-white/10 rounded-2xl py-3 pl-12 pr-4 text-sm font-medium outline-none focus:border-brand-neon transition-colors text-white placeholder-gray-500">
                </div>
            </div>
            <div id="galleryGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-5"></div>
        </div>
        
        <div id="view-match-tracker" class="hidden animate-fade-in pb-10">
            <div class="glass-panel p-4 rounded-3xl mb-6 border border-brand-gold/30 shadow-[0_0_20px_rgba(215,182,125,0.1)] flex justify-between items-center relative overflow-hidden">
                <div class="absolute inset-0 bg-gradient-to-r from-brand-blue/20 via-transparent to-red-500/20"></div>
                <div class="text-center w-1/3 relative z-10">
                    <p class="text-[9px] font-black text-brand-neon tracking-widest uppercase mb-1">MNA</p>
                    <p class="text-5xl font-black text-white drop-shadow-md" id="score-home">0</p>
                </div>
                <div class="text-center w-1/3 relative z-10" onclick="toggleTimer()">
                    <p class="text-2xl font-black text-brand-gold tracking-widest mb-1" id="match-timer">00:00</p>
                    <span id="timer-status" class="text-[8px] font-black text-white bg-white/10 px-3 py-1 rounded-full uppercase tracking-widest cursor-pointer">Start</span>
                </div>
                <div class="text-center w-1/3 relative z-10">
                    <p class="text-[9px] font-black text-red-400 tracking-widest uppercase mb-1">Lawan</p>
                    <p class="text-5xl font-black text-white drop-shadow-md" id="score-away">0</p>
                </div>
            </div>

            <div class="flex justify-center mb-6">
                <div class="pitch-wrapper tracker-pitch-wrapper">
                    <div id="tracker-pitch" class="pitch-container pitch-football">
                        <div class="pitch-half pitch-line"></div><div class="pitch-circle pitch-line"></div>
                        <div id="tracker-slots-container"></div>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4 mb-4">
                <button onclick="triggerAction('goal_home')" class="bg-green-600/20 border border-green-500 text-green-400 p-5 rounded-3xl flex flex-col items-center justify-center gap-2 hover:bg-green-500 hover:text-white transition-all shadow-[0_0_25px_rgba(34,197,94,0.2)]">
                    <i data-lucide="goal" class="w-8 h-8"></i><span class="text-xs font-black uppercase tracking-widest">Goal Scored</span>
                </button>
                <button onclick="triggerAction('goal_away')" class="bg-red-600/20 border border-red-500 text-red-400 p-5 rounded-3xl flex flex-col items-center justify-center gap-2 hover:bg-red-500 hover:text-white transition-all shadow-[0_0_25px_rgba(239,68,68,0.2)]">
                    <i data-lucide="shield-alert" class="w-8 h-8"></i><span class="text-xs font-black uppercase tracking-widest">Conceded</span>
                </button>
            </div>
            
            <div class="grid grid-cols-4 gap-2 mb-6">
                <button onclick="triggerAction('assist')" class="bg-white/5 border border-white/10 p-3 rounded-2xl flex flex-col items-center gap-1.5 hover:bg-white/10 transition-colors"><i data-lucide="footprints" class="w-5 h-5 text-brand-neon"></i><span class="text-[8px] font-bold uppercase">Assist</span></button>
                <button onclick="triggerAction('sub')" class="bg-white/5 border border-white/10 p-3 rounded-2xl flex flex-col items-center gap-1.5 hover:bg-white/10 transition-colors"><i data-lucide="arrow-left-right" class="w-5 h-5 text-brand-gold"></i><span class="text-[8px] font-bold uppercase">Sub</span></button>
                <button onclick="triggerAction('yellow')" class="bg-white/5 border border-white/10 p-3 rounded-2xl flex flex-col items-center gap-1.5 hover:border-yellow-500 transition-colors"><div class="w-4 h-5 bg-yellow-400 rounded shadow-sm"></div><span class="text-[8px] font-bold uppercase">Yellow</span></button>
                <button onclick="triggerAction('red')" class="bg-white/5 border border-white/10 p-3 rounded-2xl flex flex-col items-center gap-1.5 hover:border-red-500 transition-colors"><div class="w-4 h-5 bg-red-600 rounded shadow-sm"></div><span class="text-[8px] font-bold uppercase">Red</span></button>
                
                <button onclick="triggerAction('pen_won')" class="col-span-2 bg-white/5 border border-white/10 p-3 rounded-2xl flex items-center justify-center gap-2 hover:bg-white/10 transition-colors"><i data-lucide="target" class="w-4 h-4 text-green-400"></i><span class="text-[9px] font-bold uppercase">Pen Won</span></button>
                <button onclick="triggerAction('pen_miss')" class="col-span-2 bg-white/5 border border-white/10 p-3 rounded-2xl flex items-center justify-center gap-2 hover:bg-white/10 transition-colors"><i data-lucide="x-circle" class="w-4 h-4 text-red-400"></i><span class="text-[9px] font-bold uppercase">Pen Missed</span></button>
            </div>

            <div class="bg-[#0a0a0a] border border-white/5 rounded-3xl p-5 min-h-[150px] max-h-[250px] overflow-y-auto mb-8 shadow-inner" id="event-log">
                <p class="text-[9px] text-gray-500 font-bold uppercase tracking-widest text-center mt-10">Belum ada kejadian tercatat</p>
            </div>

            <button onclick="endMatch()" class="w-full bg-gradient-to-r from-brand-blue to-brand-neon text-white py-4 rounded-2xl font-black uppercase text-[10px] tracking-widest shadow-[0_0_20px_rgba(59,130,246,0.3)]">
                <i data-lucide="save" class="w-4 h-4 inline pb-0.5 mr-1"></i> Simpan Match ke Database
            </button>
            <button onclick="closeMatchTracker()" class="w-full text-gray-500 hover:text-white transition-colors py-4 font-bold uppercase text-[9px] tracking-widest mt-2">
                Tutup & Kembali
            </button>
        </div>

    </main>

    <div id="actionModal" class="fixed inset-0 z-[250] hidden flex flex-col justify-end p-0 sm:p-4">
        <div class="absolute inset-0 bg-black/80 backdrop-blur-sm" onclick="closeActionModal()"></div>
        <div class="relative bg-brand-surface border-t border-x border-white/10 sm:border rounded-t-3xl sm:rounded-3xl p-6 w-full max-w-md mx-auto z-10 modal-enter pb-safe">
            <h3 id="action-title" class="text-sm font-black text-white uppercase tracking-widest mb-4 text-center">Pilih Pemain</h3>
            <div id="action-player-list" class="grid grid-cols-4 gap-3 max-h-[50vh] overflow-y-auto hide-scroll">
                </div>
            <button onclick="closeActionModal()" class="w-full mt-6 py-3 border border-white/10 rounded-xl text-[9px] font-bold text-gray-400 uppercase tracking-widest">Batal</button>
        </div>
    </div>

    <div id="gateModal" class="fixed inset-0 z-[300] hidden flex items-center justify-center p-4">
        <div class="absolute inset-0 bg-black/90 backdrop-blur-md" onclick="closeCoachGate()"></div>
        <div class="relative bg-brand-surface p-8 rounded-3xl border border-brand-gold/30 shadow-[0_0_50px_rgba(215,182,125,0.15)] w-full max-w-xs z-10 text-center modal-enter">
            <i data-lucide="lock" class="w-10 h-10 text-brand-gold mx-auto mb-4"></i>
            <h2 class="text-lg font-black uppercase text-white tracking-widest mb-1">Coach Area</h2>
            <p class="text-[9px] font-bold text-gray-500 uppercase tracking-widest mb-6">Masukkan PIN Otorisasi</p>
            <input type="password" id="coach-pin" maxlength="4" placeholder="••••" class="w-full text-center text-3xl font-black tracking-[0.5em] bg-black border border-white/10 text-brand-gold rounded-xl py-3 outline-none focus:border-brand-gold focus:shadow-[0_0_15px_rgba(215,182,125,0.3)] mb-4 transition-all">
            <button onclick="verifyPin()" class="w-full py-3 bg-brand-gold text-black font-black uppercase text-[10px] tracking-widest rounded-xl hover:bg-white transition-colors">Akses Live Tracker</button>
        </div>
    </div>

    <div id="playerModal" class="fixed inset-0 z-[150] hidden flex items-center justify-center p-4">
        <div class="absolute inset-0 bg-brand-dark/95 backdrop-blur-xl" onclick="closeModal()"></div>
        <div id="modalContent" class="w-full max-w-sm glass-panel border border-white/10 rounded-[2.5rem] overflow-hidden relative z-10 modal-enter shadow-2xl"></div>
    </div>
    <div id="fullProfilePage" class="fixed inset-0 z-[200] hidden bg-brand-dark h-[100dvh] w-full overflow-y-auto overscroll-contain transition-transform duration-500 translate-x-full"></div>

    <nav class="fixed bottom-0 w-full z-[110] bg-white/95 dark:bg-brand-surface/95 backdrop-blur-2xl border-t border-gray-200 dark:border-white/5 pb-safe transition-colors" id="bottom-nav">
        <div class="flex justify-around items-center h-16 max-w-md mx-auto px-2">
            <a href="/" class="flex flex-col items-center justify-center w-full h-full text-gray-400 hover:text-brand-gold transition-colors"><i data-lucide="layout-dashboard" class="w-5 h-5 mb-1"></i><span class="text-[9px] font-bold uppercase tracking-wider">Operator</span></a>
            <a href="/tsl/" class="flex flex-col items-center justify-center w-full h-full text-gray-400 hover:text-green-500 transition-colors"><i data-lucide="trophy" class="w-5 h-5 mb-1"></i><span class="text-[9px] font-bold uppercase tracking-wider">TSL Liga</span></a>
            <button class="flex flex-col items-center justify-center w-full h-full text-brand-neon transition-colors relative"><div class="absolute -top-1 w-8 h-1 bg-brand-neon rounded-b-full"></div><i data-lucide="shield" class="w-5 h-5 mb-1"></i><span class="text-[9px] font-bold uppercase tracking-wider">MNA FC</span></button>
        </div>
    </nav>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbyjnfuOzPD5wu124WU_h86p8TjdNt7ll9iHgmd2w6mOnaHbMQs-ee6ShoVw3U5F_CZdcg/exec'; 
        let rawData = { mnafc: { pemain: [], statistik: {} }, futsal: { pemain: [], statistik: {} }, galeri: [] };
        let activeSport = 'mnafc'; 
        let activePos = 'ALL';

        // --- SISTEM LOGIN PELATIH (COACH GATE) ---
        const SECRET_PIN = '2026';

        function openCoachGate() {
            document.getElementById('gateModal').classList.remove('hidden');
            document.getElementById('coach-pin').value = '';
            document.getElementById('coach-pin').focus();
        }
        function closeCoachGate() { document.getElementById('gateModal').classList.add('hidden'); }

        function verifyPin() {
            const input = document.getElementById('coach-pin');
            if (input.value === SECRET_PIN) {
                closeCoachGate();
                openMatchTracker();
            } else {
                input.classList.add('shake', 'border-red-500', 'text-red-500');
                setTimeout(() => input.classList.remove('shake', 'border-red-500', 'text-red-500'), 500);
            }
        }

        // --- SISTEM LIVE MATCH TRACKER (FASE 3) ---
        let matchState = { time: 0, timerId: null, isRunning: false, home: 0, away: 0, events: [] };
        let trackerLineup = {}; // Kloning dari lineupData saat masuk
        let currentActionType = '';

        function openMatchTracker() {
            if (Object.keys(lineupData).length === 0) {
                alert("Harap buat Lineup di tab 'Lineup' terlebih dahulu sebelum masuk ke Match Tracker.");
                return;
            }

            // Kloning formasi aktif untuk dipakai di tracker
            trackerLineup = JSON.parse(JSON.stringify(lineupData));

            document.getElementById('view-squad').classList.add('hidden');
            document.getElementById('view-lineup').classList.add('hidden');
            document.getElementById('view-gallery').classList.add('hidden');
            document.getElementById('sport-dashboard-container').classList.add('hidden');
            document.getElementById('main-nav-tabs').classList.add('hidden'); // Sembunyikan tab biasa
            document.getElementById('btn-lock').classList.add('hidden'); 
            document.getElementById('bottom-nav').classList.add('translate-y-full'); // Turunkan nav bawah agar layar penuh
            
            document.getElementById('view-match-tracker').classList.remove('hidden');
            
            renderTrackerPitch();
            updateScoreBoard();
        }

        function closeMatchTracker() {
            if(matchState.events.length > 0 && !confirm("Pertandingan sedang berjalan. Yakin ingin keluar? Data akan hilang.")) return;
            
            document.getElementById('view-match-tracker').classList.add('hidden');
            document.getElementById('main-nav-tabs').classList.remove('hidden');
            document.getElementById('btn-lock').classList.remove('hidden');
            document.getElementById('sport-dashboard-container').classList.remove('hidden');
            document.getElementById('bottom-nav').classList.remove('translate-y-full');
            switchMode('squad'); 
        }

        // Timer Logic
        function toggleTimer() {
            const statusEl = document.getElementById('timer-status');
            if (matchState.isRunning) {
                clearInterval(matchState.timerId);
                matchState.isRunning = false;
                statusEl.innerText = "Paused";
                statusEl.className = "text-[8px] font-black text-gray-400 bg-white/10 px-3 py-1 rounded-full uppercase tracking-widest cursor-pointer mt-1 inline-block";
            } else {
                matchState.isRunning = true;
                statusEl.innerHTML = '<span class="w-1.5 h-1.5 bg-red-500 rounded-full animate-pulse inline-block mr-1"></span>LIVE';
                statusEl.className = "text-[8px] font-black text-white bg-red-500/20 border border-red-500/50 px-3 py-1 rounded-full uppercase tracking-widest cursor-pointer mt-1 inline-block";
                matchState.timerId = setInterval(() => {
                    matchState.time++;
                    const m = String(Math.floor(matchState.time / 60)).padStart(2, '0');
                    const s = String(matchState.time % 60).padStart(2, '0');
                    document.getElementById('match-timer').innerText = `${m}:${s}`;
                }, 1000);
            }
        }

        function getMatchMinute() {
            return Math.floor(matchState.time / 60) + "'";
        }

        function updateScoreBoard() {
            document.getElementById('score-home').innerText = matchState.home;
            document.getElementById('score-away').innerText = matchState.away;
        }

        function renderTrackerPitch() {
            const container = document.getElementById('tracker-slots-container');
            const pitch = document.getElementById('tracker-pitch');
            pitch.className = `pitch-container ${activeSport === 'futsal' ? 'pitch-futsal' : 'pitch-football'}`;
            
            const slotsDef = FORMATIONS[activeSport][currentFormationKey];
            container.innerHTML = Object.keys(trackerLineup).map(idx => {
                const s = slotsDef[idx];
                const p = trackerLineup[idx];
                return `
                <div class="tracker-slot" style="bottom:${s.b}; left:${s.l}; background-image:url('${val(p.link_foto)}')">
                    <span class="tracker-slot-label">${val(p.nama).split(' ')[0]}</span>
                </div>`;
            }).join('');
        }

        // --- FASE 4: ACTION ENGINE ---
        function triggerAction(type) {
            currentActionType = type;
            const titleEl = document.getElementById('action-title');
            
            if(type === 'goal_away') {
                logEvent('red', 'Kebobolan', 'Gol oleh Tim Lawan', 'shield-alert');
                matchState.away++; updateScoreBoard(); return;
            }
            
            // Siapkan Modal Pemilihan Pemain
            const listEl = document.getElementById('action-player-list');
            listEl.innerHTML = '';

            let titleTxt = '';
            let color = '';

            if(type === 'goal_home') { titleTxt = 'Siapa Pencetak Gol?'; color = 'text-green-400'; }
            else if(type === 'assist') { titleTxt = 'Siapa Pemberi Assist?'; color = 'text-brand-neon'; }
            else if(type === 'yellow') { titleTxt = 'Kartu Kuning Untuk?'; color = 'text-yellow-400'; }
            else if(type === 'red') { titleTxt = 'Kartu Merah Untuk?'; color = 'text-red-500'; }
            else if(type === 'pen_won') { titleTxt = 'Siapa Mendapat Penalti?'; color = 'text-green-400'; }
            else if(type === 'pen_miss') { titleTxt = 'Siapa Gagal Penalti?'; color = 'text-red-400'; }
            else if(type === 'sub') { titleTxt = 'Pilih Pemain KELUAR'; color = 'text-brand-gold'; }

            titleEl.className = `text-sm font-black uppercase tracking-widest mb-4 text-center ${color}`;
            titleEl.innerText = titleTxt;

            // Render pemain yang sedang aktif di lapangan
            Object.keys(trackerLineup).forEach(idx => {
                const p = trackerLineup[idx];
                listEl.innerHTML += `
                <div onclick="executeAction('${idx}')" class="flex flex-col items-center gap-1 cursor-pointer hover:scale-110 transition-transform">
                    <div class="w-12 h-12 rounded-full border-2 border-white/10 bg-white/5 overflow-hidden"><img src="${val(p.link_foto)}" class="w-full h-full object-cover"></div>
                    <p class="text-[8px] font-black text-white uppercase text-center leading-tight line-clamp-1">${val(p.nama).split(' ')[0]}</p>
                </div>`;
            });

            document.getElementById('actionModal').classList.remove('hidden');
        }

        function executeAction(slotIdx) {
            const p = trackerLineup[slotIdx];
            closeActionModal();

            if (currentActionType === 'goal_home') {
                logEvent('green', 'Gol', p.nama, 'goal');
                matchState.home++; updateScoreBoard();
            } else if (currentActionType === 'assist') {
                logEvent('blue', 'Assist', p.nama, 'footprints');
            } else if (currentActionType === 'yellow') {
                logEvent('yellow', 'Kartu Kuning', p.nama, 'alert-circle');
            } else if (currentActionType === 'red') {
                logEvent('red', 'Kartu Merah', p.nama, 'alert-triangle');
            } else if (currentActionType === 'pen_won') {
                logEvent('green', 'Penalti Didapat', `Oleh: ${p.nama}`, 'target');
            } else if (currentActionType === 'pen_miss') {
                logEvent('red', 'Penalti Gagal', p.nama, 'x-circle');
            } else if (currentActionType === 'sub') {
                alert(`Substitusi untuk ${p.nama} akan dikembangkan di update berikutnya.`);
                // Logika sub-in dari bursa pemain akan ditambahkan nanti.
            }
        }

        function logEvent(colorScheme, title, desc, iconName) {
            const minute = getMatchMinute();
            
            // Konversi warna CSS
            let bgStr = ''; let textStr = ''; let iconCol = '';
            if(colorScheme === 'green') { bgStr = 'bg-green-500/10 border-green-500/30'; textStr = 'text-green-400'; iconCol = 'text-green-500'; }
            else if(colorScheme === 'red') { bgStr = 'bg-red-500/10 border-red-500/30'; textStr = 'text-red-400'; iconCol = 'text-red-500'; }
            else if(colorScheme === 'yellow') { bgStr = 'bg-yellow-500/10 border-yellow-500/30'; textStr = 'text-yellow-400'; iconCol = 'text-yellow-500'; }
            else if(colorScheme === 'blue') { bgStr = 'bg-brand-neon/10 border-brand-neon/30'; textStr = 'text-brand-neon'; iconCol = 'text-brand-neon'; }

            // Simpan ke state data
            matchState.events.push({ time: minute, type: title, detail: desc });

            // Render ke UI
            const logEl = document.getElementById('event-log');
            if(matchState.events.length === 1) logEl.innerHTML = ''; // Hapus teks kosong
            
            const itemHTML = `
            <div class="flex items-center gap-3 p-3 rounded-xl border ${bgStr} mb-2 animate-fade-in">
                <div class="w-8 h-8 rounded-lg bg-black/50 flex items-center justify-center border border-white/5"><i data-lucide="${iconName}" class="w-4 h-4 ${iconCol}"></i></div>
                <div class="flex-1">
                    <div class="flex justify-between items-end">
                        <h4 class="text-[10px] font-black uppercase tracking-widest ${textStr}">${title}</h4>
                        <span class="text-[8px] font-bold text-gray-500 bg-white/5 px-2 py-0.5 rounded">${minute}</span>
                    </div>
                    <p class="text-[9px] text-white uppercase mt-0.5">${desc}</p>
                </div>
            </div>`;
            
            logEl.insertAdjacentHTML('afterbegin', itemHTML); // Muncul paling atas
            lucide.createIcons();
        }

        function closeActionModal() { document.getElementById('actionModal').classList.add('hidden'); }

        function endMatch() {
            if(!confirm("Anda yakin ingin mengakhiri dan menyimpan pertandingan ini?")) return;
            alert("Sistem Backend Penyimpanan (doPost) akan disambungkan di Fase berikutnya. Data sementara: " + JSON.stringify(matchState));
            // Disini fungsi fetch API POST akan dibuat
        }

        // ==========================================
        // SISA KODE STABIL SEBELUMNYA (FORMASI, DATA, DLL)
        // ==========================================
        
        const FORMATIONS = {
            mnafc: {
                '4-3-3': [{ b: '8%', l: '50%', role: 'GK' }, { b: '22%', l: '35%', role: 'CB' }, { b: '22%', l: '65%', role: 'CB' }, { b: '26%', l: '15%', role: 'LB' }, { b: '26%', l: '85%', role: 'RB' }, { b: '45%', l: '50%', role: 'CDM' }, { b: '55%', l: '30%', role: 'CM' }, { b: '55%', l: '70%', role: 'CM' }, { b: '82%', l: '50%', role: 'ST' }, { b: '78%', l: '18%', role: 'LW' }, { b: '78%', l: '82%', role: 'RW' }],
                '4-4-2': [{ b: '8%', l: '50%', role: 'GK' }, { b: '22%', l: '35%', role: 'CB' }, { b: '22%', l: '65%', role: 'CB' }, { b: '26%', l: '15%', role: 'LB' }, { b: '26%', l: '85%', role: 'RB' }, { b: '48%', l: '35%', role: 'CM' }, { b: '48%', l: '65%', role: 'CM' }, { b: '55%', l: '15%', role: 'LM' }, { b: '55%', l: '85%', role: 'RM' }, { b: '80%', l: '40%', role: 'CF' }, { b: '80%', l: '60%', role: 'CF' }],
                '3-5-2': [{ b: '8%', l: '50%', role: 'GK' }, { b: '20%', l: '30%', role: 'CB' }, { b: '20%', l: '50%', role: 'CB' }, { b: '20%', l: '70%', role: 'CB' }, { b: '40%', l: '35%', role: 'CM' }, { b: '40%', l: '65%', role: 'CM' }, { b: '55%', l: '15%', role: 'LWB' }, { b: '55%', l: '85%', role: 'RWB' }, { b: '55%', l: '50%', role: 'CAM' }, { b: '80%', l: '40%', role: 'ST' }, { b: '80%', l: '60%', role: 'ST' }]
            },
            futsal: {
                '1-2-1 (Diamond)': [{ b: '8%', l: '50%', role: 'GK' }, { b: '30%', l: '50%', role: 'ANC' }, { b: '55%', l: '20%', role: 'FLK' }, { b: '55%', l: '80%', role: 'FLK' }, { b: '80%', l: '50%', role: 'PVT' }],
                '2-2 (Square)': [{ b: '8%', l: '50%', role: 'GK' }, { b: '35%', l: '30%', role: 'DEF' }, { b: '35%', l: '70%', role: 'DEF' }, { b: '70%', l: '30%', role: 'ATT' }, { b: '70%', l: '70%', role: 'ATT' }],
                '3-1 (Pyramid)': [{ b: '8%', l: '50%', role: 'GK' }, { b: '35%', l: '20%', role: 'FLK' }, { b: '25%', l: '50%', role: 'ANC' }, { b: '35%', l: '80%', role: 'FLK' }, { b: '75%', l: '50%', role: 'PVT' }]
            }
        };

        let currentFormationKey = '';
        let activeLineupSlot = null;
        let lineupData = {}; 

        const val = (d, f = "-") => (d === "" || d === null || d === undefined) ? f : d;

        function parseIndoDate(dateStr) {
            if (!dateStr || dateStr === '-') return null;
            let cleanStr = String(dateStr).trim().split(' ')[0].split('T')[0];
            const parts = cleanStr.split(/[\/\-]/);
            if (parts.length === 3) {
                let p1 = parseInt(parts[0], 10); let p2 = parseInt(parts[1], 10); let p3 = parseInt(parts[2], 10);
                if (p1 > 1000) { return new Date(p1, p2 - 1, p3); } 
                else { let day = p1; let month = p2 - 1; let year = p3; if (month > 11) { day = p2; month = p1 - 1; } if (year < 100) { year += (year > 50 ? 1900 : 2000); } return new Date(year, month, day); }
            }
            const attempt = new Date(dateStr); return isNaN(attempt) ? null : attempt;
        }

        function processPlayerData(players) {
            if(!players) return [];
            return players.map(p => {
                const birthDate = parseIndoDate(p.tanggal_lahir);
                p.tanggal_lahir_format = '-'; p.umur_detail = '-'; p.kategori_auto = '-';
                if (birthDate) {
                    p.tanggal_lahir_format = `${String(birthDate.getDate()).padStart(2, '0')}/${String(birthDate.getMonth() + 1).padStart(2, '0')}/${String(birthDate.getFullYear()).slice(-2)}`;
                    const today = new Date(); let years = today.getFullYear() - birthDate.getFullYear(); let months = today.getMonth() - birthDate.getMonth(); let days = today.getDate() - birthDate.getDate();
                    if (days < 0) { months--; const lm = new Date(today.getFullYear(), today.getMonth(), 0); days += lm.getDate(); }
                    if (months < 0) { years--; months += 12; }
                    p.umur_detail = `${years}th ${months}bln`;
                    p.kategori_auto = years < 16 ? 'U-15' : (years <= 17 ? 'U-17' : 'SENIOR');
                }
                return p;
            });
        }

        async function init() {
            lucide.createIcons();
            const cache = localStorage.getItem('mnafc_multisport_cache');
            if (cache) { 
                rawData = JSON.parse(cache); 
                if(rawData.mnafc && rawData.mnafc.pemain) rawData.mnafc.pemain = processPlayerData(rawData.mnafc.pemain);
                if(rawData.futsal && rawData.futsal.pemain) rawData.futsal.pemain = processPlayerData(rawData.futsal.pemain);
                updateUI(); if(rawData.galeri) renderGallery(rawData.galeri); initLineupBuilder();
            }
            try {
                const res = await fetch(`${API_URL}?t=${Date.now()}`);
                const data = await res.json();
                if(data.mnafc && data.mnafc.pemain) data.mnafc.pemain = processPlayerData(data.mnafc.pemain);
                if(data.futsal && data.futsal.pemain) data.futsal.pemain = processPlayerData(data.futsal.pemain);
                rawData = data;
                localStorage.setItem('mnafc_multisport_cache', JSON.stringify(data));
                updateUI(); if(rawData.galeri) renderGallery(rawData.galeri); initLineupBuilder();
            } catch (e) { console.error(e); }
        }

        function switchSport(sport) {
            activeSport = sport; activePos = 'ALL'; 
            document.getElementById('btn-fc').className = sport === 'mnafc' ? "flex-1 py-3 rounded-xl text-[10px] font-black uppercase tracking-widest flex items-center justify-center gap-2 transition-all bg-brand-blue text-white shadow-lg" : "flex-1 py-3 rounded-xl text-[10px] font-bold uppercase tracking-widest flex items-center justify-center gap-2 transition-all text-gray-500 hover:text-white";
            document.getElementById('btn-futsal').className = sport === 'futsal' ? "flex-1 py-3 rounded-xl text-[10px] font-black uppercase tracking-widest flex items-center justify-center gap-2 transition-all bg-brand-blue text-white shadow-lg" : "flex-1 py-3 rounded-xl text-[10px] font-bold uppercase tracking-widest flex items-center justify-center gap-2 transition-all text-gray-500 hover:text-white";
            document.getElementById('brand-name').innerText = sport === 'mnafc' ? 'MNA FC' : 'MNA FUTSAL';
            document.getElementById('filter-football').className = sport === 'mnafc' ? "flex gap-2 overflow-x-auto hide-scroll" : "hidden";
            document.getElementById('filter-futsal').className = sport === 'futsal' ? "flex gap-2 overflow-x-auto hide-scroll" : "hidden";
            document.querySelectorAll('.pos-btn-fc, .pos-btn-fs').forEach(b => b.className = b.className.replace('bg-brand-blue text-white font-black', 'bg-white/5 text-gray-500 font-bold border-white/10').replace('border-brand-blue', 'border-white/10'));
            const activeBtn = sport === 'mnafc' ? document.querySelector('.pos-btn-fc') : document.querySelector('.pos-btn-fs');
            if(activeBtn) activeBtn.className = activeBtn.className.replace('bg-white/5 text-gray-500 font-bold border-white/10', 'bg-brand-blue text-white font-black border-brand-blue');
            updateUI(); initLineupBuilder(); 
        }

        function switchMode(mode) {
            const isSquad = mode === 'squad'; const isLineup = mode === 'lineup'; const isGallery = mode === 'gallery';
            document.getElementById('view-match-tracker').classList.add('hidden'); // Selalu sembunyikan tracker jika klik tab atas
            document.getElementById('view-squad').classList.toggle('hidden', !isSquad);
            document.getElementById('view-lineup').classList.toggle('hidden', !isLineup);
            document.getElementById('view-gallery').classList.toggle('hidden', !isGallery);
            document.getElementById('sport-dashboard-container').classList.toggle('hidden', isGallery); 
            
            const activeClass = "px-3 py-1.5 text-[9px] font-black uppercase tracking-widest rounded-lg transition-all bg-brand-blue text-white shadow-lg";
            const inactiveClass = "px-3 py-1.5 text-[9px] font-bold uppercase tracking-widest rounded-lg transition-all text-gray-500 hover:text-white";
            document.getElementById('tab-squad').className = isSquad ? activeClass : inactiveClass;
            document.getElementById('tab-lineup').className = isLineup ? activeClass : inactiveClass;
            document.getElementById('tab-gallery').className = isGallery ? activeClass : inactiveClass;
        }

        function updateUI() {
            if(!rawData[activeSport]) return;
            const data = rawData[activeSport];
            renderStats(data.statistik);
            runFilter();
        }

        function renderStats(s) {
            const m = parseInt(val(s.menang, 0)), s_ = parseInt(val(s.seri, 0)), k = parseInt(val(s.kalah, 0));
            document.getElementById('win-rate').innerText = (m+s_+k > 0 ? Math.round((m/(m+s_+k))*100) : 0) + '%';
            document.getElementById('match-record').innerText = `${m}-${s_}-${k}`;
            const diff = parseInt(val(s.gol_masuk, 0)) - parseInt(val(s.gol_kemasukan, 0));
            document.getElementById('goal-diff').innerText = (diff >= 0 ? '+' : '') + diff;
        }

        function getCoords(pos) {
            const p = val(pos).toUpperCase().trim();
            const colors = { F: {bg: 'rgba(239,68,68,0.4)', m: '#ef4444'}, M: {bg: 'rgba(34,197,94,0.4)', m: '#22c55e'}, D: {bg: 'rgba(59,130,246,0.4)', m: '#3b82f6'}, G: {bg: 'rgba(234,179,8,0.4)', m: '#eab308'}};
            const positions = {
                'GK': { b: '8%', l: '50%', w: '40%', h: '15%', c: colors.G }, 'CB': { b: '22%', l: '50%', w: '45%', h: '18%', c: colors.D }, 'LB': { b: '26%', l: '15%', w: '30%', h: '35%', c: colors.D }, 'RB': { b: '26%', l: '85%', w: '30%', h: '35%', c: colors.D }, 'LWB': { b: '35%', l: '15%', w: '30%', h: '30%', c: colors.D }, 'RWB': { b: '35%', l: '85%', w: '30%', h: '30%', c: colors.D }, 'CDM': { b: '42%', l: '50%', w: '45%', h: '18%', c: colors.M }, 'CM': { b: '52%', l: '50%', w: '45%', h: '18%', c: colors.M }, 'LM': { b: '55%', l: '15%', w: '30%', h: '30%', c: colors.M }, 'RM': { b: '55%', l: '85%', w: '30%', h: '30%', c: colors.M }, 'CAM': { b: '65%', l: '50%', w: '45%', h: '15%', c: colors.M }, 'LW': { b: '78%', l: '18%', w: '30%', h: '25%', c: colors.F }, 'RW': { b: '78%', l: '82%', w: '30%', h: '25%', c: colors.F }, 'LWG': { b: '78%', l: '18%', w: '30%', h: '25%', c: colors.F }, 'RWG': { b: '78%', l: '82%', w: '30%', h: '25%', c: colors.F }, 'CF': { b: '78%', l: '50%', w: '40%', h: '15%', c: colors.F }, 'ST': { b: '88%', l: '50%', w: '40%', h: '15%', c: colors.F },
                'ANC': { b: '25%', l: '50%', w: '50%', h: '20%', c: colors.D }, 'FLK-L': { b: '50%', l: '15%', w: '25%', h: '40%', c: colors.M }, 'FLK-R': { b: '50%', l: '85%', w: '25%', h: '40%', c: colors.M }, 'FLK': { b: '50%', l: '50%', w: '70%', h: '30%', c: colors.M }, 'PVT': { b: '80%', l: '50%', w: '50%', h: '20%', c: colors.F }
            };
            const parts = p.split('/').map(x => x.trim()); let results = [];
            parts.forEach(part => { if (positions[part]) results.push({...positions[part], label: part}); });
            if (results.length === 0) results.push({ b: '50%', l: '50%', w: '40%', h: '20%', c: {bg: 'rgba(156,163,175,0.4)', m: '#9ca3af'}, label: p });
            return results;
        }

        function runFilter() {
            const query = document.getElementById('playerSearch').value.toLowerCase();
            if(!rawData[activeSport] || !rawData[activeSport].pemain) return;
            const list = rawData[activeSport].pemain;
            const filtered = list.filter(p => {
                const searchTxt = (val(p.nama) + val(p.sekolah) + val(p.posisi)).toLowerCase().includes(query);
                const pos = val(p.posisi).toUpperCase();
                let cat = 'LAIN';
                if (activeSport === 'mnafc') {
                    if (['GK'].includes(pos)) cat = 'GK'; else if (['CB','LB','RB','LWB','RWB'].some(x => pos.includes(x))) cat = 'DEF'; else if (['CM','CDM','CAM','LM','RM'].some(x => pos.includes(x))) cat = 'MID'; else if (['ST','CF','LW','RW','RWG','LWG','SS'].some(x => pos.includes(x))) cat = 'FWD';
                } else {
                    if (['GK'].includes(pos)) cat = 'GK'; else if (pos.includes('ANC')) cat = 'ANC'; else if (['FLK', 'FLK-L', 'FLK-R'].some(x => pos.includes(x))) cat = 'FLK'; else if (pos.includes('PVT')) cat = 'PVT';
                }
                return searchTxt && (activePos === 'ALL' || cat === activePos);
            });
            renderPlayers(filtered);
        }

        function setPosFilter(pos, btn, targetSport) {
            activePos = pos;
            const btnClass = targetSport === 'mnafc' ? '.pos-btn-fc' : '.pos-btn-fs';
            document.querySelectorAll(btnClass).forEach(b => { b.className = b.className.replace('bg-brand-blue text-white font-black border-brand-blue', 'bg-white/5 text-gray-500 font-bold border-white/10'); });
            btn.className = btn.className.replace('bg-white/5 text-gray-500 font-bold border-white/10', 'bg-brand-blue text-white font-black border-brand-blue');
            runFilter();
        }

        function renderPlayers(list) {
            const grid = document.getElementById('playerGrid');
            grid.innerHTML = list.map((p, i) => `
                <div onclick="showPreview(${rawData[activeSport].pemain.indexOf(p)})" class="player-card glass-panel rounded-2xl p-4 flex items-center gap-4 relative overflow-hidden cursor-pointer stagger-item" style="animation-delay: ${i*0.05}s">
                    <div class="absolute -right-2 -bottom-6 text-8xl font-black italic text-white/5 pointer-events-none">${val(p.nomor, '0')}</div>
                    <div class="w-16 h-16 rounded-xl overflow-hidden bg-white/10 shrink-0 border border-white/10 z-10"><img src="${val(p.link_foto)}" class="w-full h-full object-cover"></div>
                    <div class="flex-1 min-w-0 z-10">
                        <div class="flex justify-between items-start mb-1">
                            <h4 class="text-sm font-black uppercase text-white truncate w-32">${val(p.nama)}</h4>
                            <span class="text-[9px] font-black bg-brand-neon/20 text-brand-neon px-2 py-0.5 rounded border border-brand-neon/20 flex-shrink-0">${val(p.posisi)}</span>
                        </div>
                        <p class="text-[8px] font-bold text-gray-500 uppercase tracking-widest mt-1 truncate">${val(p.sekolah)}</p>
                        <div class="grid grid-cols-4 gap-1 mt-3 pt-3 border-t border-white/5 text-center">
                            <div><p class="text-[6px] text-gray-500 uppercase tracking-wider mb-0.5">Usia</p><p class="text-[9px] font-bold text-white uppercase">${val(p.umur_detail, '-')}</p></div>
                            <div class="border-l border-white/5"><p class="text-[6px] text-gray-500 uppercase tracking-wider mb-0.5">Kat</p><p class="text-[9px] font-bold text-white uppercase">${val(p.kategori_auto, '-')}</p></div>
                            <div class="border-l border-white/5"><p class="text-[6px] text-gray-500 uppercase tracking-wider mb-0.5">Kaki</p><p class="text-[9px] font-bold text-white uppercase">${val(p.kaki)}</p></div>
                            <div class="border-l border-white/5"><p class="text-[6px] text-gray-500 uppercase tracking-wider mb-0.5">Gol</p><p class="text-[9px] font-black text-brand-gold">${val(p.gol, 0)}</p></div>
                        </div>
                    </div>
                </div>`).join('');
            lucide.createIcons();
        }

        function showPreview(idx) {
            const p = rawData[activeSport].pemain[idx];
            document.getElementById('modalContent').innerHTML = `
                <div class="relative bg-brand-surface p-6">
                    <button onclick="closeModal()" class="absolute top-5 right-5 text-white/50"><i data-lucide="x" class="w-5 h-5"></i></button>
                    <div class="flex gap-5 items-center mb-6">
                        <div class="w-24 h-24 rounded-2xl overflow-hidden border-2 border-brand-neon shadow-2xl shadow-brand-neon/20"><img src="${val(p.link_foto)}" class="w-full h-full object-cover"></div>
                        <div>
                            <h2 class="text-xl font-black uppercase text-white leading-none">${val(p.nama)}</h2>
                            <p class="text-[10px] font-bold text-brand-neon mt-2 uppercase tracking-widest">#${val(p.nomor)} • ${val(p.posisi)}</p>
                        </div>
                    </div>
                    <div class="grid grid-cols-3 gap-2 mt-6">
                        <div class="bg-white/5 p-3 rounded-xl text-center flex flex-col justify-center">
                            <p class="text-[7px] text-gray-500 uppercase">Kategori / Umur</p>
                            <p class="text-[10px] font-bold text-white uppercase mt-0.5">${val(p.kategori_auto, '-')}</p>
                            <p class="text-[7px] font-bold text-brand-neon mt-0.5">${val(p.umur_detail, '-')}</p>
                        </div>
                        <div class="bg-white/5 p-3 rounded-xl text-center flex flex-col justify-center"><p class="text-[7px] text-gray-500 uppercase">Gol</p><p class="text-[10px] font-black text-brand-gold mt-1">${val(p.gol, 0)}</p></div>
                        <div class="bg-white/5 p-3 rounded-xl text-center flex flex-col justify-center"><p class="text-[7px] text-gray-500 uppercase">Kaki</p><p class="text-[10px] font-bold text-white uppercase mt-1">${val(p.kaki)}</p></div>
                    </div>
                    <button onclick="bukaDossier(${idx})" class="w-full bg-brand-neon text-white py-4 rounded-2xl font-black uppercase text-[10px] tracking-widest shadow-lg shadow-brand-neon/30 mt-6">Buka Dossier Pemain</button>
                </div>`;
            document.getElementById('playerModal').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
            lucide.createIcons();
        }

        function bukaDossier(idx) {
            closeModal();
            const p = rawData[activeSport].pemain[idx];
            const coords = getCoords(p.posisi);
            const altCoords = getCoords(val(p.posisi_alt, ''));
            const isFutsal = activeSport === 'futsal';
            
            let markers = coords.map(c => `<div class="position-zone" style="bottom:${c.b}; left:${c.l}; width:${c.w}; height:${c.h}; background:${c.c.bg};"></div><div class="player-marker" style="bottom:${c.b}; left:${c.l}; background:${c.c.m}; box-shadow:0 0 15px ${c.c.m};">${c.label}</div>`).join('');
            markers += altCoords.map(c => `<div class="player-marker-alt" style="bottom:${c.b}; left:${c.l}; background:${c.c.m};">${c.label}</div>`).join('');
            const altBadgeHTML = (val(p.posisi_alt, '') && val(p.posisi_alt, '') !== '-') ? `<span class="text-xs font-black bg-white/5 text-gray-300 border border-white/10 px-4 py-1.5 rounded-lg uppercase shadow-sm">ALT: ${val(p.posisi_alt)}</span>` : '';

            const page = document.getElementById('fullProfilePage');
            page.innerHTML = `
                <div class="sticky top-0 z-50 glass-panel border-b border-white/10 px-5 py-4 flex items-center justify-between">
                    <button onclick="tutupDossier()" class="text-gray-400 text-[10px] font-black uppercase tracking-widest flex items-center gap-1"><i data-lucide="chevron-left" class="w-4 h-4"></i> Kembali</button>
                    <span class="text-[9px] font-black text-brand-neon uppercase tracking-widest">${activeSport === 'mnafc' ? 'Football' : 'Futsal'} Dossier</span>
                </div>
                <div class="p-6 space-y-8">
                    <div class="text-center">
                        <div class="w-32 h-32 mx-auto rounded-[2.5rem] overflow-hidden border-2 border-brand-neon shadow-2xl mb-4"><img src="${val(p.link_foto)}" class="w-full h-full object-cover"></div>
                        <h2 class="text-3xl font-black uppercase text-white tracking-tighter">${val(p.nama)}</h2>
                        <div class="flex flex-wrap justify-center items-center gap-2 mt-3">
                            <span class="text-xs font-black text-brand-neon bg-brand-neon/10 px-3 py-1 rounded-lg uppercase border border-brand-neon/20">POS: ${val(p.posisi)}</span>
                            ${altBadgeHTML}
                            <span class="text-xs font-black bg-white/10 text-white border border-white/10 px-4 py-1.5 rounded-lg uppercase shadow-sm">#${val(p.nomor, '0')}</span>
                        </div>
                    </div>
                    
                    <div class="glass-panel p-6 rounded-[2rem] border border-white/5">
                        <h3 class="text-[10px] font-black text-gray-400 uppercase tracking-widest mb-6 flex items-center gap-2"><i data-lucide="crosshair" class="w-4 h-4 text-brand-neon"></i> Tactical View</h3>
                        <div class="pitch-wrapper">
                            <div class="pitch-container ${isFutsal ? 'pitch-futsal' : 'pitch-football'}">
                                <div class="pitch-half pitch-line"></div><div class="pitch-circle pitch-line"></div>
                                <div class="pitch-line" style="top:0; left:20%; width:60%; height:18%; border-top:0;"></div>
                                <div class="pitch-line" style="bottom:0; left:20%; width:60%; height:18%; border-bottom:0;"></div>
                                ${markers}
                            </div>
                        </div>
                    </div>

                    <div class="glass-panel p-6 rounded-[2rem] border border-white/5">
                        <h3 class="text-[10px] font-black text-gray-400 uppercase tracking-widest mb-6 flex items-center gap-2"><i data-lucide="activity" class="w-4 h-4 text-brand-neon"></i> Biometrik & Fisik</h3>
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                            <div class="bg-white/5 p-4 rounded-2xl border border-white/5"><p class="text-[8px] text-gray-500 uppercase font-black mb-1">Tgl Lahir / Usia</p><p class="text-sm font-black text-white">${val(p.tanggal_lahir_format, '-')}</p><p class="text-[9px] font-bold text-brand-neon mt-1">${val(p.umur_detail, '-')}</p></div>
                            <div class="bg-white/5 p-4 rounded-2xl border border-white/5"><p class="text-[8px] text-gray-500 uppercase font-black mb-1">Kategori Tim</p><p class="text-sm font-black text-white uppercase">${val(p.kategori_auto, '-')}</p></div>
                            <div class="bg-white/5 p-4 rounded-2xl border border-white/5"><p class="text-[8px] text-gray-500 uppercase font-bold mb-1">Tinggi / Berat</p><p class="text-sm font-black text-white">${val(p.tinggi, '-')} cm / ${val(p.berat, '-')} kg</p></div>
                            <div class="bg-white/5 p-4 rounded-2xl border border-white/5 text-center flex flex-col justify-center"><p class="text-[8px] text-gray-500 uppercase font-bold mb-1">Kaki Dominan</p><p class="text-sm font-black text-white uppercase">${val(p.kaki, '-')}</p></div>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                        <div class="glass-panel p-6 rounded-[2rem] border border-white/5 flex flex-col justify-center">
                            <h3 class="text-[10px] font-black text-gray-400 uppercase tracking-widest mb-6 flex items-center gap-2"><i data-lucide="award" class="w-4 h-4 text-brand-gold"></i> Rekor Performa</h3>
                            <div class="bg-brand-gold/10 border border-brand-gold/20 p-8 rounded-2xl text-center flex-1 flex flex-col justify-center"><p class="text-[10px] text-brand-gold uppercase font-bold tracking-widest mb-2">Total Gol / Poin</p><p class="text-6xl font-black text-brand-gold drop-shadow-[0_0_15px_rgba(215,182,125,0.4)]">${val(p.gol, 0)}</p></div>
                        </div>
                        <div class="glass-panel p-6 rounded-[2rem] border border-white/5 flex flex-col justify-center">
                            <h3 class="text-[10px] font-black text-gray-400 uppercase tracking-widest mb-6 flex items-center gap-2"><i data-lucide="graduation-cap" class="w-4 h-4 text-brand-neon"></i> Afiliasi Akademik</h3>
                            <div class="bg-white/5 p-8 rounded-2xl text-center border border-white/5 flex-1 flex flex-col justify-center"><p class="text-[10px] text-gray-500 uppercase font-bold tracking-widest mb-2">Instansi / Sekolah</p><p class="text-xs font-black text-white uppercase line-clamp-2 mt-1 leading-tight">${val(p.sekolah)}</p></div>
                        </div>
                    </div>
                </div>`;
            page.classList.remove('hidden'); document.body.style.overflow = 'hidden';
            setTimeout(() => page.classList.add('page-slide-in'), 10); lucide.createIcons();
        }

        // --- LINEUP BUILDER LOGIC ---
        function initLineupBuilder() {
            lineupData = {}; activeLineupSlot = null;
            const select = document.getElementById('formation-select'); const forms = FORMATIONS[activeSport];
            select.innerHTML = Object.keys(forms).map(k => `<option value="${k}">${k}</option>`).join('');
            currentFormationKey = Object.keys(forms)[0]; renderLineupPitch(); renderLineupPool();
        }
        function changeFormation(key) { currentFormationKey = key; lineupData = {}; activeLineupSlot = null; renderLineupPitch(); renderLineupPool(); }
        function renderLineupPitch() {
            const container = document.getElementById('lineup-slots-container');
            const pitch = document.getElementById('lineup-pitch');
            pitch.className = `pitch-container ${activeSport === 'futsal' ? 'pitch-futsal' : 'pitch-football'}`;
            const slots = FORMATIONS[activeSport][currentFormationKey];
            container.innerHTML = slots.map((s, i) => {
                const p = lineupData[i];
                if (p) return `<div onclick="selectLineupSlot(${i})" class="lineup-slot filled ${activeLineupSlot === i ? 'active' : ''}" style="bottom:${s.b}; left:${s.l}; background-image:url('${val(p.link_foto)}')"><span class="lineup-slot-label">${val(p.nama).split(' ')[0]}</span></div>`;
                return `<div onclick="selectLineupSlot(${i})" class="lineup-slot ${activeLineupSlot === i ? 'active' : ''}" style="bottom:${s.b}; left:${s.l};"><i data-lucide="plus" class="w-4 h-4 text-white/50"></i><span class="lineup-slot-label bg-brand-blue border-brand-blue text-white">${s.role}</span></div>`;
            }).join('');
            lucide.createIcons();
        }
        function renderLineupPool() {
            const pool = document.getElementById('lineup-pool'); const inst = document.getElementById('lineup-instruction');
            if (activeLineupSlot === null) {
                pool.style.opacity = '0.3'; pool.style.pointerEvents = 'none';
                inst.innerText = '1. Ketuk slot formasi di lapangan'; inst.className = 'text-[9px] font-bold text-gray-500 uppercase tracking-widest mb-3';
            } else {
                pool.style.opacity = '1'; pool.style.pointerEvents = 'auto';
                const role = FORMATIONS[activeSport][currentFormationKey][activeLineupSlot].role;
                inst.innerHTML = `2. Pilih pemain untuk <span class="text-brand-neon">${role}</span>`; inst.className = 'text-[9px] font-black text-white uppercase tracking-widest mb-3';
            }
            const players = rawData[activeSport]?.pemain || []; const assignedIds = Object.values(lineupData).map(p => p.nomor + p.nama);
            pool.innerHTML = players.map((p, i) => {
                const isAssigned = assignedIds.includes(p.nomor + p.nama);
                return `<div onclick="assignPlayerToSlot(${i})" class="pool-card flex flex-col items-center gap-2 cursor-pointer ${isAssigned ? 'disabled' : ''}"><div class="w-12 h-12 rounded-full overflow-hidden border-2 border-white/10 bg-white/5"><img src="${val(p.link_foto)}" class="w-full h-full object-cover"></div><div class="text-center"><p class="text-[8px] font-black text-white uppercase line-clamp-1 w-14 leading-tight">${val(p.nama)}</p><p class="text-[7px] text-brand-neon font-bold mt-0.5">${val(p.posisi)}</p></div></div>`;
            }).join('');
        }
        function selectLineupSlot(idx) { activeLineupSlot = idx; renderLineupPitch(); renderLineupPool(); }
        function assignPlayerToSlot(playerIdx) { if (activeLineupSlot === null) return; const p = rawData[activeSport].pemain[playerIdx]; lineupData[activeLineupSlot] = p; activeLineupSlot = null; renderLineupPitch(); renderLineupPool(); }
        function resetLineup() { lineupData = {}; activeLineupSlot = null; renderLineupPitch(); renderLineupPool(); }

        // --- MEDIA HUB LOGIC ---
        function runMediaFilter() {
            const query = document.getElementById('mediaSearch').value.toLowerCase();
            if(!rawData.galeri) return;
            const filtered = rawData.galeri.filter(item => { return val(item.kegiatan).toLowerCase().includes(query) || val(item.tanggal).toLowerCase().includes(query); });
            renderGallery(filtered);
        }
        function renderGallery(list) {
            const grid = document.getElementById('galleryGrid');
            if (!list || list.length === 0) { grid.innerHTML = `<div class="col-span-full py-16 text-center text-[10px] font-black text-gray-500 uppercase tracking-widest border border-dashed border-white/10 rounded-2xl">Kosong</div>`; return; }
            grid.innerHTML = list.map((item, i) => `
                <a href="${item.link_drive}" target="_blank" class="glass-panel rounded-2xl p-3 flex flex-col gap-3 relative overflow-hidden group stagger-item border border-white/5" style="animation-delay: ${i*0.05}s">
                    <div class="relative w-full aspect-video rounded-xl bg-brand-dark overflow-hidden">${item.preview_image ? `<img src="${item.preview_image}" class="w-full h-full object-cover opacity-80 group-hover:opacity-100 transition-opacity">` : '<div class="absolute inset-0 flex items-center justify-center"><i data-lucide="folder" class="w-10 h-10 text-white/10"></i></div>'}<div class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent"></div><div class="absolute bottom-3 left-3 text-white"><h4 class="text-xs font-black uppercase tracking-tight line-clamp-1">${val(item.kegiatan)}</h4><p class="text-[9px] font-bold text-gray-300 uppercase mt-0.5">${val(item.tanggal)}</p></div></div>
                </a>`).join('');
            lucide.createIcons();
        }

        function tutupDossier() { const p = document.getElementById('fullProfilePage'); p.classList.remove('page-slide-in'); setTimeout(() => { p.classList.add('hidden'); document.body.style.overflow = ''; }, 500); }
        function closeModal() { document.getElementById('playerModal').classList.add('hidden'); document.body.style.overflow = ''; }

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
