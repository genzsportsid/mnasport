<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MNA FC | Pro Command Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'brand-blue': '#1d4ed8', 'brand-neon': '#3b82f6', 'brand-gold': '#d7b67d',
                        'brand-dark': '#050505', 'brand-surface': '#0a0a0a', 'brand-panel': '#111111'
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap');
        body { background-color: #050505; color: #ffffff; -webkit-tap-highlight-color: transparent; font-family: 'Inter', sans-serif; }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .glass-panel { background: rgba(17, 17, 17, 0.7); backdrop-filter: blur(24px); border: 1px solid rgba(255, 255, 255, 0.05); }
        
        /* STACKED CARD EFFECT */
        .stacked-card { transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); background: #0a0a0a; border-top: 1px solid rgba(255,255,255,0.1); border-left: 1px solid rgba(255,255,255,0.05); border-right: 1px solid rgba(255,255,255,0.05); box-shadow: 0 -10px 20px rgba(0,0,0,0.6); }
        .stacked-card:hover { transform: translateY(-16px); z-index: 50 !important; border-top-color: rgba(59, 130, 246, 0.5); box-shadow: 0 -15px 30px rgba(59, 130, 246, 0.2), 0 15px 20px rgba(0,0,0,0.8); }

        /* TACTICAL PITCH ENGINE */
        .pitch-wrapper { position: relative; width: 100%; max-width: 380px; margin: 0 auto; border-radius: 12px; overflow: hidden; border: 1.5px solid rgba(255, 255, 255, 0.15); box-shadow: inset 0 0 40px rgba(0,0,0,0.5); }
        .pitch-wrapper::before { content: ""; display: block; padding-top: 145%; }
        .pitch-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transition: all 0.5s ease; }
        .pitch-football { background: #061c06; background-image: repeating-linear-gradient(0deg, transparent, transparent 10%, rgba(255,255,255,0.02) 10%, rgba(255,255,255,0.02) 20%); }
        .pitch-futsal { background: #091324; background-image: repeating-linear-gradient(0deg, transparent, transparent 10%, rgba(255,255,255,0.02) 10%, rgba(255,255,255,0.02) 20%); }
        .pitch-line { position: absolute; border: 1.5px solid rgba(255, 255, 255, 0.2); }
        .pitch-half { top: 0; left: 0; width: 100%; height: 50%; border-bottom: 1.5px solid rgba(255, 255, 255, 0.2); }
        .pitch-circle { top: 50%; left: 50%; width: 20%; aspect-ratio: 1/1; border-radius: 50%; transform: translate(-50%, -50%); }
        
        .position-zone { position: absolute; transform: translate(-50%, 50%); border-radius: 12px; pointer-events: none; z-index: 5; opacity: 0.7; }
        .player-marker { position: absolute; width: 34px; height: 34px; border: 2px solid white; border-radius: 50%; transform: translate(-50%, 50%); display: flex; align-items: center; justify-content: center; text-align: center; font-size: 9px; font-weight: 900; color: white; text-shadow: 0px 1px 3px rgba(0,0,0,0.8); z-index: 10; box-shadow: 0 4px 6px rgba(0,0,0,0.5); }
        .player-marker-alt { position: absolute; width: 30px; height: 30px; border: 2px dashed rgba(255,255,255,0.7); border-radius: 50%; transform: translate(-50%, 50%); display: flex; align-items: center; justify-content: center; text-align: center; font-size: 8px; font-weight: 800; color: rgba(255,255,255,0.8); z-index: 9; opacity: 0.6; }

        /* LINEUP BUILDER */
        .lineup-slot { position: absolute; width: 40px; height: 40px; border-radius: 50%; transform: translate(-50%, 50%); z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0,0,0,0.6); border: 2px dashed rgba(255,255,255,0.5); backdrop-filter: blur(4px); cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.5); }
        .lineup-slot:hover { border-color: white; transform: translate(-50%, 50%) scale(1.05); }
        .lineup-slot.active { border-color: #3b82f6; box-shadow: 0 0 20px rgba(59, 130, 246, 0.8); transform: translate(-50%, 50%) scale(1.15); background: rgba(59, 130, 246, 0.3); z-index: 30; }
        .lineup-slot.filled { border-style: solid; border-color: white; background-size: cover; background-position: center; border-width: 2px; }
        .lineup-slot-label { position: absolute; bottom: -16px; white-space: nowrap; font-size: 8px; font-weight: 900; background: rgba(0,0,0,0.9); padding: 2px 6px; border-radius: 4px; color: white; border: 1px solid rgba(255,255,255,0.1); text-transform: uppercase; letter-spacing: 0.05em; }

        .pool-card { min-width: 70px; width: 70px; transition: all 0.2s; cursor: pointer; }
        .pool-card:hover { transform: translateY(-3px); }
        .pool-card:active { transform: scale(0.95); }
        .pool-card.disabled { opacity: 0.2; pointer-events: none; filter: grayscale(100%); }

        .stagger-item { animation: fadeUp 0.5s ease forwards; opacity: 0; transform: translateY(10px); }
        @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }
        .shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake { 10%, 90% { transform: translate3d(-1px, 0, 0); } 20%, 80% { transform: translate3d(2px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-4px, 0, 0); } 40%, 60% { transform: translate3d(4px, 0, 0); } }
        
        .action-btn { transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .action-btn:active { transform: scale(0.95); }
        .page-slide-in { transform: translateX(0) !important; }
    </style>
</head>
<body class="bg-brand-dark lg:pb-0 pb-32">

    <header class="fixed top-0 w-full z-50 glass-panel border-b border-white/5 pt-safe">
        <div class="max-w-7xl mx-auto px-5 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-lg bg-brand-blue flex items-center justify-center shadow-[0_0_15px_rgba(59,130,246,0.4)]"><span class="font-black text-white text-xs">M</span></div>
                <h1 class="font-black text-lg italic tracking-tighter uppercase text-white hidden sm:block" id="brand-name">MNA FC</h1>
            </div>
            
            <div class="flex items-center gap-2">
                <div id="main-nav-tabs" class="flex bg-white/5 p-1 rounded-xl border border-white/10">
                    <button onclick="switchMode('squad')" id="tab-squad" class="px-4 py-1.5 text-[10px] font-black uppercase tracking-widest rounded-lg transition-all bg-brand-blue text-white shadow-lg">Squad</button>
                    <button onclick="switchMode('gallery')" id="tab-gallery" class="px-4 py-1.5 text-[10px] font-bold uppercase tracking-widest rounded-lg transition-all text-gray-500 hover:text-white">Media</button>
                </div>
                <button id="btn-lock" onclick="openCoachGate()" class="p-2 ml-1 bg-brand-panel rounded-xl border border-white/10 text-brand-gold hover:bg-brand-gold hover:text-black transition-all shadow-lg group relative">
                    <i data-lucide="lock" class="w-4 h-4"></i>
                    <span class="absolute -bottom-8 right-0 bg-black text-[8px] px-2 py-1 rounded border border-white/10 opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap">Coach Access</span>
                </button>
            </div>
        </div>
    </header>

    <main class="pt-24 px-5 max-w-7xl mx-auto pb-10">
        
        <div id="sport-dashboard-container" class="block animate-fade-in max-w-4xl mx-auto">
            <div class="flex gap-2 mb-6 bg-brand-panel p-1.5 rounded-2xl border border-white/5">
                <button id="btn-fc" onclick="switchSport('mnafc')" class="flex-1 py-3 rounded-xl text-[10px] font-black uppercase tracking-widest flex items-center justify-center gap-2 transition-all bg-brand-blue text-white shadow-lg"><i data-lucide="circle-dot" class="w-4 h-4"></i> Sepak Bola</button>
                <button id="btn-futsal" onclick="switchSport('futsal')" class="flex-1 py-3 rounded-xl text-[10px] font-bold uppercase tracking-widest flex items-center justify-center gap-2 transition-all text-gray-500 hover:text-white"><i data-lucide="zap" class="w-4 h-4"></i> Futsal</button>
            </div>
        </div>

        <div id="view-squad" class="block animate-fade-in max-w-4xl mx-auto">
            <div class="glass-panel rounded-3xl p-6 md:p-8 mb-6 border border-white/5 relative overflow-hidden">
                <div class="absolute -right-20 -top-20 w-64 h-64 bg-brand-blue/10 blur-[80px] rounded-full"></div>
                <div class="grid grid-cols-3 gap-4 relative z-10">
                    <div><p class="text-[9px] md:text-xs font-bold text-gray-500 uppercase tracking-widest mb-1">Win Rate</p><p id="win-rate" class="text-3xl md:text-5xl font-black text-brand-neon">0%</p></div>
                    <div class="pl-4 border-l border-white/10"><p class="text-[9px] md:text-xs font-bold text-gray-500 uppercase tracking-widest mb-1">W-S-K</p><p id="match-record" class="text-3xl md:text-5xl font-black text-white">0-0-0</p></div>
                    <div class="pl-4 border-l border-white/10"><p class="text-[9px] md:text-xs font-bold text-gray-500 uppercase tracking-widest mb-1">Goal Diff</p><p id="goal-diff" class="text-3xl md:text-5xl font-black text-brand-gold">+0</p></div>
                </div>
            </div>

            <div class="sticky top-16 z-40 bg-brand-dark/95 backdrop-blur-xl py-4 -mx-5 px-5 mb-4 border-b border-white/5">
                <div class="relative flex-1 mb-4">
                    <i data-lucide="search" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-500"></i>
                    <input type="text" id="playerSearch" oninput="runFilter()" placeholder="Cari pemain, instansi..." class="w-full bg-brand-panel border border-white/10 rounded-2xl py-3 pl-12 pr-4 text-sm font-medium outline-none focus:border-brand-neon transition-colors text-white placeholder-gray-600">
                </div>
                <div id="filter-football" class="flex gap-2 overflow-x-auto hide-scroll pb-1">
                    <button onclick="setPosFilter('ALL', this, 'mnafc')" class="pos-btn-fc bg-brand-blue text-white px-6 py-2 rounded-xl text-[10px] font-black uppercase border border-brand-blue transition-all whitespace-nowrap">Semua</button>
                    <button onclick="setPosFilter('GK', this, 'mnafc')" class="pos-btn-fc text-gray-500 bg-white/5 px-6 py-2 rounded-xl text-[10px] font-bold uppercase border border-white/10 transition-all whitespace-nowrap">GK</button>
                    <button onclick="setPosFilter('DEF', this, 'mnafc')" class="pos-btn-fc text-gray-500 bg-white/5 px-6 py-2 rounded-xl text-[10px] font-bold uppercase border border-white/10 transition-all whitespace-nowrap">DEF</button>
                    <button onclick="setPosFilter('MID', this, 'mnafc')" class="pos-btn-fc text-gray-500 bg-white/5 px-6 py-2 rounded-xl text-[10px] font-bold uppercase border border-white/10 transition-all whitespace-nowrap">MID</button>
                    <button onclick="setPosFilter('FWD', this, 'mnafc')" class="pos-btn-fc text-gray-500 bg-white/5 px-6 py-2 rounded-xl text-[10px] font-bold uppercase border border-white/10 transition-all whitespace-nowrap">FWD</button>
                </div>
                <div id="filter-futsal" class="hidden gap-2 overflow-x-auto hide-scroll pb-1">
                    <button onclick="setPosFilter('ALL', this, 'futsal')" class="pos-btn-fs bg-brand-blue text-white px-6 py-2 rounded-xl text-[10px] font-black uppercase border border-brand-blue transition-all whitespace-nowrap">Semua</button>
                    <button onclick="setPosFilter('GK', this, 'futsal')" class="pos-btn-fs text-gray-500 bg-white/5 px-6 py-2 rounded-xl text-[10px] font-bold uppercase border border-white/10 transition-all whitespace-nowrap">GK</button>
                    <button onclick="setPosFilter('ANC', this, 'futsal')" class="pos-btn-fs text-gray-500 bg-white/5 px-6 py-2 rounded-xl text-[10px] font-bold uppercase border border-white/10 transition-all whitespace-nowrap">Anchor</button>
                    <button onclick="setPosFilter('FLK', this, 'futsal')" class="pos-btn-fs text-gray-500 bg-white/5 px-6 py-2 rounded-xl text-[10px] font-bold uppercase border border-white/10 transition-all whitespace-nowrap">Flank</button>
                    <button onclick="setPosFilter('PVT', this, 'futsal')" class="pos-btn-fs text-gray-500 bg-white/5 px-6 py-2 rounded-xl text-[10px] font-bold uppercase border border-white/10 transition-all whitespace-nowrap">Pivot</button>
                </div>
            </div>
            
            <div id="playerGrid" class="flex flex-col -space-y-4 pb-12 pt-2"></div>
        </div>

        <div id="view-gallery" class="hidden animate-fade-in max-w-7xl mx-auto">
            <div class="sticky top-16 z-40 bg-brand-dark/95 backdrop-blur-xl py-4 -mx-5 px-5 mb-4 border-b border-white/5">
                <div class="relative w-full max-w-4xl mx-auto">
                    <i data-lucide="search" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-500"></i>
                    <input type="text" id="mediaSearch" oninput="runMediaFilter()" placeholder="Cari kegiatan media..." class="w-full bg-brand-panel border border-white/10 rounded-2xl py-3 pl-12 pr-4 text-sm font-medium outline-none focus:border-brand-neon transition-colors text-white placeholder-gray-600">
                </div>
            </div>
            <div id="galleryGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-5"></div>
        </div>
        
        <div id="view-coach-dashboard" class="hidden animate-fade-in">
            <div class="bg-brand-panel border border-white/10 p-4 rounded-2xl flex flex-wrap justify-between items-center gap-4 mb-6 shadow-lg">
                <div class="flex items-center gap-4">
                    <div class="flex items-center justify-center w-12 h-12 bg-white/5 rounded-xl border border-white/10">
                        <i data-lucide="shield-check" class="w-6 h-6 text-brand-gold"></i>
                    </div>
                    <div>
                        <h2 class="text-sm md:text-base font-black text-white uppercase tracking-widest leading-tight" id="coach-sport-label">MNA FC Coach</h2>
                        <p class="text-[10px] text-brand-neon font-bold uppercase tracking-widest" id="match-status-text">Mode Persiapan (Setup)</p>
                    </div>
                </div>
                
                <div id="match-scoreboard" class="hidden items-center gap-6 px-6 py-2 bg-black rounded-xl border border-white/10">
                    <div class="text-center"><p class="text-[8px] text-gray-500 uppercase font-black">HOME</p><p class="text-2xl font-black text-white" id="score-home">0</p></div>
                    <div class="text-center cursor-pointer" onclick="toggleTimer()">
                        <p class="text-[8px] text-gray-500 uppercase font-black mb-1">TIMER</p>
                        <p class="text-xl font-black text-brand-gold bg-white/5 px-3 py-1 rounded border border-white/10" id="match-timer">00:00</p>
                    </div>
                    <div class="text-center"><p class="text-[8px] text-gray-500 uppercase font-black">AWAY</p><p class="text-2xl font-black text-red-400" id="score-away">0</p></div>
                </div>

                <div class="flex gap-2">
                    <button id="btn-start-match" onclick="startLiveMatch()" class="bg-brand-neon hover:bg-blue-600 text-white px-5 py-3 rounded-xl text-[10px] font-black uppercase tracking-widest transition-colors shadow-[0_0_15px_rgba(59,130,246,0.3)]">Mulai Match</button>
                    <button onclick="closeCoachDashboard()" class="bg-white/5 hover:bg-white/10 border border-white/10 text-white px-4 py-3 rounded-xl text-[10px] font-bold uppercase tracking-widest transition-colors"><i data-lucide="log-out" class="w-4 h-4"></i></button>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
                
                <div class="lg:col-span-5 flex flex-col">
                    <div class="bg-brand-panel p-5 rounded-[2rem] border border-white/10 shadow-xl sticky top-24">
                        <div class="flex items-center justify-between mb-4">
                            <h3 class="text-xs font-black text-white uppercase tracking-widest flex items-center gap-2"><i data-lucide="layout-template" class="w-4 h-4 text-brand-neon"></i> Formasi</h3>
                            <select id="formation-select" onchange="changeFormation(this.value)" class="bg-black border border-white/10 text-white text-[10px] font-bold uppercase rounded-lg py-1.5 px-3 outline-none focus:border-brand-neon cursor-pointer"></select>
                        </div>
                        
                        <div class="pitch-wrapper">
                            <div id="lineup-pitch" class="pitch-container pitch-football">
                                <div class="pitch-half pitch-line"></div><div class="pitch-circle pitch-line"></div>
                                <div class="pitch-line" style="top:0; left:20%; width:60%; height:18%; border-top:0;"></div>
                                <div class="pitch-line" style="bottom:0; left:20%; width:60%; height:18%; border-bottom:0;"></div>
                                <div id="lineup-slots-container"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="lg:col-span-7 flex flex-col gap-6">
                    
                    <div id="coach-setup-panel" class="bg-brand-panel p-5 rounded-3xl border border-white/10 shadow-lg block">
                        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-4 border-b border-white/5 pb-4">
                            <div>
                                <h3 class="text-xs font-black text-white uppercase tracking-widest">Bursa Skuad</h3>
                                <p class="text-[9px] font-bold text-gray-500 uppercase mt-1" id="lineup-instruction">Pilih slot formasi di lapangan</p>
                            </div>
                            <div class="flex items-center gap-2 w-full sm:w-auto">
                                <input type="text" id="lineupSearch" oninput="renderLineupPool()" placeholder="Cari pemain..." class="bg-black border border-white/10 text-[10px] px-3 py-2 rounded-lg text-white outline-none focus:border-brand-neon w-full sm:w-40">
                                <button onclick="resetLineup()" class="text-red-400 bg-red-500/10 border border-red-500/20 px-3 py-2 rounded-lg text-[9px] font-bold uppercase tracking-widest hover:bg-red-500/20 transition-all whitespace-nowrap"><i data-lucide="trash-2" class="w-3 h-3 inline"></i> Reset</button>
                            </div>
                        </div>
                        
                        <div id="lineup-pool" class="flex flex-wrap lg:grid lg:grid-cols-5 gap-3 overflow-y-auto max-h-[400px] hide-scroll opacity-30 pointer-events-none transition-opacity duration-300">
                        </div>
                    </div>

                    <div id="coach-live-panel" class="hidden flex-col gap-6">
                        <div class="grid grid-cols-2 gap-4">
                            <button onclick="triggerAction('goal_home')" class="action-btn bg-gradient-to-br from-green-600/30 to-green-900/40 border border-green-500/50 text-green-400 p-6 rounded-3xl flex flex-col items-center justify-center gap-3 hover:border-green-400 shadow-[0_0_30px_rgba(34,197,94,0.15)]">
                                <i data-lucide="goal" class="w-10 h-10 drop-shadow-md"></i><span class="text-sm font-black uppercase tracking-widest text-white">Goal Scored</span>
                            </button>
                            <button onclick="triggerAction('goal_away')" class="action-btn bg-gradient-to-br from-red-600/30 to-red-900/40 border border-red-500/50 text-red-400 p-6 rounded-3xl flex flex-col items-center justify-center gap-3 hover:border-red-400 shadow-[0_0_30px_rgba(239,68,68,0.15)]">
                                <i data-lucide="shield-alert" class="w-10 h-10 drop-shadow-md"></i><span class="text-sm font-black uppercase tracking-widest text-white">Conceded</span>
                            </button>
                        </div>
                        
                        <div class="grid grid-cols-4 sm:grid-cols-6 gap-3">
                            <button onclick="triggerAction('assist')" class="action-btn bg-brand-panel border border-white/10 p-3 rounded-2xl flex flex-col items-center justify-center gap-2 hover:bg-white/5"><i data-lucide="footprints" class="w-5 h-5 text-brand-neon"></i><span class="text-[9px] font-bold uppercase text-gray-300">Assist</span></button>
                            <button onclick="triggerAction('sub')" class="action-btn bg-brand-panel border border-white/10 p-3 rounded-2xl flex flex-col items-center justify-center gap-2 hover:bg-white/5"><i data-lucide="arrow-left-right" class="w-5 h-5 text-brand-gold"></i><span class="text-[9px] font-bold uppercase text-gray-300">Sub</span></button>
                            <button onclick="triggerAction('yellow')" class="action-btn bg-brand-panel border border-white/10 p-3 rounded-2xl flex flex-col items-center justify-center gap-2 hover:border-yellow-500/50"><div class="w-4 h-5 bg-yellow-400 rounded shadow-sm"></div><span class="text-[9px] font-bold uppercase text-gray-300">Yellow</span></button>
                            <button onclick="triggerAction('red')" class="action-btn bg-brand-panel border border-white/10 p-3 rounded-2xl flex flex-col items-center justify-center gap-2 hover:border-red-500/50"><div class="w-4 h-5 bg-red-600 rounded shadow-sm"></div><span class="text-[9px] font-bold uppercase text-gray-300">Red</span></button>
                            <button onclick="triggerAction('pen_won')" class="action-btn col-span-2 sm:col-span-1 bg-brand-panel border border-white/10 p-3 rounded-2xl flex flex-col items-center justify-center gap-2 hover:bg-white/5"><i data-lucide="target" class="w-5 h-5 text-green-400"></i><span class="text-[9px] font-bold uppercase text-gray-300">Pen Won</span></button>
                            <button onclick="triggerAction('pen_miss')" class="action-btn col-span-2 sm:col-span-1 bg-brand-panel border border-white/10 p-3 rounded-2xl flex flex-col items-center justify-center gap-2 hover:bg-white/5"><i data-lucide="x-circle" class="w-5 h-5 text-red-400"></i><span class="text-[9px] font-bold uppercase text-gray-300">Pen Miss</span></button>
                        </div>

                        <div class="bg-[#050505] border border-white/10 rounded-3xl p-5 flex-1 min-h-[250px] shadow-inner flex flex-col">
                            <h3 class="text-[10px] font-black text-gray-500 uppercase tracking-widest border-b border-white/5 pb-3 mb-4 flex items-center gap-2"><i data-lucide="activity" class="w-4 h-4"></i> Match Timeline</h3>
                            <div id="event-log" class="overflow-y-auto hide-scroll flex-1 space-y-3">
                                <div class="text-center mt-10"><p class="text-[10px] font-bold text-gray-600 uppercase tracking-widest">Belum ada kejadian tercatat</p></div>
                            </div>
                        </div>

                        <button onclick="endLiveMatch()" class="w-full bg-red-600/20 border border-red-500 text-red-400 py-4 mt-2 rounded-2xl font-black uppercase text-[10px] tracking-widest shadow-[0_0_20px_rgba(239,68,68,0.2)] hover:bg-red-500 hover:text-white transition-all">
                            <i data-lucide="save" class="w-4 h-4 inline pb-0.5 mr-1"></i> Akhiri & Simpan Match
                        </button>
                    </div>
                </div>
            </div>
        </div>

    </main>

    <div id="actionModal" class="fixed inset-0 z-[250] hidden flex flex-col justify-end lg:justify-center lg:items-center p-0 lg:p-4">
        <div class="absolute inset-0 bg-black/90 backdrop-blur-sm" onclick="closeActionModal()"></div>
        <div class="relative bg-brand-panel border-t border-x border-white/10 lg:border lg:rounded-3xl rounded-t-[2rem] p-6 w-full lg:max-w-2xl mx-auto z-10 modal-enter pb-safe shadow-2xl flex flex-col max-h-[85vh]">
            <h3 id="action-title" class="text-lg lg:text-xl font-black text-white uppercase tracking-widest mb-4 text-center drop-shadow-md flex-shrink-0">Pilih Pemain</h3>
            
            <div id="action-search-container" class="hidden mb-4 flex-shrink-0 px-2">
                <input type="text" id="actionSearch" oninput="renderSubInPool()" placeholder="Cari pemain pengganti..." class="w-full bg-black border border-white/10 rounded-xl py-3 px-4 text-xs text-white outline-none focus:border-brand-neon">
            </div>

                </div>
            
            <div class="mt-4 pt-4 border-t border-white/10 text-center flex-shrink-0">
                <button onclick="closeActionModal()" class="bg-white/5 hover:bg-white/10 border border-white/10 px-8 py-3 rounded-xl text-[10px] font-bold text-white uppercase tracking-widest transition-all">Batal</button>

            <i data-lucide="lock" class="w-12 h-12 text-brand-gold mx-auto mb-4 drop-shadow-lg"></i>

            <input type="password" id="coach-pin" maxlength="4" placeholder="••••" class="w-full text-center text-4xl font-black tracking-[0.5em] bg-black border border-white/10 text-brand-gold rounded-2xl py-4 outline-none focus:border-brand-gold focus:shadow-[0_0_20px_rgba(215,182,125,0.2)] mb-6 transition-all placeholder-gray-800">
            
            <button onclick="verifyPin()" class="w-full py-4 bg-brand-gold text-black font-black uppercase text-xs tracking-widest rounded-xl hover:bg-white transition-colors shadow-lg">Akses Dashboard</button>

    </div>

    <div id="playerModal" class="fixed inset-0 z-[150] hidden flex items-center justify-center p-4"><div class="absolute inset-0 bg-brand-dark/95 backdrop-blur-xl" onclick="closeModal()"></div><div id="modalContent" class="w-full max-w-sm glass-panel border border-white/10 rounded-[2.5rem] overflow-hidden relative z-10 modal-enter shadow-2xl"></div></div>
    <div id="fullProfilePage" class="fixed inset-0 z-[200] hidden bg-brand-dark h-[100dvh] w-full overflow-y-auto overscroll-contain transition-transform duration-500 translate-x-full"></div>

    <nav class="fixed bottom-0 w-full z-[110] bg-brand-surface/95 backdrop-blur-2xl border-t border-white/5 pb-safe transition-colors lg:hidden" id="bottom-nav">
        <div class="flex justify-around items-center h-16 max-w-md mx-auto px-2">
            <a href="/" class="flex flex-col items-center justify-center w-full h-full text-gray-400 hover:text-brand-gold transition-colors">
                <i data-lucide="layout-dashboard" class="w-5 h-5 mb-1"></i><span class="text-[9px] font-bold uppercase tracking-wider">Operator</span>
            </a>
            <a href="/tsl/" class="flex flex-col items-center justify-center w-full h-full text-gray-400 hover:text-green-500 transition-colors">
                <i data-lucide="trophy" class="w-5 h-5 mb-1"></i><span class="text-[9px] font-bold uppercase tracking-wider">TSL Liga</span>
            </a>
            <button class="flex flex-col items-center justify-center w-full h-full text-brand-neon transition-colors relative">
                <div class="absolute -top-1 w-8 h-1 bg-brand-neon rounded-b-full"></div>
                <i data-lucide="shield" class="w-5 h-5 mb-1"></i><span class="text-[9px] font-bold uppercase tracking-wider">MNA FC</span>
            </button>
        </div>
    </nav>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbyjnfuOzPD5wu124WU_h86p8TjdNt7ll9iHgmd2w6mOnaHbMQs-ee6ShoVw3U5F_CZdcg/exec'; 
        let rawData = { mnafc: { pemain: [], statistik: {} }, futsal: { pemain: [], statistik: {} }, galeri: [] };
        let activeSport = 'mnafc'; 
        let activePos = 'ALL';

        // --- SISTEM LOGIN PELATIH ---
        const SECRET_PIN = '2026';

        function openCoachGate() {
            document.getElementById('gateModal').classList.remove('hidden');
            document.getElementById('coach-pin').value = '';
            document.getElementById('coach-pin').focus();
        }
        function closeCoachGate() { document.getElementById('gateModal').classList.add('hidden'); }

        function verifyPin() {
            const input = document.getElementById('coach-pin');
            if (input.value === SECRET_PIN) {
                closeCoachGate();
                openCoachDashboard();
            } else {
                input.classList.add('shake', 'border-red-500', 'text-red-500');
                setTimeout(() => input.classList.remove('shake', 'border-red-500', 'text-red-500'), 500);
            }
        }

        // --- PRO COACH DASHBOARD LOGIC ---
        let matchState = { time: 0, timerId: null, isRunning: false, home: 0, away: 0, events: [], mode: 'setup' };
        let trackerLineup = {}; 

        function openCoachDashboard() {
            document.getElementById('view-squad').classList.add('hidden');
            document.getElementById('view-gallery').classList.add('hidden');
            document.getElementById('sport-dashboard-container').classList.add('hidden');
            document.getElementById('main-nav-tabs').classList.add('hidden');
            document.getElementById('btn-lock').classList.add('hidden');
            document.getElementById('bottom-nav').classList.add('translate-y-full'); 
            
            document.getElementById('view-coach-dashboard').classList.remove('hidden');
            document.getElementById('coach-sport-label').innerText = activeSport === 'mnafc' ? 'MNA FC Coach' : 'MNA FUTSAL Coach';
            
            matchState.mode = 'setup';
            matchState.home = 0; matchState.away = 0; matchState.events = [];
            document.getElementById('coach-setup-panel').classList.remove('hidden');
            document.getElementById('coach-live-panel').classList.add('hidden');
            document.getElementById('match-scoreboard').classList.add('hidden');
            document.getElementById('match-status-text').innerText = 'Mode Persiapan Lineup';
            document.getElementById('btn-start-match').classList.remove('hidden');
            
            initLineupBuilder();
        }

        function closeCoachDashboard() {
            if(matchState.mode === 'live' && !confirm("Yakin ingin keluar? Match sedang berjalan.")) return;
            if(matchState.isRunning) toggleTimer();
            
            document.getElementById('view-coach-dashboard').classList.add('hidden');
            document.getElementById('main-nav-tabs').classList.remove('hidden');
            document.getElementById('btn-lock').classList.remove('hidden');
            document.getElementById('sport-dashboard-container').classList.remove('hidden');
            document.getElementById('bottom-nav').classList.remove('translate-y-full');
            
            switchMode('squad'); 
        }

        function startLiveMatch() {
            const slotsCount = FORMATIONS[activeSport][currentFormationKey].length;
            if (Object.keys(lineupData).length < slotsCount) {
                if(!confirm(`Lineup belum lengkap (${Object.keys(lineupData).length}/${slotsCount}). Yakin mulai match?`)) return;
            }

            matchState.mode = 'live';
            trackerLineup = JSON.parse(JSON.stringify(lineupData));

            document.getElementById('coach-setup-panel').classList.add('hidden');
            document.getElementById('coach-live-panel').classList.remove('hidden');
            document.getElementById('coach-live-panel').classList.add('flex');
            
            document.getElementById('match-scoreboard').classList.remove('hidden');
            document.getElementById('match-scoreboard').classList.add('flex');
            document.getElementById('btn-start-match').classList.add('hidden');
            
            document.getElementById('match-status-text').innerText = 'Live Match Tracker';
            document.getElementById('match-status-text').classList.replace('text-brand-neon', 'text-red-500');

            document.getElementById('score-home').innerText = '0';
            document.getElementById('score-away').innerText = '0';
            document.getElementById('event-log').innerHTML = '';

            renderTrackerPitch();
        }

        function toggleTimer() {
            const timerEl = document.getElementById('match-timer');
            if (matchState.isRunning) {
                clearInterval(matchState.timerId);
                matchState.isRunning = false;
                timerEl.classList.replace('text-brand-neon', 'text-brand-gold');
            } else {
                matchState.isRunning = true;
                timerEl.classList.replace('text-brand-gold', 'text-brand-neon');
                matchState.timerId = setInterval(() => {
                    matchState.time++;
                    const m = String(Math.floor(matchState.time / 60)).padStart(2, '0');
                    const s = String(matchState.time % 60).padStart(2, '0');
                    timerEl.innerText = `${m}:${s}`;
                }, 1000);
            }
        }

        function getMatchMinute() { return Math.floor(matchState.time / 60) + "'"; }

        function renderTrackerPitch() {
            const container = document.getElementById('lineup-slots-container');
            const slotsDef = FORMATIONS[activeSport][currentFormationKey];
            
            container.innerHTML = slotsDef.map((s, i) => {
                const p = trackerLineup[i];
                if(p) {
                    return `<div class="lineup-slot filled border-brand-neon pointer-events-none" style="bottom:${s.b}; left:${s.l}; background-image:url('${val(p.link_foto)}')"><span class="lineup-slot-label bg-brand-neon border-brand-neon">${val(p.nama).split(' ')[0]}</span></div>`;
                } else {
                    return `<div class="lineup-slot pointer-events-none" style="bottom:${s.b}; left:${s.l};"><span class="lineup-slot-label bg-black">${s.role}</span></div>`;
                }
            }).join('');
        }

        // --- FASE 4: ACTION ENGINE & SUBSTITUSI ---
        let currentActionType = '';
        let playerOutSlot = null;

        function triggerAction(type) {
            currentActionType = type;
            const titleEl = document.getElementById('action-title');
            
            if(type === 'goal_away') {
                logEvent('red', 'Kebobolan', 'Gol oleh Tim Lawan', 'shield-alert');
                matchState.away++; document.getElementById('score-away').innerText = matchState.away; return;
            }
            
            document.getElementById('action-search-container').classList.add('hidden'); // Sembunyikan search bar default

            const listEl = document.getElementById('action-player-list');
            listEl.innerHTML = '';

            let titleTxt = ''; let color = '';
            if(type === 'goal_home') { titleTxt = 'Pencetak Gol'; color = 'text-green-400'; }
            else if(type === 'assist') { titleTxt = 'Pemberi Assist'; color = 'text-brand-neon'; }
            else if(type === 'yellow') { titleTxt = 'Kartu Kuning'; color = 'text-yellow-400'; }
            else if(type === 'red') { titleTxt = 'Kartu Merah'; color = 'text-red-500'; }
            else if(type === 'pen_won') { titleTxt = 'Dapat Penalti'; color = 'text-green-400'; }
            else if(type === 'pen_miss') { titleTxt = 'Gagal Penalti'; color = 'text-red-400'; }
            else if(type === 'sub') { titleTxt = 'Pemain KELUAR (Sub Out)'; color = 'text-brand-gold'; }

            titleEl.className = `text-lg lg:text-xl font-black uppercase tracking-widest mb-4 text-center drop-shadow-md ${color}`;
            titleEl.innerText = titleTxt;

            // Render pemain di lapangan
            Object.keys(trackerLineup).forEach(idx => {
                const p = trackerLineup[idx];
                if(p) {
                    listEl.innerHTML += `
                    <div onclick="executeAction('${idx}')" class="flex flex-col items-center gap-2 cursor-pointer hover:scale-105 transition-transform">
                        <div class="w-14 h-14 md:w-16 md:h-16 rounded-full border-2 border-white/10 bg-black overflow-hidden shadow-lg"><img src="${val(p.link_foto)}" class="w-full h-full object-cover"></div>
                        <p class="text-[9px] font-black text-white uppercase text-center leading-tight line-clamp-1 w-full px-1">${val(p.nama).split(' ')[0]}</p>
                    </div>`;
                }
            });

            document.getElementById('actionModal').classList.remove('hidden');
        }

        function executeAction(slotIdx) {
            // FASE 4: LOGIKA SUB-IN DENGAN FITUR PENCARIAN
            if (currentActionType === 'sub') {
                playerOutSlot = slotIdx;
                currentActionType = 'sub_in';
                
                document.getElementById('action-title').innerText = 'Pemain MASUK (Sub In)';
                document.getElementById('action-title').className = 'text-lg lg:text-xl font-black uppercase tracking-widest mb-4 text-center drop-shadow-md text-brand-neon';
                
                // Tampilkan search bar untuk sub
                document.getElementById('action-search-container').classList.remove('hidden');
                document.getElementById('actionSearch').value = '';
                
                renderSubInPool(); // Render bursa cadangan
                return; // Berhenti agar modal tidak tertutup
            }

            const p = trackerLineup[slotIdx];
            closeActionModal();

            if (currentActionType === 'goal_home') {
                logEvent('green', 'Gol', p.nama, 'goal');
                matchState.home++; document.getElementById('score-home').innerText = matchState.home;
            } else if (currentActionType === 'assist') {
                logEvent('blue', 'Assist', p.nama, 'footprints');
            } else if (currentActionType === 'yellow') {
                logEvent('yellow', 'Kartu Kuning', p.nama, 'alert-circle');
            } else if (currentActionType === 'red') {
                logEvent('red', 'Kartu Merah', p.nama, 'alert-triangle');
            } else if (currentActionType === 'pen_won') {
                logEvent('green', 'Penalti Didapat', p.nama, 'target');
            } else if (currentActionType === 'pen_miss') {
                logEvent('red', 'Penalti Gagal', p.nama, 'x-circle');
            }
        }

        // Render Bursa Pemain Cadangan dengan Pencarian
        function renderSubInPool() {
            const listEl = document.getElementById('action-player-list');
            const query = document.getElementById('actionSearch').value.toLowerCase();
            listEl.innerHTML = '';
            
            const allPlayers = rawData[activeSport].pemain;
            const activeIds = Object.values(trackerLineup).filter(player => player).map(player => player.nomor + player.nama);
            
            allPlayers.forEach((benchPlayer, originalIdx) => {
                // Hanya tampilkan jika belum ada di lapangan DAN sesuai dengan pencarian (jika ada)
                const searchTxt = (val(benchPlayer.nama) + val(benchPlayer.posisi)).toLowerCase();
                if(!activeIds.includes(benchPlayer.nomor + benchPlayer.nama) && searchTxt.includes(query)) {
                    listEl.innerHTML += `
                    <div onclick="executeSubIn('${originalIdx}')" class="flex flex-col items-center gap-2 cursor-pointer hover:scale-105 transition-transform">
                        <div class="w-14 h-14 md:w-16 md:h-16 rounded-full border-2 border-white/10 bg-black overflow-hidden hover:border-brand-neon transition-all shadow-lg"><img src="${val(benchPlayer.link_foto)}" class="w-full h-full object-cover"></div>
                        <p class="text-[9px] font-black text-white uppercase text-center leading-tight line-clamp-1 w-full px-1">${val(benchPlayer.nama).split(' ')[0]}</p>
                        <p class="text-[7px] text-brand-neon font-bold">${val(benchPlayer.posisi)}</p>
                    </div>`;
                }
            });
        }

        function executeSubIn(benchIdx) {
            const pOut = trackerLineup[playerOutSlot];
            const pIn = rawData[activeSport].pemain[benchIdx];
            
            trackerLineup[playerOutSlot] = pIn;
            logEvent('blue', 'Substitusi', `IN: ${pIn.nama.split(' ')[0]} | OUT: ${pOut.nama.split(' ')[0]}`, 'arrow-left-right');
            
            renderTrackerPitch();
            closeActionModal();
        }

        function logEvent(colorScheme, title, desc, iconName) {
            const minute = getMatchMinute();
            let bgStr = ''; let textStr = ''; let iconCol = '';
            if(colorScheme === 'green') { bgStr = 'bg-green-500/10 border-green-500/30'; textStr = 'text-green-400'; iconCol = 'text-green-500'; }
            else if(colorScheme === 'red') { bgStr = 'bg-red-500/10 border-red-500/30'; textStr = 'text-red-400'; iconCol = 'text-red-500'; }
            else if(colorScheme === 'yellow') { bgStr = 'bg-yellow-500/10 border-yellow-500/30'; textStr = 'text-yellow-400'; iconCol = 'text-yellow-500'; }
            else if(colorScheme === 'blue') { bgStr = 'bg-brand-neon/10 border-brand-neon/30'; textStr = 'text-brand-neon'; iconCol = 'text-brand-neon'; }

            matchState.events.push({ time: minute, type: title, detail: desc });
            
            const logEl = document.getElementById('event-log');
            if(matchState.events.length === 1) logEl.innerHTML = ''; 
            
            const itemHTML = `
            <div class="flex items-center gap-3 p-3 rounded-xl border ${bgStr} animate-fade-in shadow-sm bg-black/50">
                <div class="w-8 h-8 rounded-lg bg-black flex flex-shrink-0 items-center justify-center border border-white/5"><i data-lucide="${iconName}" class="w-4 h-4 ${iconCol}"></i></div>
                <div class="flex-1 min-w-0">
                    <div class="flex justify-between items-end mb-0.5">
                        <h4 class="text-[10px] font-black uppercase tracking-widest ${textStr}">${title}</h4>
                        <span class="text-[8px] font-bold text-gray-400 bg-white/5 px-2 py-0.5 rounded ml-2 flex-shrink-0">${minute}</span>
                    </div>
                    <p class="text-[9px] text-white uppercase truncate">${desc}</p>
                </div>
            </div>`;
            logEl.insertAdjacentHTML('afterbegin', itemHTML); 
            lucide.createIcons();
        }

        function closeActionModal() { document.getElementById('actionModal').classList.add('hidden'); }

        // FASE 4: FUNGSI POST FETCH KE GOOGLE SHEETS
        async function endLiveMatch() {
            if(!confirm("Akhiri pertandingan dan simpan log data ke Database Server?")) return;
            
            const btn = document.querySelector('button[onclick="endLiveMatch()"]');
            const originalText = btn.innerHTML;
            btn.innerHTML = "Menyimpan ke Database...";
            btn.disabled = true;

            const payload = {
                id_match: 'M' + Date.now(),
                tanggal: new Date().toLocaleDateString('id-ID'),
                cabang: activeSport,
                lawan: 'Pertandingan Uji Coba', 
                skor_kita: matchState.home,
                skor_lawan: matchState.away,
                events: matchState.events
            };

            try {
                await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'save_match', payload: payload })
                });
                alert("Pertandingan Selesai! Log data telah diamankan ke server MNA FC.");
                closeCoachDashboard(); 
            } catch(e) {
                console.error(e);
                alert("Gagal mengirim ke server. Pastikan Code.gs Anda memiliki fungsi doPost dan sudah di-deploy ulang sebagai versi baru.");
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }

        // ==========================================
        // DATA & ENGINE PUBLIC
        // ==========================================
        
        const FORMATIONS = {
            mnafc: {
                '4-3-3': [{ b: '8%', l: '50%', role: 'GK' }, { b: '22%', l: '35%', role: 'CB' }, { b: '22%', l: '65%', role: 'CB' }, { b: '26%', l: '15%', role: 'LB' }, { b: '26%', l: '85%', role: 'RB' }, { b: '45%', l: '50%', role: 'CDM' }, { b: '55%', l: '30%', role: 'CM' }, { b: '55%', l: '70%', role: 'CM' }, { b: '82%', l: '50%', role: 'ST' }, { b: '78%', l: '18%', role: 'LW' }, { b: '78%', l: '82%', role: 'RW' }],
                '4-4-2': [{ b: '8%', l: '50%', role: 'GK' }, { b: '22%', l: '35%', role: 'CB' }, { b: '22%', l: '65%', role: 'CB' }, { b: '26%', l: '15%', role: 'LB' }, { b: '26%', l: '85%', role: 'RB' }, { b: '48%', l: '35%', role: 'CM' }, { b: '48%', l: '65%', role: 'CM' }, { b: '55%', l: '15%', role: 'LM' }, { b: '55%', l: '85%', role: 'RM' }, { b: '80%', l: '40%', role: 'CF' }, { b: '80%', l: '60%', role: 'CF' }],
                '3-5-2': [{ b: '8%', l: '50%', role: 'GK' }, { b: '20%', l: '30%', role: 'CB' }, { b: '20%', l: '50%', role: 'CB' }, { b: '20%', l: '70%', role: 'CB' }, { b: '40%', l: '35%', role: 'CM' }, { b: '40%', l: '65%', role: 'CM' }, { b: '55%', l: '15%', role: 'LWB' }, { b: '55%', l: '85%', role: 'RWB' }, { b: '55%', l: '50%', role: 'CAM' }, { b: '80%', l: '40%', role: 'ST' }, { b: '80%', l: '60%', role: 'ST' }]
            },
            futsal: {
                '1-2-1 (Diamond)': [{ b: '8%', l: '50%', role: 'GK' }, { b: '30%', l: '50%', role: 'ANC' }, { b: '55%', l: '20%', role: 'FLK' }, { b: '55%', l: '80%', role: 'FLK' }, { b: '80%', l: '50%', role: 'PVT' }],
                '2-2 (Square)': [{ b: '8%', l: '50%', role: 'GK' }, { b: '35%', l: '30%', role: 'DEF' }, { b: '35%', l: '70%', role: 'DEF' }, { b: '70%', l: '30%', role: 'ATT' }, { b: '70%', l: '70%', role: 'ATT' }],
                '3-1 (Pyramid)': [{ b: '8%', l: '50%', role: 'GK' }, { b: '35%', l: '20%', role: 'FLK' }, { b: '25%', l: '50%', role: 'ANC' }, { b: '35%', l: '80%', role: 'FLK' }, { b: '75%', l: '50%', role: 'PVT' }]
            }
        };

        const val = (d, f = "-") => (d === "" || d === null || d === undefined) ? f : d;

        function parseIndoDate(dateStr) {
            if (!dateStr || dateStr === '-') return null;
            let cleanStr = String(dateStr).trim().split(' ')[0].split('T')[0];
            const parts = cleanStr.split(/[\/\-]/);
            if (parts.length === 3) {
                let p1 = parseInt(parts[0], 10); let p2 = parseInt(parts[1], 10); let p3 = parseInt(parts[2], 10);
                if (p1 > 1000) { return new Date(p1, p2 - 1, p3); } 
                else { let day = p1; let month = p2 - 1; let year = p3; if (month > 11) { day = p2; month = p1 - 1; } if (year < 100) { year += (year > 50 ? 1900 : 2000); } return new Date(year, month, day); }
            }
            const attempt = new Date(dateStr); return isNaN(attempt) ? null : attempt;
        }

        function processPlayerData(players) {
            if(!players) return [];
            return players.map(p => {
                const birthDate = parseIndoDate(p.tanggal_lahir);
                p.tanggal_lahir_format = '-'; p.umur_detail = '-'; p.kategori_auto = '-';
                if (birthDate) {
                    p.tanggal_lahir_format = `${String(birthDate.getDate()).padStart(2, '0')}/${String(birthDate.getMonth() + 1).padStart(2, '0')}/${String(birthDate.getFullYear()).slice(-2)}`;
                    const today = new Date(); let years = today.getFullYear() - birthDate.getFullYear(); let months = today.getMonth() - birthDate.getMonth(); let days = today.getDate() - birthDate.getDate();
                    if (days < 0) { months--; const lm = new Date(today.getFullYear(), today.getMonth(), 0); days += lm.getDate(); }
                    if (months < 0) { years--; months += 12; }
                    p.umur_detail = `${years}th ${months}bln`;
                    p.kategori_auto = years < 16 ? 'U-15' : (years <= 17 ? 'U-17' : 'SENIOR');
                }
                return p;
            });
        }

        async function init() {
            lucide.createIcons();
            const cache = localStorage.getItem('mnafc_multisport_cache');

        function getCoords(pos) {
            const p = val(pos).toUpperCase().trim();
            if(!p || p === '-') return []; // Failsafe agar posisi kosong tidak memunculkan titik abu-abu
            
            const colors = { F: {bg: 'rgba(239,68,68,0.4)', m: '#ef4444'}, M: {bg: 'rgba(34,197,94,0.4)', m: '#22c55e'}, D: {bg: 'rgba(59,130,246,0.4)', m: '#3b82f6'}, G: {bg: 'rgba(234,179,8,0.4)', m: '#eab308'}};
            const positions = {
                'GK': { b: '8%', l: '50%', w: '40%', h: '15%', c: colors.G }, 'CB': { b: '22%', l: '50%', w: '45%', h: '18%', c: colors.D }, 'LB': { b: '26%', l: '15%', w: '30%', h: '35%', c: colors.D }, 'RB': { b: '26%', l: '85%', w: '30%', h: '35%', c: colors.D }, 'LWB': { b: '35%', l: '15%', w: '30%', h: '30%', c: colors.D }, 'RWB': { b: '35%', l: '85%', w: '30%', h: '30%', c: colors.D }, 'CDM': { b: '42%', l: '50%', w: '45%', h: '18%', c: colors.M }, 'CM': { b: '52%', l: '50%', w: '45%', h: '18%', c: colors.M }, 'LM': { b: '55%', l: '15%', w: '30%', h: '30%', c: colors.M }, 'RM': { b: '55%', l: '85%', w: '30%', h: '30%', c: colors.M }, 'CAM': { b: '65%', l: '50%', w: '45%', h: '15%', c: colors.M }, 'LW': { b: '78%', l: '18%', w: '30%', h: '25%', c: colors.F }, 'RW': { b: '78%', l: '82%', w: '30%', h: '25%', c: colors.F }, 'LWG': { b: '78%', l: '18%', w: '30%', h: '25%', c: colors.F }, 'RWG': { b: '78%', l: '82%', w: '30%', h: '25%', c: colors.F }, 'CF': { b: '78%', l: '50%', w: '40%', h: '15%', c: colors.F }, 'ST': { b: '88%', l: '50%', w: '40%', h: '15%', c: colors.F },
                'ANC': { b: '25%', l: '50%', w: '50%', h: '20%', c: colors.D }, 'FLK-L': { b: '50%', l: '15%', w: '25%', h: '40%', c: colors.M }, 'FLK-R': { b: '50%', l: '85%', w: '25%', h: '40%', c: colors.M }, 'FLK': { b: '50%', l: '50%', w: '70%', h: '30%', c: colors.M }, 'PVT': { b: '80%', l: '50%', w: '50%', h: '20%', c: colors.F }
            };
            const parts = p.split('/').map(x => x.trim()); let results = [];
            parts.forEach(part => { if (positions[part]) results.push({...positions[part], label: part}); });
            if (results.length === 0) results.push({ b: '50%', l: '50%', w: '40%', h: '20%', c: {bg: 'rgba(156,163,175,0.4)', m: '#9ca3af'}, label: p });
            return results;
        }

        function runFilter() {
            const query = document.getElementById('playerSearch').value.toLowerCase();
            if(!rawData[activeSport] || !rawData[activeSport].pemain) return;
            const list = rawData[activeSport].pemain;
            const filtered = list.filter(p => {
                const searchTxt = (val(p.nama) + val(p.sekolah) + val(p.posisi)).toLowerCase().includes(query);
                const pos = val(p.posisi).toUpperCase();
                let cat = 'LAIN';
                if (activeSport === 'mnafc') {
                    if (['GK'].includes(pos)) cat = 'GK'; else if (['CB','LB','RB','LWB','RWB'].some(x => pos.includes(x))) cat = 'DEF'; else if (['CM','CDM','CAM','LM','RM'].some(x => pos.includes(x))) cat = 'MID'; else if (['ST','CF','LW','RW','RWG','LWG','SS'].some(x => pos.includes(x))) cat = 'FWD';
                } else {
                    if (['GK'].includes(pos)) cat = 'GK'; else if (pos.includes('ANC')) cat = 'ANC'; else if (['FLK', 'FLK-L', 'FLK-R'].some(x => pos.includes(x))) cat = 'FLK'; else if (pos.includes('PVT')) cat = 'PVT';
                }
                return searchTxt && (activePos === 'ALL' || cat === activePos);
            });
            renderPlayers(filtered);
        }

        function initLineupBuilder() {
            lineupData = {}; activeLineupSlot = null;

            const select = document.getElementById('formation-select'); const forms = FORMATIONS[activeSport];

        function changeFormation(key) { currentFormationKey = key; lineupData = {}; activeLineupSlot = null; document.getElementById('lineupSearch').value = ''; renderLineupPitchSetup(); renderLineupPool(); }
        
        function renderLineupPitchSetup() {
            const container = document.getElementById('lineup-slots-container');
            const pitch = document.getElementById('lineup-pitch');
            pitch.className = `pitch-container ${activeSport === 'futsal' ? 'pitch-futsal' : 'pitch-football'}`;
            const slots = FORMATIONS[activeSport][currentFormationKey];
            container.innerHTML = slots.map((s, i) => {
                const p = lineupData[i];
                if (p) return `<div onclick="selectLineupSlot(${i})" class="lineup-slot filled ${activeLineupSlot === i ? 'active' : ''}" style="bottom:${s.b}; left:${s.l}; background-image:url('${val(p.link_foto)}')"><span class="lineup-slot-label">${val(p.nama).split(' ')[0]}</span></div>`;
                return `<div onclick="selectLineupSlot(${i})" class="lineup-slot ${activeLineupSlot === i ? 'active' : ''}" style="bottom:${s.b}; left:${s.l};"><i data-lucide="plus" class="w-4 h-4 text-white/50"></i><span class="lineup-slot-label bg-brand-blue border-brand-blue text-white">${s.role}</span></div>`;
            }).join('');
            lucide.createIcons();
        }

        function renderLineupPool() {
            const query = document.getElementById('lineupSearch') ? document.getElementById('lineupSearch').value.toLowerCase() : '';
            const pool = document.getElementById('lineup-pool'); const inst = document.getElementById('lineup-instruction');
            
            if (activeLineupSlot === null) {
                pool.style.opacity = '0.3'; pool.style.pointerEvents = 'none';
                inst.innerText = '1. Ketuk slot formasi di lapangan (Sebelah Kiri)'; inst.className = 'text-[9px] font-bold text-gray-500 uppercase tracking-widest mt-1';
            } else {
                pool.style.opacity = '1'; pool.style.pointerEvents = 'auto';
                const role = FORMATIONS[activeSport][currentFormationKey][activeLineupSlot].role;
                inst.innerHTML = `2. Pilih pemain untuk <span class="text-brand-neon">${role}</span>`; inst.className = 'text-[9px] font-black text-white uppercase tracking-widest mt-1';
            }
            
            const players = rawData[activeSport]?.pemain || []; 
            const assignedIds = Object.values(lineupData).map(p => p.nomor + p.nama);
            
            // FASE UPDATE: Filter Berdasarkan Pencarian di Bursa Pemain
            const filteredPlayers = players.filter(p => (val(p.nama) + val(p.posisi)).toLowerCase().includes(query));

            pool.innerHTML = filteredPlayers.map((p) => {
                const i = players.indexOf(p);
                const isAssigned = assignedIds.includes(p.nomor + p.nama);
                return `<div onclick="assignPlayerToSlot(${i})" class="pool-card flex flex-col items-center gap-2 cursor-pointer ${isAssigned ? 'disabled' : ''}"><div class="w-14 h-14 rounded-full overflow-hidden border-2 border-white/10 bg-black"><img src="${val(p.link_foto)}" class="w-full h-full object-cover"></div><div class="text-center"><p class="text-[8px] font-black text-white uppercase line-clamp-1 w-16 leading-tight">${val(p.nama)}</p><p class="text-[7px] text-brand-neon font-bold mt-0.5">${val(p.posisi)}</p></div></div>`;
            }).join('');
        }

        function selectLineupSlot(idx) { activeLineupSlot = idx; renderLineupPitchSetup(); renderLineupPool(); }
        function assignPlayerToSlot(playerIdx) { if (activeLineupSlot === null) return; const p = rawData[activeSport].pemain[playerIdx]; lineupData[activeLineupSlot] = p; activeLineupSlot = null; document.getElementById('lineupSearch').value = ''; renderLineupPitchSetup(); renderLineupPool(); }
        function resetLineup() { lineupData = {}; activeLineupSlot = null; document.getElementById('lineupSearch').value = ''; renderLineupPitchSetup(); renderLineupPool(); }

        // --- MEDIA HUB LOGIC ---
        function runMediaFilter() {
            const query = document.getElementById('mediaSearch').value.toLowerCase();
            if(!rawData.galeri) return;
            const filtered = rawData.galeri.filter(item => { return val(item.kegiatan).toLowerCase().includes(query) || val(item.tanggal).toLowerCase().includes(query); });
            renderGallery(filtered);
        }
        function renderGallery(list) {
            const grid = document.getElementById('galleryGrid');
            if (!list || list.length === 0) { grid.innerHTML = `<div class="col-span-full py-16 text-center text-[10px] font-black text-gray-500 uppercase tracking-widest border border-dashed border-white/10 rounded-2xl">Kosong</div>`; return; }
            grid.innerHTML = list.map((item, i) => `
                <a href="${item.link_drive}" target="_blank" class="glass-panel rounded-2xl p-3 flex flex-col gap-3 relative overflow-hidden group stagger-item border border-white/5" style="animation-delay: ${i*0.02}s">
                    <div class="relative w-full aspect-video rounded-xl bg-brand-dark overflow-hidden">${item.preview_image ? `<img src="${item.preview_image}" class="w-full h-full object-cover opacity-80 group-hover:opacity-100 transition-transform duration-700">` : '<div class="absolute inset-0 flex items-center justify-center"><i data-lucide="folder" class="w-10 h-10 text-white/10"></i></div>'}<div class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent"></div><div class="absolute bottom-3 left-3 text-white"><h4 class="text-xs font-black uppercase tracking-tight line-clamp-1">${val(item.kegiatan)}</h4><p class="text-[9px] font-bold text-gray-300 uppercase mt-0.5">${val(item.tanggal)}</p></div></div>
                </a>`).join('');
            lucide.createIcons();
        }

        function tutupDossier() { const p = document.getElementById('fullProfilePage'); p.classList.remove('page-slide-in'); setTimeout(() => { p.classList.add('hidden'); document.body.style.overflow = ''; }, 500); }
        function closeModal() { document.getElementById('playerModal').classList.add('hidden'); document.body.style.overflow = ''; }

        // --- SUB IN SEARCH LOGIC (FASE 4) ---
        function renderSubInPool() {
            const listEl = document.getElementById('action-player-list');
            const query = document.getElementById('actionSearch') ? document.getElementById('actionSearch').value.toLowerCase() : '';
            listEl.innerHTML = '';
            
            const allPlayers = rawData[activeSport].pemain;
            const activeIds = Object.values(trackerLineup).filter(player => player).map(player => player.nomor + player.nama);
            
            allPlayers.forEach((benchPlayer, originalIdx) => {
                const searchTxt = (val(benchPlayer.nama) + val(benchPlayer.posisi)).toLowerCase();
                if(!activeIds.includes(benchPlayer.nomor + benchPlayer.nama) && searchTxt.includes(query)) {
                    listEl.innerHTML += `
                    <div onclick="executeSubIn('${originalIdx}')" class="flex flex-col items-center gap-2 cursor-pointer hover:scale-105 transition-transform">
                        <div class="w-14 h-14 md:w-16 md:h-16 rounded-full border-2 border-white/10 bg-black overflow-hidden hover:border-brand-neon transition-all shadow-lg"><img src="${val(benchPlayer.link_foto)}" class="w-full h-full object-cover"></div>
                        <p class="text-[9px] font-black text-white uppercase text-center leading-tight line-clamp-1 w-full px-1">${val(benchPlayer.nama).split(' ')[0]}</p>
                        <p class="text-[7px] text-brand-neon font-bold">${val(benchPlayer.posisi)}</p>
                    </div>`;
                }
            });
        }

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
